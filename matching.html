// ══════════════════════════════════════════════════════════════
//  탭 동적 생성
// ══════════════════════════════════════════════════════════════
function buildTabs() {
  const container = document.getElementById('headerTabs');
  const contentArea = document.querySelector('.content');
  const navTabs = document.getElementById('navTabs');

  // 기존 시트 탭·콘텐츠 제거
  container.querySelectorAll('.sheet-tab').forEach(el => el.remove());
  contentArea.querySelectorAll('.sheet-tab-content').forEach(el => el.remove());
  navTabs.querySelectorAll('.nav-sheet-tab').forEach(el => el.remove());

  // navBar 표시
  document.getElementById('navBar').style.display = 'block';

  const knownOrder = ['전화온라인','부스상담','1차 멘토링','해외인증119','부처애로'];
  const sheetNames = [...knownOrder.filter(n => SHEETS[n]),
    ...Object.keys(SHEETS).filter(n => !knownOrder.includes(n))];

  sheetNames.forEach(name => {
    const cfg = SHEET_CONFIG[name];
    const icon = cfg ? cfg.icon : '📄';
    const label = cfg ? cfg.label : name;
    const count = SHEETS[name].length;

    // 숨겨진 headerTabs (기존 로직 유지)
    const btn = document.createElement('button');
    btn.className = 'tab-btn sheet-tab';
    btn.innerHTML = `${icon} ${label} <span class="cnt">(${count})</span>`;
    btn.onclick = () => showTab('sheet-' + name);
    container.appendChild(btn);

    // 2차 네비 탭
    const navBtn = document.createElement('button');
    navBtn.className = 'nav-tab nav-sheet-tab';
    navBtn.id = 'navtab-sheet-' + name;
    navBtn.innerHTML = `${icon} ${label} <span class="nav-cnt">${count}</span>`;
    navBtn.onclick = () => showTab('sheet-' + name);
    navTabs.appendChild(navBtn);

    // 콘텐츠 영역
    const div = document.createElement('div');
    div.className = 'tab-content sheet-tab-content';
    div.id = 'tab-sheet-' + name;
    div.innerHTML = buildSheetHTML(name);
    contentArea.appendChild(div);

    sheetState[name] = { search: '', filterVal: '전체' };
    setTimeout(() => renderSheetList(name), 50);
  });
}

// ══════════════════════════════════════════════════════════════
//  시트 HTML 구조
// ══════════════════════════════════════════════════════════════
function buildSheetHTML(name) {
  const cfg = SHEET_CONFIG[name] || {};
  const rows = SHEETS[name] || [];
  const filterKey = cfg.filterKey;
  const color = cfg.color || '#2563eb';

  // 필터 옵션
  let filterSelect = '';
  if (filterKey) {
    const vals = [...new Set(rows.map(r => sv(r[filterKey])).filter(Boolean))].sort();
    filterSelect = `<select id="filter-${name}" onchange="onFilter('${name}')">
      <option value="전체">전체 ${filterKey}</option>
      ${vals.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('')}
    </select>`;
  }

  // 테이블 헤더
  const cols = cfg.tableColumns || [];
  const thHtml = cols.map(c =>
    `<th style="width:${c.width||'auto'}">${c.label}</th>`
  ).join('');

  return `
    <div class="sheet-toolbar">
      <input type="text" id="search-${name}" placeholder="🔍 검색..." oninput="onSearch('${name}')">
      ${filterSelect}
      <span class="cnt-badge" id="cnt-${name}">0건</span>
      <button class="rst-btn" onclick="resetSheet('${name}')">초기화</button>
    </div>
    <div class="table-wrap">
      <div class="tbl-scroll">
        <table class="tbl">
          <thead><tr>${thHtml}</tr></thead>
          <tbody id="body-${name}"></tbody>
        </table>
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
//  시트 리스트 렌더
// ══════════════════════════════════════════════════════════════
function getSheetFiltered(name) {
  const cfg = SHEET_CONFIG[name] || {};
  const rows = SHEETS[name] || [];
  const st = sheetState[name];
  const q = st.search.toLowerCase();
  const fv = st.filterVal;
  const searchKeys = cfg.searchKeys || Object.keys(rows[0] || {});
  const filterKey = cfg.filterKey;

  return rows.filter(r => {
    if (filterKey && fv !== '전체' && sv(r[filterKey]) !== fv) return false;
    if (q) return searchKeys.some(k => sv(r[k]).toLowerCase().includes(q));
    return true;
  });
}

function renderSheetList(name) {
  const cfg = SHEET_CONFIG[name] || {};
  const cols = cfg.tableColumns || [];
  const filtered = getSheetFiltered(name);
  const total = filtered.length;

  const cntEl = document.getElementById('cnt-' + name);
  if (cntEl) cntEl.textContent = total + '건';

  const tbody = document.getElementById('body-' + name);
  if (!tbody) return;

  const color = cfg.color || '#2563eb';

  tbody.innerHTML = filtered.map((row, idx) => {
    const cells = cols.map(c => {
      const raw = sv(row[c.key]);
      const masked = maskVal(c.key, raw);
      const isMasked = MASK_ON && masked !== raw;
      let cell = '';
      const nowrapStyle = c.nowrap ? 'white-space:nowrap;' : '';
      const maskedClass = isMasked ? ' masked' : '';
      if (c.isBadge) {
        cell = `<span class="badge ${badgeCls(raw)}">${esc(raw) || '-'}</span>`;
      } else if (c.isDate) {
        cell = `<span style="font-size:11px;color:#6b7280;white-space:nowrap;">${esc(raw)}</span>`;
      } else if (c.bold) {
        cell = `<span style="font-weight:600;color:#1e3a5f;">${esc(raw)}</span>`;
      } else if (c.accent) {
        cell = `<span style="font-weight:600;color:${color};">${esc(raw) || '-'}</span>`;
      } else if (c.muted) {
        cell = `<span class="masked-wrap${maskedClass}" style="color:#6b7280;font-size:11px;${nowrapStyle}">${esc(masked) || '-'}</span>`;
      } else if (c.ellipsis) {
        cell = `<div class="cell-ellipsis" title="${esc(raw)}">${esc(raw) || ''}</div>`;
      } else {
        cell = `<span class="${maskedClass}" style="${nowrapStyle}">${esc(masked) || '-'}</span>`;
      }
      return `<td style="${c.nowrap?'white-space:nowrap;':''}">${cell}</td>`;
    }).join('');
    return `<tr onclick="showRowDetail('${name}', ${idx})">${cells}</tr>`;
  }).join('');
}

function badgeCls(v) {
  if (!v) return 'b-gray';
  if (['상담완료','계약완료','자문종료'].includes(v)) return 'b-done';
  if (['배정완료','배정중','상담중'].includes(v)) return 'b-blue';
  if (['사전진단','이관완료'].includes(v)) return 'b-purple';
  if (['신청철회','지원포기'].includes(v)) return 'b-red';
  if (['상','중'].includes(v)) return v==='상'?'b-red':'b-blue';
  if (v==='하') return 'b-gray';
  if (['K-소비재'].includes(v)) return 'b-blue';
  if (['보조금'].includes(v)) return 'b-purple';
  return 'b-gray';
}

function onSearch(name) {
  sheetState[name].search = document.getElementById('search-' + name).value;
  renderSheetList(name);
}
function onFilter(name) {
  sheetState[name].filterVal = document.getElementById('filter-' + name).value;
  renderSheetList(name);
}
function resetSheet(name) {
  const si = document.getElementById('search-' + name);
  const fi = document.getElementById('filter-' + name);
  if (si) si.value = '';
  if (fi) fi.value = '전체';
  sheetState[name] = { search:'', filterVal:'전체' };
  renderSheetList(name);
}

// ══════════════════════════════════════════════════════════════
//  모달
// ══════════════════════════════════════════════════════════════
function showRowDetail(name, idx) {
  _lastModalArgs = [name, idx];
  const filtered = getSheetFiltered(name);
  const row = filtered[idx];
  if (!row) return;
  const cfg = SHEET_CONFIG[name] || {};
  const color = cfg.color || '#2563eb';

  const companyKey = ['기업명'].find(k => row[k]) || Object.keys(row)[1] || '';
  const company = sv(row[companyKey]);
  const dateKey = cfg.dateKey || '';
  const date = sv(row[dateKey]);

  // 메타 태그
  let tags = '';
  const tagKeys = [cfg.filterKey, '품목','수출국','희망수출국','인증명','희망인증명'].filter(Boolean);
  tagKeys.forEach(k => {
    const v = sv(row[k]);
    if (v && v !== '-') tags += `<span style="font-size:11px;padding:3px 9px;border-radius:6px;background:${color}18;color:${color};font-weight:600;">${esc(v)}</span> `;
  });

  // 정보 그리드
  let gridHtml = '<div class="modal-grid">';
  (cfg.detailSections || []).forEach(sec => {
    (sec.group || []).forEach(([k, label]) => {
      const raw = sv(row[k]);
      if (raw && raw !== '-') {
        const display = maskVal(k, raw);
        const isMasked = MASK_ON && display !== raw;
        gridHtml += `<div class="modal-field"><div class="modal-key">${esc(label)}</div><div class="modal-val${isMasked?' masked':''}">${esc(display)}</div></div>`;
      }
    });
  });
  gridHtml += '</div>';

  // Q&A
  let qaHtml = '';
  if (cfg.qaKeys) {
    const q = sv(row[cfg.qaKeys.q]);
    const a = sv(row[cfg.qaKeys.a]);
    if (q) qaHtml += `<div class="modal-block"><div class="modal-block-label">📝 문의 내용</div><div class="modal-block-text">${esc(q)}</div></div>`;
    if (a) qaHtml += `<div class="modal-block"><div class="modal-block-label">💡 답변 내용</div><div class="modal-block-text answer">${esc(a)}</div></div>`;
    if (!q && !a) qaHtml = `<div style="color:#9ca3af;font-size:12px;">문의·답변 내용 없음</div>`;
  } else {
    // 멘토링 등 Q&A 없는 시트는 남은 긴 필드 표시
    const longKeys = ['신청사유','보유인증명','참여전시회명','문의내용','답변내용'];
    longKeys.forEach(k => {
      const v = sv(row[k]);
      if (v && v !== '-') qaHtml += `<div class="modal-block"><div class="modal-block-label">${esc(k)}</div><div class="modal-block-text">${esc(v)}</div></div>`;
    });
  }

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-header">
      <div>
        <div class="modal-company">${esc(company) || '(기업명 없음)'}</div>
        <div class="modal-meta">${cfg.icon || ''} ${esc(cfg.label || name)} &nbsp;·&nbsp; ${esc(date)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    ${tags ? `<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;">${tags}</div>` : ''}
    ${gridHtml}
    ${qaHtml}
  `;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); }

//  KPI 카드
// ══════════════════════════════════════════════════════════════
function buildKPI() {
  const defs = [
    { key:'전화온라인', label:'전화·온라인', icon:'📱', bg:'#eff6ff', border:'#2563eb', color:'#2563eb' },
    { key:'부스상담',   label:'부스상담',   icon:'🏪', bg:'#f0fdf4', border:'#0e9f6e', color:'#0e9f6e' },
    { key:'1차 멘토링', label:'1차 멘토링', icon:'🎓', bg:'#fffbeb', border:'#f59e0b', color:'#f59e0b' },
    { key:'해외인증119',label:'해외인증119', icon:'🆘', bg:'#fdf2f8', border:'#e74694', color:'#e74694' },
    { key:'부처애로',   label:'부처애로',   icon:'🏛️', bg:'#f5f3ff', border:'#6366f1', color:'#6366f1' },
  ];
  // 기간 필터 적용
  const filterLabel = (DATE_FILTER.from || DATE_FILTER.to)
    ? ` <span style="font-size:10px;color:#2563eb;font-weight:500;">(${(DATE_FILTER.from||'~').replace('-','.')} ~ ${(DATE_FILTER.to||'현재').replace('-','.')})</span>`
    : '';
  const phoneFilt = getFilteredRows(SHEETS['전화온라인']||[], '접수일');
  const boothFilt = getFilteredRows(SHEETS['부스상담']||[], '상담일');
  const mentoFilt = getFilteredRows(SHEETS['1차 멘토링']||[], '접수일');
  const cert119Filt = getFilteredRows(SHEETS['해외인증119']||[], '접수일');
  const minFilt  = getFilteredRows(SHEETS['부처애로']||[], '상담일');
  const filtMap = { '전화온라인':phoneFilt, '부스상담':boothFilt, '1차 멘토링':mentoFilt, '해외인증119':cert119Filt, '부처애로':minFilt };
  const total = Object.entries(filtMap).reduce((s,[,r]) => s + r.length, 0);
  let html = `<div class="card" style="background:#fff;border:1.5px solid #2563eb33;cursor:default" onclick="showTab('overview')">
    <div class="card-icon">💬</div>
    <div><div class="card-label">총 상담건수${filterLabel}</div><div class="card-value" style="color:#2563eb">${total}</div></div>
  </div>`;
  defs.forEach(d => {
    const cnt = (filtMap[d.key] || []).length;
    if (!cnt) return;
    html += `<div class="card" style="background:${d.bg};border:1.5px solid ${d.border}33;" onclick="showTab('sheet-${d.key}')">
      <div class="card-icon">${d.icon}</div>
      <div><div class="card-label">${d.label}</div><div class="card-value" style="color:${d.color}">${cnt}</div>
      <div class="card-sub">클릭하면 목록으로</div></div>
    </div>`;
  });
  document.getElementById('kpiCards').innerHTML = html;
}

// ══════════════════════════════════════════════════════════════
//  차트
// ══════════════════════════════════════════════════════════════
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function renderCharts() {
  const gridC = 'rgba(0,0,0,0.06)', lblC = '#6b7280';
  const base = { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } } };

  const phone = getFilteredRows(SHEETS['전화온라인'] || [], '접수일');
  const booth = getFilteredRows(SHEETS['부스상담'] || [], '상담일');

  // 월별 추이
  const allDates = [...phone.map(r => r['접수일']||''), ...booth.map(r => r['상담일']||'')].filter(Boolean);
  const months = [...new Set(allDates.map(d => d.slice(0,7)))].sort();
  destroyChart('monthChart');
  charts.monthChart = new Chart(document.getElementById('monthChart'), {
    type:'bar',
    data:{
      labels: months.map(m => m.split('-')[1] + '월'),
      datasets:[
        { label:'전화·온라인', data: months.map(m => phone.filter(r => (r['접수일']||'').startsWith(m)).length), backgroundColor:'#2563eb', borderRadius:4, barPercentage:.5 },
        { label:'부스상담', data: months.map(m => booth.filter(r => (r['상담일']||'').startsWith(m)).length), backgroundColor:'#0e9f6e', borderRadius:4, barPercentage:.5 }
      ]
    },
    options:{...base, scales:{ x:{grid:{color:gridC},ticks:{color:lblC,font:{size:11}}}, y:{grid:{color:gridC},ticks:{color:lblC,font:{size:11}},beginAtZero:true} }}
  });
  document.getElementById('monthLegend').innerHTML =
    `<span><span class="legend-dot" style="background:#2563eb"></span>전화·온라인</span>
     <span><span class="legend-dot" style="background:#0e9f6e"></span>부스상담</span>`;

  // 접수 경로
  const chMap = {};
  phone.forEach(r => { const k = sv(r['접수경로'])||'기타'; chMap[k] = (chMap[k]||0)+1; });
  const chE = Object.entries(chMap).sort((a,b) => b[1]-a[1]);
  const chColors = ['#2563eb','#0e9f6e','#f59e0b','#7e3af2','#e74694'];
  destroyChart('channelChart');
  charts.channelChart = new Chart(document.getElementById('channelChart'), {
    type:'doughnut',
    data:{ labels:chE.map(e=>e[0]), datasets:[{ data:chE.map(e=>e[1]), backgroundColor:chColors, borderWidth:0 }] },
    options:{ ...base, cutout:'60%' }
  });
  document.getElementById('channelLegend').innerHTML =
    chE.map((e,i) => `<span><span class="legend-dot" style="background:${chColors[i]||'#94a3b8'}"></span>${esc(e[0])} ${e[1]}</span>`).join('');

  // 진행단계
  const stMap = {};
  phone.forEach(r => { const k = sv(r['진행단계'])||'미확인'; stMap[k] = (stMap[k]||0)+1; });
  const stE = Object.entries(stMap).sort((a,b) => b[1]-a[1]);
  const stColors = ['#0e9f6e','#2563eb','#f59e0b','#7e3af2','#f05252','#94a3b8','#94a3b8'];
  destroyChart('statusChart');
  charts.statusChart = new Chart(document.getElementById('statusChart'), {
    type:'bar',
    data:{ labels:stE.map(e=>e[0]), datasets:[{ data:stE.map(e=>e[1]), backgroundColor:stColors, borderRadius:4 }] },
    options:{ ...base, scales:{ x:{grid:{display:false},ticks:{color:lblC,font:{size:11}}}, y:{grid:{color:gridC},ticks:{color:lblC,font:{size:11}},beginAtZero:true} } }
  });

  // 행사별 (부스)
  const evMap = {};
  booth.forEach(r => { const k = sv(r['행사명'])||'기타'; evMap[k] = (evMap[k]||0)+1; });
  const evE = Object.entries(evMap).sort((a,b) => b[1]-a[1]);
  const maxEv = evE[0]?.[1] || 1;
  const evColors = ['#2563eb','#0e9f6e','#7e3af2','#f59e0b','#e74694','#f05252'];
  document.getElementById('eventBars').innerHTML = evE.map((e,i) => `
    <div class="stat-bar-row">
      <div class="stat-bar-label" title="${esc(e[0])}">${esc(e[0])}</div>
      <div class="stat-bar-track">
        <div class="stat-bar-fill" style="width:${e[1]/maxEv*100}%;background:${evColors[i]||'#94a3b8'}">
          <span>${e[1]}건</span>
        </div>
      </div>
    </div>`).join('');

  // 수출국 Top10 (기간 필터 적용)
  const ctMap = {};
  const allSheetRows = [
    ...phone, ...booth,
    ...getFilteredRows(SHEETS['1차 멘토링']||[], '접수일'),
    ...getFilteredRows(SHEETS['해외인증119']||[], '접수일'),
    ...getFilteredRows(SHEETS['부처애로']||[], '상담일'),
  ];
  allSheetRows.forEach(r => {
    const raw = sv(r['수출국'] || r['희망수출국'] || '');
    raw.split(/[,\/，]/).forEach(c => { c = c.trim(); if(c && c!=='-') ctMap[c] = (ctMap[c]||0)+1; });
  });
  const ctTop = Object.entries(ctMap).sort((a,b) => b[1]-a[1]).slice(0,10);
  destroyChart('countryChart');
  charts.countryChart = new Chart(document.getElementById('countryChart'), {
    type:'bar',
    data:{ labels:ctTop.map(e=>e[0]), datasets:[{ data:ctTop.map(e=>e[1]), backgroundColor:'#2563eb', borderRadius:3, barPercentage:.7 }] },
    options:{ ...base, indexAxis:'y', scales:{ x:{grid:{color:gridC},ticks:{color:lblC,font:{size:11}}}, y:{grid:{display:false},ticks:{color:lblC,font:{size:11}}} } }
  });

  // 인증 Top10
  const crtMap = {};
  allSheetRows.forEach(r => {
    const raw = sv(r['인증명'] || r['희망인증명'] || '');
    raw.split(/[,\/，]/).forEach(c => { c = c.trim(); if(c && c!=='-') crtMap[c] = (crtMap[c]||0)+1; });
  });
  const crtTop = Object.entries(crtMap).sort((a,b) => b[1]-a[1]).slice(0,10);
  destroyChart('certChart');
  charts.certChart = new Chart(document.getElementById('certChart'), {
    type:'bar',
    data:{ labels:crtTop.map(e=>e[0]), datasets:[{ data:crtTop.map(e=>e[1]), backgroundColor:'#7e3af2', borderRadius:3, barPercentage:.7 }] },
    options:{ ...base, indexAxis:'y', scales:{ x:{grid:{color:gridC},ticks:{color:lblC,font:{size:11}}}, y:{grid:{display:false},ticks:{color:lblC,font:{size:11}}} } }
  });
}

// ══════════════════════════════════════════════════════════════
//  탭 전환
// ══════════════════════════════════════════════════════════════
function showTab(name) {
  // 콘텐츠 전환
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  const target = document.getElementById('tab-' + name);
  if (target) target.classList.add('active');

  // 네비 탭 active 동기화
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  const navTarget = document.getElementById('navtab-' + name);
  if (navTarget) navTarget.classList.add('active');
}

function resetToUpload() {
  SHEETS = {};
  ['monthChart','channelChart','statusChart','countryChart','certChart'].forEach(destroyChart);

}

// 외부 HTML 도구를 iframe으로 격리 임베드 (전역/CSS 충돌 없음)
function buildEmbed(key) {
  var meta = SECTION_META[key] || { icon:'🌐', desc:'' };
  var cfg  = EMBEDS[key] || {};
  var sandbox = 'allow-scripts allow-same-origin allow-downloads allow-popups allow-forms allow-modals';

  var newtab = cfg.mode==='url'
    ? '<a class="embed-newtab" href="'+cfg.url+'" target="_blank" rel="noopener">↗ 새 탭에서 열기</a>'
    : '<button class="embed-newtab" onclick="openEmbedNewTab(\''+key+'\')">↗ 새 탭에서 열기</button>';

  var iframe = cfg.mode==='url'
    ? '<iframe id="embedFrame" class="embed-frame" src="'+cfg.url+'" title="'+key+'" sandbox="'+sandbox+'" loading="lazy"></iframe>'
    : '<iframe id="embedFrame" class="embed-frame" title="'+key+'" sandbox="'+sandbox+'"></iframe>';

  return '<div class="page-header"><div class="page-header-left">'
    +   '<h1 class="page-title">'+key+'</h1>'
    +   '<p class="page-desc">'+meta.desc+'</p></div>'

    + '<div class="embed-frame-wrap">'+iframe+'</div>';

// inline 원본 추출: 내장 시 이스케이프했던 닫는 태그(<\/script)를 원복
function embedSource(cfg) {
  var src = document.getElementById(cfg && cfg.sourceId);
  return src ? src.textContent.replace(/<\\\/script/g, '</script') : '';
}

// inline 모드: 내장된 원본을 iframe srcdoc 으로 주입
function hydrateEmbed(key) {
  var cfg = EMBEDS[key];
  if (!cfg || cfg.mode!=='inline') return;
  var fr = document.getElementById('embedFrame');
  if (fr) fr.srcdoc = embedSource(cfg);
}

// inline 모드: 새 탭으로 열기 (원본을 blob URL 로 생성)
function openEmbedNewTab(key) {
  var cfg = EMBEDS[key];
  if (cfg && cfg.mode==='url') { window.open(cfg.url,'_blank','noopener'); return; }
  var html = embedSource(cfg);
  if (!html) return;
  var blob = new Blob([html], {type:'text/html'});

}

// ══ 날짜 유틸 ══
function toDateStr(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function normDate(raw) {
  if (!raw) return '';
  var s = String(raw).trim();
  // 이미 yyyy-MM-dd 형식
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // yyyy-MM-dd HH:mm:ss 형식 → 앞 10자리만
  if (/^\d{4}-\d{2}-\d{2} /.test(s)) return s.slice(0, 10);
  // Date 파싱 시도
  var d = new Date(s);
  return isNaN(d.getTime()) ? s.slice(0, 10) : toDateStr(d);
}
function dispDate(raw) {
  var n = normDate(raw); if (!n) return String(raw||'');
  var d = new Date(n+'T00:00:00'); if (isNaN(d.getTime())) return n;
  return n.replace(/-/g,'.')+' ('+KO_DAYS[d.getDay()]+')';
}
function dispDateShort(raw) {
  var n = normDate(raw); if (!n) return String(raw||'');
  var d = new Date(n+'T00:00:00'); if (isNaN(d.getTime())) return n;
  return n.slice(5).replace('-','.')+' ('+KO_DAYS[d.getDay()]+')';
}

// ── normalizeTimeValue ──
// 시간목록 split 직후 각 항목을 정제 → "11:00" 형태만 남기고 raw Date 문자열 제거
function normalizeTimeValue(raw) {
  if (!raw) return '';
  var s = String(raw).trim();
  // 이미 HH:MM 형태면 그대로 반환
  if (/^\d{1,2}:\d{2}$/.test(s)) return s;
  // raw Date 블록 제거 ("Sat Dec 30 1899 11:00:00 GMT+0827 (한국 표준시)")
  s = s.replace(/(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\s+\S+\s+\d{1,2}\s+\d{4}\s+[\d:]+\s+GMT[^\s]*(\s+\([^)]*\))?/gi, ' ');
  // 1899·1900 연도 잔재 제거
  s = s.replace(/\b(1899|1900)\b[^\r\n]*/g, '');
  s = s.trim();
  // HH:MM 추출
  var m = s.match(/\b(\d{1,2}):(\d{2})\b/);
  if (m) return String(parseInt(m[1])).padStart(2, '0') + ':' + m[2];
  return '';
}
// ── formatTimeValue: Date 객체/1899 raw string → HH:mm ──
function formatTimeValue(value) {
  if (!value) return '';
  if (value instanceof Date) {
    return String(value.getHours()).padStart(2,'0') + ':' + String(value.getMinutes()).padStart(2,'0');
  }
  var s = String(value);
  if (/1899|1900/.test(s) || /^(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\s/i.test(s)) {
    var m = s.match(/(\d{1,2}):(\d{2})(?::\d{2})?/);
    return m ? String(parseInt(m[1])).padStart(2,'0') + ':' + m[2] : '';
  }
  var m2 = s.match(/(\d{1,2}):(\d{2})/);
  return m2 ? String(parseInt(m2[1])).padStart(2,'0') + ':' + m2[2] : s;
}
// ── 전역 cleanScheduleText ──
// raw Date 문자열("Sat Dec 30 1899 11:00:00 GMT+0827...") 이 혼합된 확정슬롯 값을
// "2026.06.08 (월) 11:00" 형태로 정제해 반환. 어디서든 호출 가능.
function cleanScheduleText(raw) {
  if (!raw) return '';
  var s = String(raw);
  // 영문 요일로 시작하는 raw Date 블록 제거 ("Sat Dec 30 1899 11:00:00 GMT+0827 (한국 표준시)")
  s = s.replace(/(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\s+\S+\s+\d{1,2}\s+\d{4}\s+[\d:]+\s+GMT[^\s]*(\s+\([^)]*\))?/gi, ' ');
  // 1899·1900 연도 잔재 제거
  s = s.replace(/\b(1899|1900)\b[^\n]*/g, '');
  s = s.trim();
  // yyyy.MM.dd 또는 yyyy-MM-dd 날짜 추출
  var dm = s.match(/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
  // HH:MM 시간 추출
  var tm = s.match(/(?<![\d.])(\d{1,2}):(\d{2})(?!\d)/);
  if (dm) {
    var yyyy = dm[1];
    var mm   = String(parseInt(dm[2])).padStart(2, '0');
    var dd   = String(parseInt(dm[3])).padStart(2, '0');
    var d    = new Date(yyyy + '-' + mm + '-' + dd + 'T00:00:00');
    var base = yyyy + '.' + mm + '.' + dd + ' (' + KO_DAYS[d.getDay()] + ')';
    if (tm) base += ' ' + String(parseInt(tm[1])).padStart(2,'0') + ':' + tm[2];
    return base;
  }
  if (tm) return String(parseInt(tm[1])).padStart(2,'0') + ':' + tm[2];
  return '';
}

function buildDetail(matchId) {
  var m=DATA.matches.find(function(x){return x['매칭ID']===matchId;});
  if(!m) return '<div style="padding:20px;color:#94a3b8;">매칭 정보를 찾을 수 없습니다.</div>';
  var stat=m['상태']||'기업입력대기';
  var c=STATUS_CFG[stat]||{bg:'#f1f5f9',color:'#374151'};
  var candSlots = getCompanyCandidateSlots(matchId);
  var expSel    = getExpertSelectedSlot(matchId);

  var compHas = candSlots.length > 0;
  var expHas  = !!expSel;
  var isDone  = (stat==='확정완료'||stat==='상담완료');

  // 다음 조치 문구 (새 흐름)
  var nextAction = '';
  var nextBadge  = '';
  if (stat === '기업입력대기') {
    nextAction = '기업 후보시간 미입력 — 기업 담당자에게 후보시간 입력 요청 필요';
    nextBadge  = 'warn';
  } else if (stat === '전문가선택대기') {
    nextAction = '기업 후보시간 ' + candSlots.length + '개 입력됨 — 전문가 선택 요청 중';
    nextBadge  = 'wait';
  } else if (stat === '확정대기') {
    nextAction = '전문가 선택 완료(' + (expSel?expSel.label:'') + ') — 관리자 최종 확정 필요';
    nextBadge  = 'ok';
  } else if (stat === '확정완료') {
    nextAction = '일정이 확정되었습니다. 상담 진행 후 상담완료 처리하세요.';
    nextBadge  = 'done';
  } else if (stat === '상담완료') {
    nextAction = '상담이 완료되었습니다.';
    nextBadge  = 'done';
  } else if (stat === '취소') {
    nextAction = '취소된 매칭입니다.';
    nextBadge  = 'warn';
  }

  var nextColor  = nextBadge==='ok' ? '#5b21b6' : nextBadge==='done' ? '#1e40af' : nextBadge==='wait' ? '#14532d' : '#92400e';
  var nextBg     = nextBadge==='ok' ? '#f5f3ff' : nextBadge==='done' ? '#eff6ff' : nextBadge==='wait' ? '#f0fdf4' : '#fffbeb';
  var nextBorder = nextBadge==='ok' ? '#ddd6fe' : nextBadge==='done' ? '#bfdbfe' : nextBadge==='wait' ? '#86efac' : '#fde68a';
  var nextIcon   = nextBadge==='ok' ? '🟣' : nextBadge==='done' ? '🎉' : nextBadge==='wait' ? '📩' : '⚠️';

  // 상태 요약 한 줄
  var statusSummary = (compHas?'기업 후보 '+candSlots.length+'개 입력':'기업 입력 대기')
    + ' · ' + (expHas?'전문가 선택완료':'전문가 선택 대기');

  return '<div class="det2-wrap">'

    // ── 상단 헤더 ──
    +'<div class="det2-header">'
      +'<div class="det2-header-left">'
        +'<div class="det2-breadcrumb">매칭관리 <span class="det2-bc-sep">/</span> 상세보기</div>'
        +'<div class="det2-title-row">'
          +'<h1 class="det2-title">'+esc(m['기업명'])+' ↔ '+esc(m['전문가명'])+'</h1>'
          +'<span class="det2-status-badge" style="background:'+c.bg+';color:'+c.color+';">'+stat+'</span>'
        +'</div>'
        +'<div class="det2-status-summary">'+statusSummary+'</div>'
        // 다음 조치 chip
        +'<div class="det2-next-action" style="background:'+nextBg+';border-color:'+nextBorder+';color:'+nextColor+';">'
          +nextIcon+' <strong>다음 조치</strong>: '+esc(nextAction)
        +'</div>'
      +'</div>'
      +'<div class="det2-header-actions">'
        +(isDone
          ? (stat==='확정완료'
              ?'<button class="det2-btn det2-btn-cancel" id="doneBtn-'+matchId+'" onclick="markDone(&quot;'+matchId+'&quot;)" style="background:#dbeafe;border-color:#93c5fd;color:#1e3a8a;">🏁 상담완료 처리</button>'
              :'')
          : (stat!=='취소'
              ?'<button class="det2-btn det2-btn-cancel" onclick="cancelMatch(&quot;'+matchId+'&quot;)">✕ 취소</button>'
              :'<button class="det2-btn det2-btn-delete" onclick="deleteMatch(&quot;'+matchId+'&quot;)">🗑 삭제</button>'))
      +'</div>'
    +'</div>'

    // ── 1단: 기업/전문가 정보 카드 ──
    +'<div class="det2-two-col">'
      // 기업 정보
      +'<div class="det2-card">'
        +'<div class="det2-card-hdr">'
          +'<div class="det2-card-icon det2-icon-corp">🏢</div>'
          +'<div class="det2-card-hdr-text">'
            +'<div class="det2-card-title">기업 정보</div>'
            +'<div class="det2-card-sub">담당자 및 연락처</div>'
          +'</div>'
        +'</div>'
        +'<div class="det2-fields">'
          +'<div class="det2-field"><span class="det2-label">기업명</span><span class="det2-value">'+esc(m['기업명']||'-')+'</span></div>'
          +'<div class="det2-field"><span class="det2-label">기업담당자</span><span class="det2-value">'+esc(m['기업담당자']||'-')+'</span></div>'
          +'<div class="det2-field"><span class="det2-label">기업이메일</span><span class="det2-value det2-email">'+esc(m['기업이메일']||'-')+'</span></div>'
          +'<div class="det2-field"><span class="det2-label">희망인증</span><span class="det2-value">'+esc(m['희망인증']||'-')+'</span></div>'
        +'</div>'
      +'</div>'
      // 전문가 정보
      +'<div class="det2-card">'
        +'<div class="det2-card-hdr">'
          +'<div class="det2-card-icon det2-icon-exp">👨‍💼</div>'
          +'<div class="det2-card-hdr-text">'
            +'<div class="det2-card-title">전문가 정보</div>'
            +'<div class="det2-card-sub">전문가 및 연락처</div>'
          +'</div>'
        +'</div>'
        +'<div class="det2-fields">'

// ── 기업 후보시간 박스 ──
function buildCandidateBox(m, candSlots) {

  var badgeHtml = has
    ? '<span class="det2-avail-badge det2-avail-ok">✓ ' + candSlots.length + '개 입력</span>'
    : '<span class="det2-avail-badge det2-avail-empty">기업 입력 대기</span>';

  var bodyHtml;
  if (has) {
    // 날짜별 그룹핑
    var byDate = {};
    candSlots.forEach(function(s){ (byDate[s.date]=byDate[s.date]||[]).push(s.time); });
    var groupHtml = Object.keys(byDate).sort().map(function(date, idx){
      return '<div class="det2-avail-date-block' + (idx > 0 ? ' det2-avail-divider' : '') + '">'

  } else {
    bodyHtml = '<div class="det2-avail-empty-state">'
      + '<div class="det2-avail-empty-icon">🏢</div>'
      + '<div class="det2-avail-empty-msg">기업 입력 대기</div>'
      + '<div class="det2-avail-empty-sub">기업 담당자에게 후보시간 입력 요청이 필요합니다.</div>'
      + '</div>';
  }

  var cardCls = has ? 'det2-avail-card det2-avail-has' : 'det2-avail-card det2-avail-miss';

      + '</div>'

function buildAdminCalendar(dateOptions,slots,selDate) {
  var availSet={};
  dateOptions.forEach(function(d){availSet[d]=true;});
  var months={};
  dateOptions.forEach(function(d){var ym=d.slice(0,7);if(!months[ym])months[ym]=[];months[ym].push(d);});
  var html='';
  Object.keys(months).sort().forEach(function(ym){
    var year=parseInt(ym.slice(0,4)),month=parseInt(ym.slice(5,7));
    var firstDay=new Date(year,month-1,1).getDay();
    var lastDate=new Date(year,month,0).getDate();
    html+='<div class="cal-month-title">'+year+'년 '+month+'월</div>';
    html+='<div class="cal-grid">';
    KO_DAYS.forEach(function(d,i){html+='<div class="cal-day-hdr'+(i===0?' sun':i===6?' sat':'')+'" >'+d+'</div>';});
    for(var e=0;e<firstDay;e++) html+='<div></div>';
    for(var day=1;day<=lastDate;day++){
      var dd=ym+'-'+String(day).padStart(2,'0');
      var dow=new Date(dd+'T00:00:00').getDay();
      var isAvail=!!availSet[dd];
      var isSel=dd===selDate;
      var hasSlots=slots[dd]&&slots[dd].length>0;
      var dowCls=dow===0?' sun-col':dow===6?' sat-col':'';
      if(isAvail){
        var cls='cal-cell avail'+dowCls+(isSel?' selected':hasSlots?' has-slots':'');
        html+='<div id="admcal-'+dd+'" class="'+cls+'" onclick="selectDate(\x27'+dd+'\x27)"><span>'+day+'</span>'+(hasSlots&&!isSel?'<span class="cal-dot"></span>':'')+(isSel?'<span class="cal-dot"></span>':'')+'</div>';
      } else {
        html+='<div class="cal-cell disabled'+dowCls+'">'+day+'</div>';
      }
    }
    html+='</div><div style="margin-bottom:14px;"></div>';
  });
  return html;
}

// ══ API ══
function submitAdd(){
  var keys=['기업명','기업담당자','기업이메일','기업연락처','전문가명','전문가이메일','전문분야','희망인증','메모'];
  var data={};
  keys.forEach(function(k){var el=document.getElementById('fi-'+k);data[k]=el?el.value.trim():'';});
  var req=['기업명','기업담당자','기업이메일','전문가명','전문가이메일'];
  for(var i=0;i<req.length;i++){if(!data[req[i]]){toast(req[i]+' 은(는) 필수 입력입니다.','warning');return;}}
  if(!lock()) return;                               // 중복 전송 방지
  var btn=document.getElementById('submitAddBtn');
  var label = btn ? btn.textContent : '';
  if(btn){btn.textContent='전송 중...';btn.disabled=true;}
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'addMatch',data:data})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.ok){
        data['매칭ID']=res.matchId;data['상태']='기업입력대기';data['생성일시']=new Date().toLocaleString('ko-KR');
        DATA.matches.push(data);VIEW.page='list';render();
        toast('매칭이 추가되었습니다. 기업 담당자에게 후보시간 입력 링크가 발송되었습니다.','success');
        silentReload();
      } else {
        toast('오류: '+(res.error||res.message||'알 수 없는 오류'),'error');
        if(btn){btn.textContent=label;btn.disabled=false;}   // 원래 라벨 복원
      }
    })
    .catch(function(err){ toast('네트워크 오류: '+err.message,'error'); if(btn){btn.textContent=label;btn.disabled=false;} })
    .finally(unlock);
}

// 관리자 최종 확정: 전문가가 선택한 시간을 확정 (action: confirmSelectedSlot)
function confirmSelectedSlot(matchId,meetType){
  var sel=getExpertSelectedSlot(matchId);
  if(!sel){toast('전문가가 선택한 시간이 없습니다.','warning');return;}
  if(!confirm('['+sel.label+'] '+meetType+'으로 일정을 최종 확정하시겠습니까?')) return;
  if(!lock()) return;
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'confirmSelectedSlot',data:{matchId:matchId,상담방식:meetType}})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.ok){
        var m=DATA.matches.find(function(x){return x['매칭ID']===matchId;});
        if(m){m['상태']='확정완료';m['확정슬롯']=sel.label;m['상담방식']=meetType;}
        render();
        toast('일정이 확정되었습니다. 기업·전문가에게 확정 메일이 발송되었습니다.','success');
        silentReload();
      }
      else{toast('오류: '+(res.error||res.message||'알 수 없는 오류'),'error');}
    })

// 상담완료 처리 (action: markDone)
function markDone(matchId){
  if(!confirm('이 매칭을 상담완료로 처리하시겠습니까?')) return;
  if(!lock()) return;
  var btn=document.getElementById('doneBtn-'+matchId);
  if(btn){btn.textContent='처리 중...';btn.disabled=true;}
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'markDone',matchId:matchId})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.ok){
        var m=DATA.matches.find(function(x){return x['매칭ID']===matchId;});
        if(m)m['상태']='상담완료';
        render();
        toast('상담완료로 처리되었습니다.','success');
        silentReload();
      } else {
        toast('오류: '+(res.error||res.message||'알 수 없는 오류'),'error');
        if(btn){btn.textContent='🏁 상담완료 처리';btn.disabled=false;}
      }
    })
    .catch(function(err){toast('네트워크 오류: '+err.message,'error');if(btn){btn.textContent='🏁 상담완료 처리';btn.disabled=false;}})
    .finally(unlock);
}

function cancelMatch(matchId){

}

function deleteMatch(matchId){
  if(!confirm('이 매칭을 목록에서 삭제합니다.\n(데이터는 보관되며 목록에서만 제외됩니다) 계속하시겠습니까?')) return;
  if(!lock()) return;
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'deleteMatch',matchId:matchId})})
    .then(function(r){return r.json();})

function loadAvailPage(matchId,role){
  var sc=document.getElementById('availScreen');
  sc.innerHTML='<div style="padding:60px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>';
  fetch(SCRIPT_URL)
    .then(function(r){return r.json();})
    .then(function(data){
      var match=(data['멘토링_매칭']||[]).find(function(m){return String(m['매칭ID'])===String(matchId);});
      if(!match){sc.innerHTML=infoScreen('❌','유효하지 않은 링크입니다.','');return;}
      if(match['상태']==='취소'){sc.innerHTML=infoScreen('🚫','취소된 매칭입니다.','담당자에게 문의해주세요.');return;}
      if(match['상태']==='확정완료'||match['상태']==='상담완료'){
        sc.innerHTML=infoScreen('✅','이미 일정이 확정되었습니다.','확정 일정: '+esc(cleanScheduleText(match['확정슬롯'])||match['확정슬롯']||''),'#e8f5ef','#155a38');
        return;
      }
      var companySlots=(data['기업후보시간']||[]).filter(function(a){return String(a['매칭ID'])===String(matchId);});
      var expertSlots =(data['전문가선택시간']||[]).filter(function(a){return String(a['매칭ID'])===String(matchId);});

      if(role==='전문가'){

}

// ── 기업 담당자: 상담 후보시간 다중 입력 ──
function renderCompanyInput(match, companySlots){
  var sc=document.getElementById('availScreen');
  var name=match['기업담당자'];
  var matchId=match['매칭ID'];
  var alreadySub=companySlots.length>0;

  var dateOptions=[];
  var today=new Date();
  for(var i=1;i<=60;i++){
    var d=new Date(today);d.setDate(today.getDate()+i);
    if(d.getDay()===0||d.getDay()===6) continue;
    dateOptions.push(toDateStr(d));
  }

  window._availSlots={};
  window._availMatchId=matchId;
  window._availRole='기업';
  window._availName=name;
  window._lastMatch=match;
  window._lastRole='기업';
  window._lastName=name;
  window._lastDateOpts=dateOptions;
  window._availMonthOffset=0;

  if(alreadySub){
    // 기존 후보시간 미리 채우기 (재입력 시 교체)
    companySlots.forEach(function(a){
      var dt=normDate(a['날짜']);
      var t=normalizeTimeValue(a['시간'])||formatTimeValue(a['시간']);
      if(dt&&t){ if(!window._availSlots[dt]) window._availSlots[dt]=[]; if(window._availSlots[dt].indexOf(t)===-1) window._availSlots[dt].push(t); }
    });
  }
  window._availSelDate=dateOptions[0]||'';
  sc.innerHTML=buildAvailPageHTML(match,'기업',name,dateOptions,alreadySub);
}

// ── 전문가: 기업 후보시간 중 1개 선택 ──
function renderExpertSelect(match, companySlots, expertSlots){
  var sc=document.getElementById('availScreen');
  var matchId=match['매칭ID'];

  // 기업 후보시간 미입력
  if(!companySlots.length){
    sc.innerHTML=infoScreen('⏳','아직 기업 후보시간이 입력되지 않았습니다.','기업 담당자가 상담 후보시간을 입력하면<br>선택하실 수 있습니다. 잠시 후 다시 접속해주세요.','#f0faf5','#1a6640');
    return;
  }
  // 이미 선택 완료 → 중복 제출 방지
  if(expertSlots.length){
    var last=expertSlots[expertSlots.length-1];
    var lbl=dispDate(normDate(last['선택날짜']))+' '+(normalizeTimeValue(last['선택시간'])||formatTimeValue(last['선택시간']));
    sc.innerHTML=infoScreen('✅','이미 시간을 선택하셨습니다.','선택한 시간: <b>'+esc(lbl)+'</b><br>관리자 확정 후 안내드릴 예정입니다.','#e8f5ef','#155a38');
    return;
  }

  // 후보시간 목록 정리 (날짜+시간 단위)
  var cand=companySlots.map(function(r){
    var date=normDate(r['날짜']);
    var time=normalizeTimeValue(r['시간'])||formatTimeValue(r['시간']);
    return { date:date, time:time };
  }).filter(function(s){return s.date&&s.time;});
  var seen={},uniq=[];
  cand.forEach(function(s){var k=s.date+' '+s.time;if(!seen[k]){seen[k]=true;uniq.push(s);}});
  uniq.sort(function(a,b){return a.date.localeCompare(b.date)||a.time.localeCompare(b.time);});

  window._expMatch=match;
  window._expMatchId=matchId;
  window._expName=match['전문가명'];
  window._expCand=uniq;
  window._expSelKey='';   // 선택한 "date time" 키
  sc.innerHTML=buildExpertSelectHTML(match, uniq);
}

function buildAvailPageHTML(match,role,name,dateOptions,alreadySub){
  var color = role==='기업' ? '#2d7a55' : '#1a6640';
  var icon  = role==='기업' ? '🏢' : '👨\u200d💼';
  var other = role==='기업' ? match['전문가명'] : match['기업명'];
  var KD    = ['일','월','화','수','목','금','토'];

  // ── 달력: 2개월씩 묶어 2열 렌더링 ──
  var availSet = {};
  dateOptions.forEach(function(d){ availSet[d] = true; });
  var months = {};
  dateOptions.forEach(function(d){ var ym=d.slice(0,7); if(!months[ym])months[ym]=[]; months[ym].push(d); });

  var monthKeys = Object.keys(months).sort();
  // 기본 2개월만 표시 (월 오프셋 기반)
  var _mo = window._availMonthOffset || 0;
  var visibleMonthKeys = monthKeys.slice(_mo, _mo + 2);
  if (visibleMonthKeys.length === 0) visibleMonthKeys = monthKeys.slice(0, 2);
  var hasPrev = _mo > 0;
  var hasNext = _mo + 2 < monthKeys.length;

  var calHtml = '<div class="av2-cal-grid">';
  visibleMonthKeys.forEach(function(ym){
    var year=parseInt(ym.slice(0,4)), month=parseInt(ym.slice(5,7));
    var firstDay=new Date(year,month-1,1).getDay();
    var lastDate=new Date(year,month,0).getDate();
    calHtml += '<div class="av2-month-block">';
    calHtml += '<div class="av2-month-title">'+year+'년 '+month+'월</div>';
    calHtml += '<div class="av2-dow-row">';
    KD.forEach(function(d,i){ calHtml+='<div class="av2-dow'+(i===0?' av2-sun':i===6?' av2-sat':'')+'">'+d+'</div>'; });
    calHtml += '</div><div class="av2-days-grid">';
    for(var e=0;e<firstDay;e++) calHtml+='<div></div>';
    for(var day=1;day<=lastDate;day++){
      var dd=ym+'-'+String(day).padStart(2,'0');
      var dow=new Date(dd+'T00:00:00').getDay();
      var isAvail=!!availSet[dd];
      var isSel=dd===window._availSelDate;
      var hasSlots=window._availSlots[dd]&&window._availSlots[dd].length>0;
      var dowCls=(dow===0?' av2-sun':dow===6?' av2-sat':'');
      if(isAvail){
        var cls='av2-day avail'+dowCls+(isSel?' selected':hasSlots?' has-slots':'');
        calHtml+='<div id="datebtn-'+dd+'" class="'+cls+'" tabindex="-1" onclick="selectAvailDate(\''+dd+'\')">'+day+(hasSlots?'<span class="av2-dot"></span>':'')+'</div>';
      } else {
        calHtml+='<div class="av2-day disabled'+dowCls+'" tabindex="-1">'+day+'</div>';
      }
    }
    calHtml += '</div></div>';
  });
  calHtml += '</div>';

  // ── 시간 버튼 ──
  var selLabel = window._availSelDate ? dispDate(window._availSelDate) : '날짜를 먼저 선택하세요';
  var timeHtml = HOURS.map(function(h){
    var isOn = window._availSlots[window._availSelDate] && window._availSlots[window._availSelDate].includes(h);
    return '<button onclick="toggleAvailTime(\''+h+'\')" id="timebtn-'+h.replace(':','-')+'" class="av2-time-btn'+(isOn?' on':'')+'">'+formatTimeValue(h)+(isOn?'<span class="av2-check"> ✓</span>':'')+'</button>';
  }).join('');

  // ── 선택 요약 전체 카운트 (액션 바용) ──
  var totalCnt = Object.values(window._availSlots||{}).filter(function(v){return v.length>0;}).length;
  var firstEntry = Object.entries(window._availSlots||{}).filter(function(e){return e[1].length>0;}).sort()[0];
  var previewText = firstEntry
    ? firstEntry[0].slice(5).replace('-','.') + '(' + KD[new Date(firstEntry[0]+'T00:00:00').getDay()] + ') ' + formatTimeValue(firstEntry[1][0])
    : '';
  var extraCnt = totalCnt > 1 ? ' 외 '+(totalCnt-1)+'건' : '';

  return (
    '<div class="av2-wrap">'
    +'<div class="av2-container">'

    // ── 헤더 카드 ──
    +'<div class="av2-header">'
      +'<div class="av2-header-left">'
        +'<div class="av2-avatar">'+icon+'</div>'
        +'<div class="av2-header-info">'
          +'<div class="av2-header-top">'
            +'<span class="av2-step-badge">STEP 1</span>'

function buildAgendaListHTML(){
  var KD=['일','월','화','수','목','금','토'];
  var entries=Object.entries(window._availSlots||{}).filter(function(e){return e[1].length>0;}).sort(function(a,b){return a[0].localeCompare(b[0]);});

  // 총 건수 업데이트
  var cnt = entries.length;
  var chip = document.getElementById('totalChip');
  if(chip) chip.textContent = '총 '+cnt+'건 선택';
  var actionCnt = document.getElementById('actionCnt');
  if(actionCnt) actionCnt.textContent = cnt;
  var previewChip = document.getElementById('previewChip');
  var extraCnt    = document.getElementById('extraCnt');
  if(previewChip){
    if(entries.length>0){
      var fe=entries[0];
      var d0=new Date(fe[0]+'T00:00:00');
      previewChip.textContent = fe[0].slice(5).replace('-','.')+' ('+KD[d0.getDay()]+') '+formatTimeValue(fe[1][0]);
      if(extraCnt) extraCnt.textContent = cnt>1?'외 '+(cnt-1)+'건':'';
    } else {
      previewChip.textContent='';
      if(extraCnt) extraCnt.textContent='';
    }
  }

  if(!entries.length){
    return '<div class="av2-agenda-empty">'
      +'<div style="font-size:32px;margin-bottom:8px;">🗓️</div>'
      +'<div style="font-weight:800;font-size:13px;color:#374151;margin-bottom:4px;">선택한 일정이 없습니다</div>'
      +'<div style="font-size:12px;color:#94a3b8;">날짜를 선택한 뒤<br>가능한 시간을 눌러주세요</div>'
      +'</div>';
  }

  var rows = entries.map(function(e){
    var d   = new Date(e[0]+'T00:00:00');
    var dow = KD[d.getDay()];
    var mo  = e[0].slice(5,7);
    var day = e[0].slice(8);
    var lbl = mo+'.'+day+' ('+dow+')';
    var chips = e[1].map(function(t){
      return '<span class="av2-agenda-time">'+formatTimeValue(t)+'</span>';
    }).join('');
    return '<div class="av2-agenda-item">'
      +'<div class="av2-agenda-date">'
        +'<div class="av2-agenda-dot">●</div>'
        +'<div class="av2-agenda-lbl">'+lbl+'</div>'
      +'</div>'
      +'<div class="av2-agenda-times">'+chips+'</div>'
      +'<button class="av2-agenda-del" onclick="(function(){delete window._availSlots[\''+e[0]+'\'];var el=document.getElementById(\'agendaList\');if(el)el.innerHTML=buildAgendaListHTML();var cal=document.getElementById(\'datebtn-'+e[0]+'\');if(cal){cal.className=\'av2-day avail\';cal.innerHTML=\''+parseInt(e[0].slice(8))+'\';}})()" title="삭제">✕</button>'
    +'</div>';
  }).join('');

  return rows;
}

function selectAvailDate(date){
  window._availSelDate=date;
  document.querySelectorAll('[id^="datebtn-"]').forEach(function(el){
    var d=el.id.replace('datebtn-','');
    var has=window._availSlots[d]&&window._availSlots[d].length>0;
    var sel=d===date;
    var dow=new Date(d+'T00:00:00').getDay();
    el.className='av2-day avail'+(dow===0?' av2-sun':dow===6?' av2-sat':'')
      +(sel?' selected':has?' has-slots':'');
    el.setAttribute('tabindex','-1');
    el.innerHTML=parseInt(d.slice(8))+(has?'<span class="av2-dot"></span>':'');
  });
  var t=document.getElementById('timeTitle');
  if(t) t.textContent='📅 '+dispDate(date);
  HOURS.forEach(function(h){
    var btn=document.getElementById('timebtn-'+h.replace(':','-'));
    if(!btn) return;
    var isOn=window._availSlots[date]&&window._availSlots[date].includes(h);
    btn.className='av2-time-btn'+(isOn?' on':'');
    btn.innerHTML=h+(isOn?'<span class="av2-check">✓</span>':'');
  });
}

function toggleAvailTime(time){
  var date=window._availSelDate; if(!date) return;
  if(!window._availSlots[date]) window._availSlots[date]=[];
  var idx=window._availSlots[date].indexOf(time);
  if(idx>-1) window._availSlots[date].splice(idx,1);
  else{window._availSlots[date].push(time);window._availSlots[date].sort();}

  var btn=document.getElementById('timebtn-'+time.replace(':','-'));
  if(btn){var isOn=window._availSlots[date].includes(time);btn.className='av2-time-btn'+(isOn?' on':'');}

  var calBtn=document.getElementById('datebtn-'+date);
  if(calBtn){
    var has=window._availSlots[date].length>0;
    var sel=date===window._availSelDate;
    var cdow=new Date(date+'T00:00:00').getDay();
    calBtn.className='av2-day avail'+(cdow===0?' av2-sun':cdow===6?' av2-sat':'')
      +(sel?' selected':has?' has-slots':'');
    calBtn.innerHTML=parseInt(date.slice(8))+(has?'<span class="av2-dot"></span>':'');
  }
  var agEl=document.getElementById('agendaList');
  if(agEl) agEl.innerHTML=buildAgendaListHTML();
}

// 기업 담당자: 후보시간 제출 (action: submitCompanySlots)
function submitAvailPage(){
  var entries=Object.entries(window._availSlots||{}).filter(function(e){return e[1].length>0;});
  if(!entries.length){toast('최소 1개 이상의 후보시간을 선택해주세요.','warning');return;}
  if(!lock()) return;
  var btn=document.getElementById('submitAvailBtn');
  if(btn){btn.textContent='제출 중...';btn.disabled=true;}
  var data={matchId:window._availMatchId,입력자명:window._availName,slots:entries.map(function(e){return{date:e[0],times:e[1]};})};
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'submitCompanySlots',data:data})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.ok){
        document.getElementById('availScreen').innerHTML=
          '<div style="min-height:calc(100vh-60px);display:flex;align-items:center;justify-content:center;background:#f1f5f9;">'
          +'<div style="text-align:center;padding:48px;background:#fff;border-radius:22px;box-shadow:0 6px 28px rgba(0,0,0,.1);max-width:440px;width:90%;">'
          +'<div style="font-size:60px;margin-bottom:20px;">✅</div>'
          +'<div style="font-size:20px;font-weight:900;color:#1a3d2b;margin-bottom:10px;">후보시간이 제출되었습니다!</div>'
          +'<div style="font-size:14px;color:#64748b;line-height:1.8;">전문가에게 선택 요청이 발송되었습니다.<br>전문가가 가능한 시간을 선택하면<br>관리자가 확정 후 안내드릴 예정입니다.</div>'
          +'<div style="margin-top:22px;padding:16px;background:#e8f5ef;border-radius:12px;">'
          +entries.map(function(e){return '<div class="avail-row"><span class="avail-date-lbl" style="font-size:13px;color:#155a38;">'+dispDate(e[0])+'</span><div class="avail-times">'+e[1].map(function(t){return '<span class="time-chip" style="background:rgba(5,150,105,.1);color:#155a38;">'+t+'</span>';}).join('')+'</div></div>';}).join('')
          +'</div>'
          +'<div style="margin-top:20px;font-size:12px;color:#94a3b8;">문의: 해외인증지원단 02-6240-4777</div>'
          +'</div></div>';
      } else {
        toast('오류: '+(res.error||res.message||'다시 시도해주세요.'),'error');
        if(btn){btn.textContent='후보시간 제출하기 →';btn.disabled=false;}
      }
    })
    .catch(function(err){toast('네트워크 오류: '+err.message,'error');if(btn){btn.textContent='후보시간 제출하기 →';btn.disabled=false;}})
    .finally(unlock);
}

// ══ 유틸 ══
// 기업이 입력한 상담 후보시간 목록 (날짜+시간 단위) — [기업후보시간] 시트 기반
function getCompanyCandidateSlots(matchId){
  var rows=DATA.companySlots.filter(function(a){return String(a['매칭ID'])===String(matchId);});
  var out=rows.map(function(r){
    var date=normDate(r['날짜']);
    var time=normalizeTimeValue(r['시간'])||formatTimeValue(r['시간']);
    return { id:r['id']||'', date:date, time:time, label:dispDate(date)+' '+time, name:r['입력자명']||'' };
  }).filter(function(s){return s.date&&s.time;});
  // 중복 제거 후 날짜·시간 정렬
  var seen={}, uniq=[];
  out.forEach(function(s){var k=s.date+' '+s.time;if(!seen[k]){seen[k]=true;uniq.push(s);}});
  return uniq.sort(function(a,b){return a.date.localeCompare(b.date)||a.time.localeCompare(b.time);});
}

// 전문가가 선택한 단일 후보시간 — [전문가선택시간] 시트 기반 (최신 1건)
function getExpertSelectedSlot(matchId){
  var rows=DATA.expertSlots.filter(function(a){return String(a['매칭ID'])===String(matchId);});
  if(!rows.length) return null;
  var r=rows[rows.length-1];
  var date=normDate(r['선택날짜']);
  var time=normalizeTimeValue(r['선택시간'])||formatTimeValue(r['선택시간']);
  if(!date||!time) return null;
  return { date:date, time:time, label:dispDate(date)+' '+time, name:r['전문가명']||'' };
}

function getUrlParams(){
  var p={};
  window.location.search.replace(/[?&]+([^=&]+)=([^&]*)/gi,function(_,k,v){p[k]=decodeURIComponent(v);});
  return p;
}
