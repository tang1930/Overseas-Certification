<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>멘토링 상담예약 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ── CSS 변수 ── */
:root {
  --primary:       #1a8c5a;
  --primary-dark:  #155a38;
  --primary-light: #e8f5ef;
  --mint-bg:       #f0faf5;
  --card-bg:       #ffffff;
  --border:        #e2e8f0;
  --border-light:  #f1f5f9;
  --text-main:     #1a2e22;
  --text-sub:      #374151;
  --text-muted:    #64748b;
  --danger:        #dc2626;
  --warning:       #d97706;
  --success:       #16a34a;
  --info:          #2563eb;
  --sidebar-w:     240px;
  --radius:        14px;
  --radius-sm:     8px;
  --shadow:        0 1px 4px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
  --shadow-md:     0 4px 20px rgba(0,0,0,.08);
  --transition:    .15s ease;
}

/* ── 리셋 & 기본 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: linear-gradient(135deg, #edfbf3 0%, #e8f5ef 40%, #f0f9ff 100%);
  color: var(--text-main);
  min-height: 100vh;
}

/* ── 앱 레이아웃 ── */
.app-layout { display: flex; min-height: 100vh; }

/* ── 왼쪽 고정 사이드바 ── */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 100;
  box-shadow: 2px 0 12px rgba(0,0,0,.04);
}
.sidebar-brand {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 12px;
}
.sidebar-brand-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #1a8c5a, #0d6e47);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(26,140,90,.3);
}
.sidebar-brand-text { line-height: 1.3; }
.sidebar-brand-name { font-size: 13px; font-weight: 900; color: var(--primary-dark); letter-spacing: -.3px; }
.sidebar-brand-sub { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

.sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 13px;
  border-radius: var(--radius-sm);
  font-size: 13.5px; font-weight: 600;
  color: var(--text-muted);
  cursor: pointer; margin-bottom: 2px;
  transition: all var(--transition);
  user-select: none;
  text-decoration: none;
}
.nav-item:hover { background: var(--mint-bg); color: var(--primary); }
.nav-item.active {
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 800;
  box-shadow: inset 3px 0 0 var(--primary);
}
.nav-icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }

.sidebar-profile {
  padding: 14px 16px;
  border-top: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 11px;
}
.profile-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #34d399, #10b981);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 900; color: #fff;
  flex-shrink: 0;
}
.profile-info { flex: 1; min-width: 0; }
.profile-name { font-size: 13px; font-weight: 800; color: var(--text-main); }
.profile-email { font-size: 10px; color: var(--text-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profile-caret { font-size: 11px; color: var(--text-muted); }

/* ── 메인 콘텐츠 ── */
.main-content {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-width: 0;
  padding: 28px 32px 40px;
}

/* ── 상단 헤더 ── */
.page-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 24px; gap: 16px;
}
.page-title {
  font-size: 26px; font-weight: 900; color: var(--text-main);
  letter-spacing: -.6px; line-height: 1.2;
}
.page-desc { font-size: 13px; color: var(--text-muted); margin-top: 5px; }

.add-btn2 {
  padding: 11px 22px;
  background: var(--primary);
  color: #fff;
  border: none; border-radius: 999px;
  font-size: 13.5px; font-weight: 800;
  cursor: pointer; white-space: nowrap;
  font-family: inherit;
  box-shadow: 0 4px 14px rgba(26,140,90,.35);
  transition: all var(--transition);
  flex-shrink: 0;
}
.add-btn2:hover { background: var(--primary-dark); box-shadow: 0 6px 18px rgba(26,140,90,.45); transform: translateY(-1px); }

/* ── KPI 카드 ── */
.kpi-grid2 {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}
.kpi-card2 {
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow);
}
.kpi-card2:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.kpi-active { transform: translateY(-3px) !important; box-shadow: var(--shadow-md) !important; }
.kpi2-icon-wrap {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.kpi2-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
.kpi2-num { font-size: 26px; font-weight: 900; line-height: 1; letter-spacing: -1px; }

/* ── 검색/필터 바 ── */
.toolbar2 {
  display: flex; align-items: center; gap: 10px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}
.search-wrap2 { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; }
.search-icon2 { font-size: 14px; color: var(--text-muted); flex-shrink: 0; }
.search-input2 {
  flex: 1; border: none; outline: none;
  font-size: 13.5px; font-family: inherit; color: var(--text-main);
  background: transparent;
}
.search-input2::placeholder { color: var(--text-muted); }
.status-select2 {
  padding: 7px 12px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px; font-family: inherit;
  outline: none; cursor: pointer; background: #fff;
  color: var(--text-sub);
}
.cnt-badge2 {
  padding: 6px 13px;
  background: var(--border-light); border-radius: 999px;
  font-size: 12px; font-weight: 700; color: var(--text-muted);
  white-space: nowrap;
}
.view-tabs2 { display: flex; gap: 4px; }
.view-tab2 {
  padding: 7px 14px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12.5px; font-weight: 700; cursor: pointer;
  font-family: inherit; color: var(--text-muted);
  background: #fff; transition: all var(--transition);
}
.view-tab2:hover { border-color: var(--primary); color: var(--primary); }
.vt-active { background: var(--primary) !important; color: #fff !important; border-color: var(--primary) !important; }

/* ── 본문 2단 그리드 ── */
.main-body-grid {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 16px;
  align-items: start;
}

/* ── 왼쪽 패널 ── */
.main-left-panel { display: flex; flex-direction: column; gap: 14px; }
.lp-section {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
}
.lp-sec-title {
  font-size: 13px; font-weight: 800; color: var(--text-main);
  margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.lp-chevron { font-size: 11px; color: var(--text-muted); }
.lp-status-row {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition);
  margin-bottom: 2px;
}
.lp-status-row:hover { background: var(--mint-bg); }
.lp-status-active { font-weight: 700; }
.lp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.lp-status-name { font-size: 13px; color: var(--text-sub); flex: 1; }
.lp-cnt {
  font-size: 11px; font-weight: 800;
  padding: 2px 8px; border-radius: 999px;
  min-width: 24px; text-align: center;
}
.lp-req-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 8px; border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition);
  margin-bottom: 2px;
}
.lp-req-row:hover { background: var(--mint-bg); }
.lp-req-icon { font-size: 18px; flex-shrink: 0; }
.lp-req-info { flex: 1; min-width: 0; }
.lp-req-co { font-size: 13px; font-weight: 700; color: var(--text-main); }
.lp-req-ex { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.lp-more-btn {
  text-align: center; padding: 8px;
  font-size: 12px; font-weight: 700; color: var(--primary);
  cursor: pointer; border-top: 1px solid var(--border-light);
  margin-top: 6px; transition: color var(--transition);
}
.lp-more-btn:hover { color: var(--primary-dark); }
.lp-empty { text-align: center; padding: 14px; font-size: 12px; color: var(--text-muted); }

/* ── Agenda 패널 ── */
.main-right-panel {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  width: 100%;
  min-width: 0;
}
.agenda-panel-hdr {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border-light);
}
.agenda-cal-icon { font-size: 22px; }
.agenda-panel-title { font-size: 16px; font-weight: 900; color: var(--text-main); letter-spacing: -.3px; }
.agenda-panel-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.agenda-list { width: 100%; padding: 0; }
.agenda-empty { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; }

.ag-row {
  width: 100%;
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr) 180px;
  align-items: center;
  gap: 0;
  padding: 16px 24px;
  cursor: pointer;
  transition: background var(--transition);
  border-bottom: 1px solid var(--border-light);
  box-sizing: border-box;
}
.ag-row:last-child { border-bottom: none; }
.ag-row:hover { background: var(--mint-bg); }
.ag-row-highlight { background: #eff6ff; }
.ag-row-highlight:hover { background: #dbeafe; }

.ag-date-box {
  width: 58px; height: 58px; border-radius: 10px;
  border: 1.5px solid var(--border);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  line-height: 1.15;
}
.ag-dow { font-size: 11px; font-weight: 700; }
.ag-day { font-size: 18px; font-weight: 900; letter-spacing: -.5px; }

.ag-content {
  min-width: 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ag-title-row { display: flex; align-items: center; gap: 7px; }
.ag-dot { font-size: 10px; flex-shrink: 0; }
.ag-title { font-size: 14px; font-weight: 800; color: var(--text-main); letter-spacing: -.2px; }
.ag-title-x { color: var(--text-muted); font-weight: 400; margin: 0 2px; }
.ag-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
.ag-chip {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700;
  border: 1px solid transparent;
  white-space: nowrap;
}
.ag-chip-status { }
.ag-chip-field { background: #f1f5f9; color: var(--text-sub); border-color: #e2e8f0; }
.ag-chip-cert { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
.ag-chip-slot { background: #faf5ff; color: #6d28d9; border-color: #ddd6fe; }
.ag-chip-none { background: #f8fafc; color: var(--text-muted); border-color: #e2e8f0; font-style: italic; }

.ag-meta {
  justify-self: end;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  padding-left: 12px;
}
.ag-updated { font-size: 11px; color: var(--text-muted); white-space: nowrap; text-align: right; }
.ag-more-btn {
  background: none; border: none; cursor: pointer;
  font-size: 18px; color: var(--text-muted);
  padding: 3px 7px; border-radius: 5px;
  transition: all var(--transition); line-height: 1;
}
.ag-more-btn:hover { background: var(--border-light); color: var(--text-main); }

/* ── 목록 모드 매칭 카드 (기존 유지) ── */
.match-list { display: flex; flex-direction: column; gap: 12px; }
.match-card {
  background: var(--card-bg); border-radius: var(--radius);
  border: 1.5px solid var(--border); padding: 18px 20px;
  cursor: pointer; transition: all var(--transition);
  box-shadow: var(--shadow);
}
.match-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.empty-state { text-align: center; padding: 60px; color: var(--text-muted); }

/* ── detail / add 페이지 관련 기존 스타일 ── */
.back-row { display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
.badge { padding:4px 12px; border-radius:999px; font-size:12px; font-weight:800; }
.form-wrap { background:var(--card-bg); border-radius:var(--radius); border:1px solid var(--border); padding:20px; box-shadow:var(--shadow); }
.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.detail-field { display:flex; flex-direction:column; gap:4px; }
.detail-key { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; }
.detail-val { font-size:14px; font-weight:600; color:var(--text-main); }
.avail-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; }
.avail-box { background:var(--card-bg); border-radius:var(--radius); border:1px solid var(--border); padding:14px; box-shadow:var(--shadow); }
.avail-box-hdr { font-size:13px; font-weight:800; margin-bottom:10px; }
.slot-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border-light); font-size:13px; }
.slot-row:last-child { border-bottom:none; }
.slot-date { font-weight:700; color:var(--text-main); }
.slot-times { display:flex; flex-wrap:wrap; gap:4px; }
.slot-time { background:var(--mint-bg); color:var(--primary-dark); padding:2px 8px; border-radius:999px; font-size:12px; font-weight:700; }
.add-form { display:flex; flex-direction:column; gap:14px; }
.add-form label { display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:700; color:var(--text-sub); }
.add-form input, .add-form select { padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:inherit; outline:none; transition:border-color var(--transition); }
.add-form input:focus, .add-form select:focus { border-color:var(--primary); }

/* ── buildAdd() form-field 스타일 ── */
.form-field { display:flex; flex-direction:column; gap:5px; }
.form-field label {
  font-size:11px; font-weight:800; color:var(--text-muted);
  letter-spacing:.4px; text-transform:uppercase;
}
.form-field input, .form-field textarea {
  padding:10px 14px;
  border:1.5px solid var(--border);
  border-radius:10px;
  font-size:13px; font-family:inherit;
  outline:none; color:var(--text-main);
  background:#fff;
  transition:border-color var(--transition), box-shadow var(--transition);
  width:100%;
}
.form-field input:focus, .form-field textarea:focus {
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(26,140,90,.1);
}
.form-field input[required] { border-left:3px solid var(--primary); }

.btn-submit {
  width:100%; padding:15px;
  background:linear-gradient(135deg, var(--primary), var(--primary-dark));
  color:#fff; border:none; border-radius:12px;
  font-size:14px; font-weight:800; font-family:inherit;
  cursor:pointer; letter-spacing:-.2px;
  box-shadow:0 4px 14px rgba(26,140,90,.35);
  transition:all var(--transition);
}
.btn-submit:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(26,140,90,.45); }
.btn-submit:disabled { opacity:.6; cursor:not-allowed; transform:none; }

.add-btn { background:var(--primary); color:#fff; border:none; border-radius:999px; padding:12px 28px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; transition:all var(--transition); }
.add-btn:hover { background:var(--primary-dark); }
.btn-cancel {
  width:100%; padding:12px;
  background:#f8fafc; color:var(--text-sub);
  border:1.5px solid var(--border);
  border-radius:12px;
  font-size:13px; font-weight:700; font-family:inherit;
  cursor:pointer; transition:all var(--transition);
}
.btn-cancel:hover { background:var(--border-light); border-color:#cbd5e1; }

/* ── 로딩 스피너 ── */
#loadingScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:16px; background:linear-gradient(135deg,#edfbf3,#e8f5ef); }
.spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── 일정 입력 화면 (availScreen) ── */
#availScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: #f0faf5;
  overflow-y: auto;
}

/* ── 기존 상세 내부 스타일 호환 ── */
.chip { display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; }
.matched-slot-card { background:var(--mint-bg); border:1.5px solid #a0d4b8; border-radius:var(--radius); padding:14px 18px; margin-bottom:10px; cursor:pointer; transition:all var(--transition); }
.matched-slot-card:hover { border-color:var(--primary); background:#d1fae5; }
.confirm-btn { background:var(--primary); color:#fff; border:none; border-radius:999px; padding:8px 20px; font-size:13px; font-weight:800; cursor:pointer; font-family:inherit; }
.avail-input-wrap { margin-top:16px; background:var(--card-bg); border-radius:var(--radius); border:1px solid var(--border); padding:18px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:10px; }
.cal-day-hdr { text-align:center; font-size:11px; font-weight:700; color:var(--text-muted); padding:4px 0; }
.cal-day-cell { text-align:center; padding:7px 4px; border-radius:6px; font-size:13px; cursor:pointer; border:1.5px solid transparent; transition:all var(--transition); }
.cal-day-cell:hover { background:var(--mint-bg); }
.cal-day-cell.selected { background:var(--primary); color:#fff; }
.cal-day-cell.has-slots { border-color:var(--primary); font-weight:700; }
.cal-day-cell.empty { visibility:hidden; }
.time-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.time-chip { padding:6px 14px; border-radius:999px; border:1.5px solid var(--border); font-size:13px; cursor:pointer; font-family:inherit; transition:all var(--transition); }
.time-chip.selected { background:var(--primary); color:#fff; border-color:var(--primary); }
.time-chip:hover { border-color:var(--primary); }

/* ══ 새 매칭 추가 페이지 ══ */

/* 브레드크럼 헤더 */
.add-page-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 0 18px; margin-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.add-breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.bc-icon { font-size: 14px; color: var(--text-muted); }
.bc-sep { color: var(--border); font-size: 14px; }
.bc-item { color: var(--text-muted); cursor: pointer; transition: color var(--transition); }
.bc-item:hover { color: var(--primary); }
.bc-current { color: var(--text-main); font-weight: 700; cursor: default; }
.add-header-right { display: flex; align-items: center; gap: 12px; }
.add-bell { font-size: 18px; cursor: pointer; color: var(--text-muted); }
.add-user-chip {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 14px; border: 1.5px solid var(--border);
  border-radius: 999px; font-size: 13px; font-weight: 700;
  color: var(--text-sub); cursor: pointer;
  transition: border-color var(--transition);
}
.add-user-chip:hover { border-color: var(--primary); }

/* 메인 카드 */
.add-card {
  display: grid;
  grid-template-columns: 320px 1fr;
  min-height: calc(100vh - 140px);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 28px rgba(0,0,0,.1);
  background: #fff;
}

/* 좌측 안내 패널 */
.add-panel-left {
  background: linear-gradient(160deg, #0f2d1c 0%, #1a5c38 45%, #2d7a55 80%, #3a9e6e 100%);
  position: relative; overflow: hidden;
}
.add-panel-left::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 80% 20%, rgba(255,255,255,.06) 0%, transparent 50%),
    radial-gradient(circle at 20% 80%, rgba(255,255,255,.04) 0%, transparent 40%);
}
.add-panel-left::after {
  content: '';
  position: absolute; right: -40px; top: -40px;
  width: 200px; height: 200px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.07);
  box-shadow: 0 0 0 40px rgba(255,255,255,.03), 0 0 0 80px rgba(255,255,255,.02);
}
.add-panel-inner {
  position: relative; z-index: 1;
  padding: 40px 32px; height: 100%;
  display: flex; flex-direction: column; justify-content: center;
}
.add-panel-eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 2px;
  color: rgba(255,255,255,.55); text-transform: uppercase;
  margin-bottom: 14px;
}
.add-panel-title {
  font-size: 30px; font-weight: 900; color: #fff;
  letter-spacing: -.7px; line-height: 1.2; margin-bottom: 16px;
}
.add-panel-desc {
  font-size: 13.5px; color: rgba(255,255,255,.72);
  line-height: 1.9; margin-bottom: 32px;
}
.add-panel-features { display: flex; flex-direction: column; gap: 18px; margin-bottom: 28px; }
.add-feat-item { display: flex; align-items: flex-start; gap: 13px; }
.add-feat-icon {
  width: 36px; height: 36px; flex-shrink: 0;
  background: rgba(255,255,255,.14); border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: rgba(255,255,255,.9);
  border: 1px solid rgba(255,255,255,.1);
}
.add-feat-title { font-size: 13px; font-weight: 800; color: rgba(255,255,255,.92); margin-bottom: 3px; }
.add-feat-desc { font-size: 11.5px; color: rgba(255,255,255,.6); line-height: 1.6; }
.add-panel-note {
  display: flex; align-items: flex-start; gap: 10px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
  border-radius: 10px; padding: 14px 16px;
  font-size: 12px; color: rgba(255,255,255,.8); line-height: 1.7;
}
.add-panel-note-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

/* 우측 폼 패널 */
.add-panel-right {
  display: flex; flex-direction: column;
  background: #fff; overflow-y: auto;
}
.add-form-wrap {
  flex: 1; padding: 36px 40px 24px;
  display: flex; flex-direction: column; gap: 28px;
}

/* 폼 헤더 */
.add-form-hdr { display: flex; align-items: center; gap: 14px; padding-bottom: 20px; border-bottom: 1px solid var(--border-light); }
.add-form-hdr-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--primary-light); display: flex;
  align-items: center; justify-content: center; font-size: 20px;
  flex-shrink: 0;
}
.add-form-title { font-size: 18px; font-weight: 900; color: var(--text-main); letter-spacing: -.3px; }
.add-form-sub { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

/* 섹션 */
.add-sec { display: flex; flex-direction: column; gap: 16px; }
.add-sec-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; font-weight: 800; color: var(--text-main);
  padding-bottom: 12px; border-bottom: 1.5px solid var(--border-light);
}
.add-sec-icon { font-size: 15px; }
.add-sec-note {
  font-size: 12px; color: var(--text-muted);
  padding: 8px 12px; background: var(--border-light);
  border-radius: 8px; line-height: 1.5;
}

/* 필드 그리드 */
.add-fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.add-field { display: flex; flex-direction: column; gap: 6px; }
.add-label {
  font-size: 12px; font-weight: 700; color: var(--text-sub);
  letter-spacing: .1px;
}
.add-input {
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 13.5px; font-family: inherit; color: var(--text-main);
  background: #fff; outline: none; width: 100%;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.add-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(26,140,90,.1);
}
.add-input[required]:not(:focus) { border-left: 3px solid var(--primary); }
.add-input::placeholder { color: #b0bccc; }

/* 메모 */
.add-memo-wrap { position: relative; }
.add-memo-ta {
  width: 100%; padding: 13px 16px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 13.5px; font-family: inherit; color: var(--text-main);
  resize: vertical; outline: none; min-height: 110px;
  transition: border-color var(--transition), box-shadow var(--transition);
  line-height: 1.6;
}
.add-memo-ta:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,140,90,.1); }
.add-memo-ta::placeholder { color: #b0bccc; }
.add-memo-cnt {
  text-align: right; font-size: 11.5px; color: var(--text-muted);
  margin-top: 5px; padding-right: 2px;
}

/* 액션 바 */
.add-action-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 40px;
  border-top: 1px solid var(--border-light);
  background: #fafbfc;
  gap: 16px; flex-wrap: wrap;
}
.add-action-note {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: var(--text-muted); line-height: 1.6;
}
.add-action-note span:first-child { font-size: 16px; flex-shrink: 0; }
.add-action-btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.add-btn-cancel {
  padding: 10px 20px; border: 1.5px solid var(--border);
  border-radius: 9px; background: #fff; color: var(--text-muted);
  font-size: 13px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all var(--transition);
}
.add-btn-cancel:hover { border-color: #94a3b8; color: var(--text-sub); }

.add-btn-draft {
  padding: 10px 20px; border: 1.5px solid var(--primary);
  border-radius: 9px; background: #fff; color: var(--primary);
  font-size: 13px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all var(--transition);
}
.add-btn-draft:hover { background: var(--primary-light); }

.add-btn-submit {
  padding: 11px 22px;
  background: linear-gradient(135deg, var(--primary), #0f6e42);
  border: none; border-radius: 9px; color: #fff;
  font-size: 13px; font-weight: 800; font-family: inherit;
  cursor: pointer; letter-spacing: -.1px;
  box-shadow: 0 3px 12px rgba(26,140,90,.35);
  transition: all var(--transition);
  white-space: nowrap;
}
.add-btn-submit:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(26,140,90,.45); }
.add-btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }

/* ── 반응형 ── */
@media (max-width: 1100px) {
  .kpi-grid2 { grid-template-columns: repeat(3,1fr); }
  .main-body-grid { grid-template-columns: 220px 1fr; }
}
@media (max-width: 860px) {
  :root { --sidebar-w: 64px; }
  .sidebar-brand-text, .nav-item span:not(.nav-icon), .profile-info, .profile-caret { display:none; }
  .sidebar-brand { justify-content:center; padding:16px 10px; }
  .nav-item { justify-content:center; padding:12px; }
  .sidebar-profile { justify-content:center; }
  .main-body-grid { grid-template-columns: 1fr; }
  .kpi-grid2 { grid-template-columns: repeat(2,1fr); }
  .main-content { padding: 16px; }
  .add-card { grid-template-columns: 1fr; }
  .add-panel-left { min-height: 220px; }
  .add-panel-inner { padding: 28px 24px; justify-content: flex-start; }
  .add-panel-title { font-size: 22px; }
  .add-panel-features { display: none; }
}
@media (max-width: 600px) {
  .kpi-grid2 { grid-template-columns: 1fr 1fr; }
  .detail-grid, .avail-grid { grid-template-columns: 1fr; }
  .toolbar2 { flex-direction:column; align-items:stretch; }
  .search-wrap2 { min-width: unset; }
  .add-fields-grid { grid-template-columns: 1fr; }
  .add-action-bar { flex-direction: column; align-items: stretch; }
  .add-action-btns { justify-content: flex-end; }
  .add-form-wrap { padding: 20px 18px 16px; }
  .add-action-bar { padding: 14px 18px; }
}

/* ══ AVAIL SCREEN CSS ══ */
.avail-page-wrap {
  min-height: 100vh;
  margin-left: 0 !important;
  background:
    radial-gradient(circle at 8% 12%, rgba(182,236,205,.55), transparent 28%),
    radial-gradient(circle at 92% 8%, rgba(189,226,238,.62), transparent 32%),
    linear-gradient(135deg, #edf8f3 0%, #e8f1f8 100%);
}
/* ── 가용시간 입력 페이지 래퍼 ── */
.avail-page-inner {
  max-width: 1160px;
  width: 100%;
  margin: 0 auto;
  padding: 22px 24px 90px;
}

/* 안내 카드 */
.avail-info-card {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.82);
  border-radius: 20px;
  padding: 20px 26px;
  margin-bottom: 20px;
  box-shadow: 0 6px 24px rgba(59,117,94,.1);
}
.avail-info-card-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; flex-shrink: 0;
}
.avail-info-card-name { font-size: 17px; font-weight: 900; color: #1a3d2b; letter-spacing: -.3px; }
.avail-info-card-sub  { font-size: 13px; color: #64748b; margin-top: 2px; }
.avail-warn-badge {
  background: #fffbeb; border: 1.5px solid #fde68a;
  border-radius: 10px; padding: 10px 16px;
  font-size: 12px; color: #92400e; font-weight: 700; flex-shrink: 0;
}

/* ── 3단 Schedule 레이아웃: 날짜 → 시간 → 결과 ── */
.schedule-template-layout {
  display: grid;
  grid-template-columns: minmax(440px, 580px) 185px 340px;
  grid-template-areas: "cal time agenda";
  gap: 16px;
  align-items: start;
  justify-content: center;
  margin-bottom: 20px;
}

/* 공통 패널 베이스 */
.sch-panel {
  background: rgba(255,255,255,.9);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.85);
  border-radius: 20px;
  box-shadow: 0 6px 24px rgba(59,117,94,.1);
}
.sch-panel-title {
  font-size: 12px; font-weight: 900; color: #1a3d2b;
  padding-bottom: 10px; margin-bottom: 14px;
  border-bottom: 1px solid #e4f0e9;
  display: flex; align-items: center; gap: 6px;
}

/* 왼쪽: 월별 캘린더 */
.month-calendar-panel {
  grid-area: cal;
  padding: 22px 24px;
  max-height: calc(100vh - 240px);
  overflow-y: auto;
}
.month-calendar-panel::-webkit-scrollbar { width: 4px; }
.month-calendar-panel::-webkit-scrollbar-thumb { background: #c8e6d4; border-radius: 4px; }
.month-calendar-panel .cal-grid {
  grid-template-columns: repeat(7, minmax(44px, 62px));
  justify-content: center;
  gap: 6px;
}
.month-calendar-panel .cal-cell {
  border-radius: 12px;
  aspect-ratio: auto;
  height: 54px;
  min-height: 54px;
}
.cal-legend {
  display: flex; gap: 14px; font-size: 11px; color: #6a8d81;
  margin-top: 10px; flex-wrap: wrap;
  padding-top: 10px; border-top: 1px solid #e4f0e9;
}
.cal-legend-dot {
  width: 8px; height: 8px; border-radius: 50%; display: inline-block;
}

/* 가운데: 시간 선택 */
.time-ruler-panel {
  grid-area: time;
  padding: 18px 16px;
  position: sticky;
  top: 80px;
}
.time-ruler-date-lbl {
  font-size: 12px; color: #3a9e6e; font-weight: 700;
  margin-bottom: 14px; padding: 7px 12px;
  background: #e8f5ef; border-radius: 9px;
  border: 1px solid #a0d4b8; text-align: center; display: block;
}
.time-ruler-list { display: flex; flex-direction: column; gap: 6px; }
.time-btn {
  width: 100%; padding: 11px; border-radius: 10px;
  cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 800;
  transition: all .15s; text-align: center;
  border: 1.5px solid #daeee3; background: #fff; color: #374151;
}
.time-btn:hover { transform: translateY(-1px); border-color: #3a9e6e; box-shadow: 0 3px 10px rgba(58,158,110,.15); }
.time-btn.on {
  background: linear-gradient(135deg, #3a9e6e, #2d7a55);
  border-color: transparent; color: #fff;
  box-shadow: 0 5px 14px rgba(58,158,110,.28);
}

/* 오른쪽: Agenda 일정 리스트 */
.agenda-panel {
  grid-area: agenda;
  padding: 0;
  position: sticky;
  top: 80px;
  max-height: calc(100vh - 240px);
  overflow-y: auto;
  overflow-x: hidden;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
}
.agenda-panel::-webkit-scrollbar { width: 4px; }
.agenda-panel::-webkit-scrollbar-thumb { background: rgba(58,158,110,.25); border-radius: 4px; }

/* Agenda 패널 헤더 */
.agenda-panel .sch-panel-title {
  padding: 14px 18px 10px;
  margin-bottom: 0;
  background: rgba(255,255,255,.9);
  border-radius: 18px 18px 0 0;
  border-bottom: 1px solid rgba(58,158,110,.1);
  position: sticky;
  top: 0;
  z-index: 2;
  backdrop-filter: blur(10px);
}

/* 일정 리스트 래퍼 */
.agenda-list {
  display: flex;
  flex-direction: column;
}

/* 각 날짜 행 */
.agenda-row {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid rgba(255,255,255,.6);
  transition: background .15s;
  min-height: 64px;
}
.agenda-row:last-child { border-bottom: none; border-radius: 0 0 18px 18px; }
.agenda-row:first-child { border-radius: 0; }
.agenda-row:only-child { border-radius: 0 0 18px 18px; }

/* 날짜 셀 (왼쪽 민트 컬럼) */
.agenda-date-cell {
  flex-shrink: 0;
  width: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 6px;
  background: linear-gradient(180deg, #b2dfc8 0%, #9ed4c4 100%);
  color: #155a38;
  text-align: center;
}
.agenda-row:last-child .agenda-date-cell { border-radius: 0 0 0 18px; }

.agenda-dow {
  font-size: 10px;
  font-weight: 700;
  opacity: .75;
  letter-spacing: .5px;
  text-transform: uppercase;
  line-height: 1;
  margin-bottom: 2px;
}
.agenda-day {
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1px;
}

/* 일정 콘텐츠 (오른쪽 흰색/민트 영역) */
.agenda-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 12px 16px;
  background: linear-gradient(135deg, rgba(232,245,239,.85) 0%, rgba(232,242,247,.85) 100%);
  min-width: 0;
}

.agenda-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.agenda-bullet {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #3a9e6e;
  flex-shrink: 0;
}
.agenda-date-label {
  font-size: 12px;
  font-weight: 800;
  color: #1a3d2b;
  letter-spacing: -.2px;
}

.agenda-times {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-left: 13px;
}
.agenda-time-chip {
  background: rgba(255,255,255,.82);
  border: 1px solid rgba(58,158,110,.22);
  color: #1a6640;
  border-radius: 8px;
  padding: 3px 9px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -.2px;
  backdrop-filter: blur(4px);
}

/* 빈 상태 */
.agenda-empty-wrap {
  padding: 28px 18px;
  background: linear-gradient(135deg, rgba(232,245,239,.7), rgba(232,242,247,.7));
  border-radius: 0 0 18px 18px;
  text-align: center;
}
.agenda-empty-icon { font-size: 32px; margin-bottom: 10px; }
.agenda-empty-title { font-size: 13px; font-weight: 800; color: #1a3d2b; margin-bottom: 5px; }
.agenda-empty-desc  { font-size: 11px; color: #6b9e85; line-height: 1.7; }

/* 제출 버튼 fixed (PC) */
.avail-submit-fixed {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 14px 24px;
  background: rgba(237,248,243,.92);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(58,158,110,.15);
  z-index: 50;
}
.avail-submit-btn {
  display: block;
  max-width: 1160px;
  margin: 0 auto;
  width: 100%;
  padding: 15px;
  border: none; border-radius: 14px;
  background: linear-gradient(135deg, #3a9e6e, #1f6b48);
  color: #fff; font-size: 15px; font-weight: 900;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 6px 20px rgba(58,158,110,.32);
  letter-spacing: -.2px;
}

/* 관리자 직접 입력 3단: 달력 → 시간 → 요약 */
.admin-schedule-layout {
  display: grid;
  grid-template-columns: 1fr 148px 180px;
  grid-template-areas: "cal time summary";
  gap: 14px;
  align-items: start;
}
.admin-cal-panel     { grid-area: cal;     background: #f3faf6; border-radius: 16px; padding: 18px 20px; border: 1px solid #daeee3; }
.admin-time-panel    { grid-area: time;    background: #f3faf6; border-radius: 16px; padding: 16px 14px; border: 1px solid #daeee3; position: sticky; top: 80px; }
.admin-summary-panel { grid-area: summary; background: #f3faf6; border-radius: 16px; padding: 16px 14px; border: 1px solid #daeee3; position: sticky; top: 80px; }
.admin-panel-title { font-size: 12px; font-weight: 900; color: #1a3d2b; margin-bottom: 10px; }
.admin-time-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.admin-time-btn {
  padding: 10px 4px; border-radius: 9px; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 800;
  transition: all .15s; text-align: center;
  border: 1.5px solid #c8e6d4; background: #fff; color: #374151;
}
.admin-time-btn.on {
  background: linear-gradient(135deg, #3a9e6e, #2d7a55);
  border-color: transparent; color: #fff;
}

/* ── 반응형 ── */
@media (max-width: 960px) {
  .schedule-template-layout {
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "cal cal" "time agenda";
    justify-content: stretch;
  }
  .month-calendar-panel { max-height: none; overflow-y: visible; }
  .agenda-panel, .time-ruler-panel { position: static; max-height: none; overflow: visible; }
  .avail-submit-fixed { position: static; background: transparent; border-top: none; padding: 0; backdrop-filter: none; }
  .avail-submit-btn { border-radius: 16px; }
  .admin-schedule-layout {
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "cal cal" "time summary";
  }
}
@media (max-width: 600px) {
  .schedule-template-layout {
    grid-template-columns: 1fr;
    grid-template-areas: "cal" "time" "agenda";
  }
  .time-ruler-list { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .admin-schedule-layout {
    grid-template-columns: 1fr;
    grid-template-areas: "cal" "time" "summary";
  }
}
/* =========================================================
   Board Layout Fix
   관리자 보드 우측 잘림 방지
========================================================= */

/* 관리자 메인 화면은 더 넓게 사용 */
.content {
  max-width: min(1500px, calc(100vw - 80px));
  width: 100%;
  margin: 0 auto;
}

/* 보드 래퍼 */
.board-wrap {
  width: 100%;
  overflow-x: visible;
}

/* 기존 flex 고정폭 대신 5등분 grid */
.board {
  display: grid;
  grid-template-columns: repeat(5, minmax(180px, 1fr));

// ══ 날짜 유틸 ══
function toDateStr(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function normDate(raw) {
  if (!raw) return '';
  var s = String(raw).trim();
  // 이미 yyyy-MM-dd 형식
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // yyyy-MM-dd HH:mm:ss 형식 → 앞 10자리만
  if (/^\d{4}-\d{2}-\d{2} /.test(s)) return s.slice(0, 10);
  // Date 파싱 시도
  var d = new Date(s);
  return isNaN(d.getTime()) ? s.slice(0, 10) : toDateStr(d);
}
function dispDate(raw) {
  var n = normDate(raw); if (!n) return String(raw||'');
  var d = new Date(n+'T00:00:00'); if (isNaN(d.getTime())) return n;
  return n.replace(/-/g,'.')+' ('+KO_DAYS[d.getDay()]+')';
}
function dispDateShort(raw) {
  var n = normDate(raw); if (!n) return String(raw||'');
  var d = new Date(n+'T00:00:00'); if (isNaN(d.getTime())) return n;
  return n.slice(5).replace('-','.')+' ('+KO_DAYS[d.getDay()]+')';
}

// ── normalizeTimeValue ──
// 시간목록 split 직후 각 항목을 정제 → "11:00" 형태만 남기고 raw Date 문자열 제거
function normalizeTimeValue(raw) {
  if (!raw) return '';
  var s = String(raw).trim();
  // 이미 HH:MM 형태면 그대로 반환
  if (/^\d{1,2}:\d{2}$/.test(s)) return s;
  // raw Date 블록 제거 ("Sat Dec 30 1899 11:00:00 GMT+0827 (한국 표준시)")
  s = s.replace(/(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\s+\S+\s+\d{1,2}\s+\d{4}\s+[\d:]+\s+GMT[^\s]*(\s+\([^)]*\))?/gi, ' ');
  // 1899·1900 연도 잔재 제거
  s = s.replace(/\b(1899|1900)\b[^\r\n]*/g, '');
  s = s.trim();
  // HH:MM 추출
  var m = s.match(/\b(\d{1,2}):(\d{2})\b/);
  if (m) return String(parseInt(m[1])).padStart(2, '0') + ':' + m[2];
  return '';
}
// ── formatTimeValue: Date 객체/1899 raw string → HH:mm ──
function formatTimeValue(value) {
  if (!value) return '';
  if (value instanceof Date) {
    return String(value.getHours()).padStart(2,'0') + ':' + String(value.getMinutes()).padStart(2,'0');
  }
  var s = String(value);
  if (/1899|1900/.test(s) || /^(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\s/i.test(s)) {
    var m = s.match(/(\d{1,2}):(\d{2})(?::\d{2})?/);
    return m ? String(parseInt(m[1])).padStart(2,'0') + ':' + m[2] : '';
  }
  var m2 = s.match(/(\d{1,2}):(\d{2})/);
  return m2 ? String(parseInt(m2[1])).padStart(2,'0') + ':' + m2[2] : s;
}
// ── 전역 cleanScheduleText ──
// raw Date 문자열("Sat Dec 30 1899 11:00:00 GMT+0827...") 이 혼합된 확정슬롯 값을
// "2026.06.08 (월) 11:00" 형태로 정제해 반환. 어디서든 호출 가능.
function cleanScheduleText(raw) {
  if (!raw) return '';
  var s = String(raw);
  // 영문 요일로 시작하는 raw Date 블록 제거 ("Sat Dec 30 1899 11:00:00 GMT+0827 (한국 표준시)")
  s = s.replace(/(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\s+\S+\s+\d{1,2}\s+\d{4}\s+[\d:]+\s+GMT[^\s]*(\s+\([^)]*\))?/gi, ' ');
  // 1899·1900 연도 잔재 제거
  s = s.replace(/\b(1899|1900)\b[^\n]*/g, '');
  s = s.trim();
  // yyyy.MM.dd 또는 yyyy-MM-dd 날짜 추출
  var dm = s.match(/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
  // HH:MM 시간 추출
  var tm = s.match(/(?<![\d.])(\d{1,2}):(\d{2})(?!\d)/);
  if (dm) {
    var yyyy = dm[1];
    var mm   = String(parseInt(dm[2])).padStart(2, '0');
    var dd   = String(parseInt(dm[3])).padStart(2, '0');
    var d    = new Date(yyyy + '-' + mm + '-' + dd + 'T00:00:00');
    var base = yyyy + '.' + mm + '.' + dd + ' (' + KO_DAYS[d.getDay()] + ')';
    if (tm) base += ' ' + String(parseInt(tm[1])).padStart(2,'0') + ':' + tm[2];
    return base;
  }
  if (tm) return String(parseInt(tm[1])).padStart(2,'0') + ':' + tm[2];
  return '';
}

// ══ 초기화 ══
window.onload = function() {
  var p = getUrlParams();
  if (p.id && p.role) {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('availScreen').style.display = 'block';
    loadAvailPage(p.id, p.role);
  } else {
    loadDashboard();
  }
};

function loadDashboard() {
  fetch(SCRIPT_URL)
    .then(function(r){return r.json();})
    .then(function(data){
      DATA.matches = data['멘토링_매칭']||[];
      DATA.avail   = data['가용시간']||[];
      document.getElementById('loadingScreen').style.display='none';
      document.getElementById('mainScreen').style.display='block';

      render();
    })
    .catch(function(err){
      document.getElementById('loadingScreen').innerHTML =
        '<div style="text-align:center;color:#dc2626;font-size:14px;">❌ 데이터 불러오기 실패<br><small style="color:#94a3b8;">'+err.message+'</small><br><br>'
        +'<button onclick="loadDashboard()" style="padding:10px 20px;background:#2d7a55;color:#fff;border:none;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;">다시 시도</button></div>';
    });
}

function render() {
  var root = document.getElementById('appRoot');
  var hb = document.getElementById('hdrBackBtn');
  if (VIEW.page==='list') {
    root.innerHTML = buildList();
    if(hb) hb.style.display='none';
  }
  if (VIEW.page==='add')    root.innerHTML = buildAdd();
  if (VIEW.page==='detail') root.innerHTML = buildDetail(VIEW.selectedId);
}

      if (!raw) return null;
      var s = cleanScheduleText(raw);

      if (m1) return { year: parseInt(m1[1]), month: parseInt(m1[2]), day: parseInt(m1[3]) };
      return null;
    }
    function formatScheduleText(df, time) {
      if (!df) return '';
      var d = new Date(df.year, df.month - 1, df.day);

      var dd = String(df.day).padStart(2, '0');

function buildDetail(matchId) {
  var m=DATA.matches.find(function(x){return x['매칭ID']===matchId;});
  if(!m) return '<div style="padding:20px;color:#94a3b8;">매칭 정보를 찾을 수 없습니다.</div>';
  var stat=m['상태']||'대기중';
  var c=STATUS_CFG[stat]||{bg:'#f1f5f9',color:'#374151'};
  var compRows=DATA.avail.filter(function(a){return a['매칭ID']===matchId&&a['역할']==='기업';});
  var expRows =DATA.avail.filter(function(a){return a['매칭ID']===matchId&&a['역할']==='전문가';});
  var matched =calcMatchedSlots(matchId);
  var role    =AVAIL_INPUT.role;

  return '<div>'
    +'<div class="back-row">'
    +'<div style="font-size:16px;font-weight:900;color:#1a3d2b;">'+m['기업명']+' ↔ '+m['전문가명']+'</div>'
    +'<span class="badge" style="background:'+c.bg+';color:'+c.color+';">'+stat+'</span>'
    +(stat!=='취소'&&stat!=='확정완료'
      ?'<button onclick="cancelMatch(&quot;'+matchId+'&quot;)" style="margin-left:auto;padding:6px 13px;background:#fee2e2;color:#991b1b;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">취소</button>'
      :(stat==='취소'
        ?'<button onclick="deleteMatch(&quot;'+matchId+'&quot;)" style="margin-left:auto;padding:6px 13px;background:#dc2626;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">🗑 영구 삭제</button>'
        :''))
    +'</div>'

    +'<div class="form-wrap" style="margin-bottom:16px;">'
    +'<div class="detail-grid">'
    +[['기업명',m['기업명']],['전문가명',m['전문가명']],['기업담당자',m['기업담당자']],['전문분야',m['전문분야']],
      ['기업이메일',m['기업이메일']],['전문가이메일',m['전문가이메일']],['희망인증',m['희망인증']],['확정슬롯',m['확정슬롯']||'-']]
      .map(function(kv){return '<div class="detail-field"><div class="detail-key">'+kv[0]+'</div><div class="detail-val">'+(kv[1]||'-')+'</div></div>';}).join('')
    +'</div></div>'

    +'<div class="avail-grid">'
    +buildAvailBox('기업',compRows,m['기업담당자'])
    +buildAvailBox('전문가',expRows,m['전문가명'])
    +'</div>'

    +(matched.length>0?buildMatchedUI(matched,matchId,m['확정슬롯'],stat):'')
    +(stat!=='확정완료'&&stat!=='취소'?buildAvailInputUI(matchId,role,m):'')
    +'</div>';
}

function buildAvailBox(role,rows,name) {
  var color =role==='기업'?'#2d7a55':'#1a6640';
  var bg    =role==='기업'?'#e8f5ef':'#f0faf5';
  var border=role==='기업'?'#a0d4b8':'#8dcaab';
  var has   =rows.length>0;
  var body  =has
    ?rows.map(function(r){
        var times=(r['시간목록']||'').split(',').filter(Boolean);
        return '<div class="avail-row">'
          +'<span class="avail-date-lbl" style="color:'+color+';">'+dispDate(r['날짜'])+'</span>'
          +'<div class="avail-times">'+times.map(function(t){return '<span class="time-chip">'+t+'</span>';}).join('')+'</div>'
          +'</div>';
      }).join('')
    :'<div style="font-size:13px;color:#94a3b8;padding:8px 0;">아직 입력되지 않았습니다.</div>';

  return '<div class="avail-box" style="background:'+bg+';border-color:'+border+';">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">'
    +'<div style="font-size:14px;font-weight:800;color:'+color+';">'+(role==='기업'?'🏢':'👨‍💼')+' '+(name||role)+' 가용시간</div>'
    +'<span style="font-size:12px;padding:4px 11px;border-radius:20px;font-weight:700;background:'+(has?'#c8e6d4':'#fee2e2')+';color:'+(has?'#155a38':'#991b1b')+';">'+(has?'✓ 입력완료':'미입력')+'</span>'
    +'</div>'+body+'</div>';
}

function buildMatchedUI(slots,matchId,confirmedSlot,stat) {
  var html='<div class="matched-box">'
    +'<div style="font-size:14px;font-weight:900;color:#5b21b6;margin-bottom:14px;">✨ 겹치는 가용 슬롯 — '+slots.length+'개</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px;">';
  slots.forEach(function(s){
    var isConf=confirmedSlot===s.label;
    html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:13px 16px;'
      +'background:'+(isConf?'#e8f5ef':'#fff')+';border-radius:11px;border:1.5px solid '+(isConf?'#3a9e6e':'#daeee3')+';gap:10px;">'
      +'<div style="display:flex;align-items:center;gap:10px;">'
      +'<span style="font-size:15px;font-weight:900;color:#1a3d2b;">'+s.label+'</span>'
      +(isConf?'<span style="font-size:11px;color:#5b21b6;font-weight:800;background:#ede9fe;padding:2px 9px;border-radius:6px;">✓ 확정됨</span>':'')
      +'</div>';
    if(stat!=='확정완료'&&stat!=='취소'){
      html+='<div style="display:flex;gap:7px;">'
        +MEET_TYPES.map(function(mt){
          return '<button class="slot-confirm-btn" onclick="confirmSlot(\''+matchId+'\',\''+s.label+'\',\''+mt+'\')">'
            +(mt==='화상미팅'?'🎥':mt==='전화상담'?'📞':'🏢')+' '+mt+'</button>';
        }).join('')+'</div>';
    }
    html+='</div>';
  });
  return html+'</div></div>';
}

function buildAvailInputUI(matchId,role,m) {
  var dateOptions=[];
  var today=new Date();
  for(var i=1;i<=60;i++){
    var d=new Date(today); d.setDate(today.getDate()+i);
    if(d.getDay()===0||d.getDay()===6) continue;
    dateOptions.push(toDateStr(d));
  }
  var slots=AVAIL_INPUT.slots;
  var selDate=_selDate||dateOptions[0]||'';
  if(!_selDate) _selDate=selDate;

  // 역할 선택 버튼
  var roleHtml=['기업','전문가'].map(function(r){
    var nm=r==='기업'?m['기업담당자']:m['전문가명'];
    var isActive=role===r;
    return '<button onclick="AVAIL_INPUT.role=\''+r+'\';AVAIL_INPUT.name=\''+nm+'\';render();"'
      +' style="flex:1;padding:10px;border-radius:10px;cursor:pointer;font-family:inherit;'
      +'border:1.5px solid '+(isActive?'#2d7a55':'#c8e6d4')+';'
      +'background:'+(isActive?'#e8f5ef':'#fff')+';'
      +'font-size:13px;font-weight:'+(isActive?'900':'600')+';'
      +'color:'+(isActive?'#2d7a55':'#6b9e85')+';transition:all .15s;">'
      +(r==='기업'?'🏢':'👨\u200d💼')+' '+nm+' ('+r+')</button>';
  }).join('');

  // 요약 HTML
  var summaryHtml=(function(){
    var entries=Object.entries(slots).filter(function(e){return e[1].length>0;});
    if(!entries.length) return '<div style="font-size:11px;color:#94a3b8;padding:10px;background:#fff;border-radius:8px;text-align:center;border:1px dashed #c8e6d4;">선택된 가용시간이 없습니다</div>';
    var h='<div style="font-size:11px;font-weight:900;color:#155a38;margin-bottom:8px;">✅ 선택된 가용시간</div>';
    entries.forEach(function(e){
      h+='<div style="margin-bottom:7px;padding:8px 10px;background:linear-gradient(135deg,#f3faf6,#eef8fb);border-radius:9px;border:1px solid rgba(58,158,110,.12);">'
        +'<div style="font-size:10px;font-weight:800;color:#1a6640;margin-bottom:4px;">'+dispDate(e[0])+'</div>'

    +'<div style="display:flex;gap:10px;margin-bottom:14px;">'+roleHtml+'</div>'
    +bodyHtml
    +'</div>';

function buildAdminCalendar(dateOptions,slots,selDate) {
  var availSet={};
  dateOptions.forEach(function(d){availSet[d]=true;});
  var months={};
  dateOptions.forEach(function(d){var ym=d.slice(0,7);if(!months[ym])months[ym]=[];months[ym].push(d);});
  var html='';
  Object.keys(months).sort().forEach(function(ym){
    var year=parseInt(ym.slice(0,4)),month=parseInt(ym.slice(5,7));
    var firstDay=new Date(year,month-1,1).getDay();
    var lastDate=new Date(year,month,0).getDate();
    html+='<div class="cal-month-title">'+year+'년 '+month+'월</div>';
    html+='<div class="cal-grid">';
    KO_DAYS.forEach(function(d,i){html+='<div class="cal-day-hdr'+(i===0?' sun':i===6?' sat':'')+'" >'+d+'</div>';});
    for(var e=0;e<firstDay;e++) html+='<div></div>';
    for(var day=1;day<=lastDate;day++){
      var dd=ym+'-'+String(day).padStart(2,'0');
      var dow=new Date(dd+'T00:00:00').getDay();
      var isAvail=!!availSet[dd];
      var isSel=dd===selDate;
      var hasSlots=slots[dd]&&slots[dd].length>0;
      var dowCls=dow===0?' sun-col':dow===6?' sat-col':'';
      if(isAvail){
        var cls='cal-cell avail'+dowCls+(isSel?' selected':hasSlots?' has-slots':'');
        html+='<div id="admcal-'+dd+'" class="'+cls+'" onclick="selectDate(\x27'+dd+'\x27)"><span>'+day+'</span>'+(hasSlots&&!isSel?'<span class="cal-dot"></span>':'')+(isSel?'<span class="cal-dot"></span>':'')+'</div>';
      } else {
        html+='<div class="cal-cell disabled'+dowCls+'">'+day+'</div>';
      }
    }
    html+='</div><div style="margin-bottom:14px;"></div>';
  });
  return html;
}

function toggleTime(date,time){

// ══ API ══
function submitAdd(){
  var keys=['기업명','기업담당자','기업이메일','기업연락처','전문가명','전문가이메일','전문분야','희망인증','메모'];
  var data={};
  keys.forEach(function(k){var el=document.getElementById('fi-'+k);data[k]=el?el.value.trim():'';});
  var req=['기업명','기업담당자','기업이메일','전문가명','전문가이메일'];
  for(var i=0;i<req.length;i++){if(!data[req[i]]){alert(req[i]+' 은(는) 필수 입력입니다.');return;}}
  var btn=document.getElementById('submitAddBtn');
  if(btn){btn.textContent='전송 중...';btn.disabled=true;}
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'addMatch',data:data})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.ok){data['매칭ID']=res.matchId;data['상태']='대기중';data['생성일시']=new Date().toLocaleString('ko-KR');DATA.matches.push(data);VIEW.page='list';render();alert('✅ 매칭이 추가되었습니다!\n기업 담당자와 전문가에게 이메일이 발송되었습니다.');}
      else{alert('❌ 오류: '+(res.error||'알 수 없는 오류'));if(btn){btn.textContent='매칭 추가 + 이메일 발송';btn.disabled=false;}}
    })
    .catch(function(err){alert('❌ 네트워크 오류: '+err.message);if(btn){btn.textContent='매칭 추가 + 이메일 발송';btn.disabled=false;}});
}

function submitAdminAvail(matchId){
  var input=AVAIL_INPUT;
  if(!input.role){alert('기업 또는 전문가를 선택해주세요.');return;}
  var entries=Object.entries(input.slots).filter(function(e){return e[1].length>0;});
  if(!entries.length){alert('최소 1개 이상의 시간을 선택해주세요.');return;}
  var data={matchId:matchId,역할:input.role,이름:input.name,slots:entries.map(function(e){return{date:e[0],times:e[1]};})};
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'submitAvail',data:data})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.ok){entries.forEach(function(e){DATA.avail.push({매칭ID:matchId,역할:input.role,이름:input.name,날짜:e[0],시간목록:e[1].join(','),입력일시:new Date().toLocaleString('ko-KR')});});AVAIL_INPUT.slots={};render();alert('✅ '+input.role+' 가용시간이 저장되었습니다.');}
      else{alert('❌ 오류: '+(res.error||'알 수 없는 오류'));}
    })
    .catch(function(err){alert('❌ 네트워크 오류: '+err.message);});
}

function confirmSlot(matchId,slot,meetType){
  if(!confirm('['+slot+'] '+meetType+'으로 일정을 확정하시겠습니까?')) return;
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'confirmSlot',data:{matchId:matchId,슬롯:slot,상담방식:meetType}})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.ok){var m=DATA.matches.find(function(x){return x['매칭ID']===matchId;});if(m){m['상태']='확정완료';m['확정슬롯']=slot;m['상담방식']=meetType;}render();alert('✅ 일정이 확정되었습니다!\n기업 담당자와 전문가에게 확정 이메일이 발송되었습니다.');}
      else{alert('❌ 오류: '+(res.error||'알 수 없는 오류'));}
    })
    .catch(function(err){alert('❌ 네트워크 오류: '+err.message);});
}

function cancelMatch(matchId){
  if(!confirm('이 매칭을 취소하시겠습니까?')) return;
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'cancelMatch',matchId:matchId})})
    .then(function(r){return r.json();})
    .then(function(res){if(res.ok){var m=DATA.matches.find(function(x){return x['매칭ID']===matchId;});if(m)m['상태']='취소';VIEW.page='list';render();}})
    .catch(function(err){alert('❌ 네트워크 오류: '+err.message);});
}

function deleteMatch(matchId){
  if(!confirm('취소된 매칭을 완전히 삭제합니다.\n이 작업은 되돌릴 수 없습니다. 계속하시겠습니까?')) return;
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'deleteMatch',matchId:matchId})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.ok){
        DATA.matches=DATA.matches.filter(function(x){return x['매칭ID']!==matchId;});
        DATA.avail  =DATA.avail.filter(function(x){return x['매칭ID']!==matchId;});
        VIEW.page='list';
        render();
        alert('🗑 삭제 완료되었습니다.');
      } else {
        alert('❌ 삭제 실패: '+(res.message||'서버 오류'));
      }
    })
    .catch(function(err){alert('❌ 네트워크 오류: '+err.message);});
}

function renderAvailInput(match,role,existingAvail){
  var sc=document.getElementById('availScreen');
  var name=role==='기업'?match['기업담당자']:match['전문가명'];
  var matchId=match['매칭ID'];
  var myAvail=existingAvail.filter(function(a){return a['매칭ID']===matchId&&a['역할']===role;});
  var alreadySub=myAvail.length>0;

  var dateOptions=[];
  var today=new Date();
  for(var i=1;i<=60;i++){
    var d=new Date(today);d.setDate(today.getDate()+i);
    if(d.getDay()===0||d.getDay()===6) continue;
    dateOptions.push(toDateStr(d));
  }

  window._availSlots={};
  window._availMatchId=matchId;
  window._availRole=role;
  window._availName=name;
  window._lastMatch=match;
  window._lastRole=role;
  window._lastName=name;
  window._lastDateOpts=dateOptions;
  window._availMonthOffset=0;  // 2개월 표시 오프셋 초기화

  if(alreadySub){
    myAvail.forEach(function(a){
      var times=(a['시간목록']||'').split(',').filter(Boolean);
      if(times.length>0) window._availSlots[normDate(a['날짜'])]=times;
    });
  }
  window._availSelDate=dateOptions[0]||'';
  sc.innerHTML=buildAvailPageHTML(match,role,name,dateOptions,alreadySub);
}

function buildAvailSummaryHTML(){
  var entries=Object.entries(window._availSlots||{}).filter(function(e){return e[1].length>0;});
  if(!entries.length) return '<div style="font-size:12px;color:#94a3b8;padding:16px;background:rgba(255,255,255,.7);border-radius:14px;text-align:center;border:1px dashed #c8e6d4;">날짜를 클릭해서 가능한 시간을 선택하세요</div>';
  var html='<div style="background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border:1px solid rgba(58,158,110,.2);border-radius:18px;padding:18px 20px;box-shadow:0 6px 20px rgba(58,158,110,.1);">'
    +'<div style="font-size:13px;font-weight:900;color:#155a38;margin-bottom:12px;display:flex;align-items:center;gap:6px;">✅ 선택된 가용시간 <span style=\'font-size:11px;background:#3a9e6e;color:#fff;padding:2px 8px;border-radius:999px;font-weight:700;\'>'+entries.length+'일</span></div>';
  entries.forEach(function(e){
    html+='<div style="margin-bottom:10px;padding:10px 12px;background:linear-gradient(135deg,#f3faf6,#eef8fb);border-radius:11px;border:1px solid rgba(58,158,110,.15);">'
      +'<div style="font-size:12px;font-weight:800;color:#1a6640;margin-bottom:6px;">📅 '+dispDate(e[0])+'</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:5px;">'+e[1].map(function(t){return '<span style="background:linear-gradient(135deg,#3a9e6e,#2d7a55);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;">'+t+'</span>';}).join('')+'</div>'
      +'</div>';
  });
  return html+'</div>';
}

function buildAgendaListHTML(){
  var KD=['일','월','화','수','목','금','토'];
  var entries=Object.entries(window._availSlots||{}).filter(function(e){return e[1].length>0;}).sort(function(a,b){return a[0].localeCompare(b[0]);});

  // 총 건수 업데이트
  var cnt = entries.length;
  var chip = document.getElementById('totalChip');
  if(chip) chip.textContent = '총 '+cnt+'건 선택';
  var actionCnt = document.getElementById('actionCnt');
  if(actionCnt) actionCnt.textContent = cnt;
  var previewChip = document.getElementById('previewChip');
  var extraCnt    = document.getElementById('extraCnt');
  if(previewChip){
    if(entries.length>0){
      var fe=entries[0];
      var d0=new Date(fe[0]+'T00:00:00');
      previewChip.textContent = fe[0].slice(5).replace('-','.')+' ('+KD[d0.getDay()]+') '+formatTimeValue(fe[1][0]);
      if(extraCnt) extraCnt.textContent = cnt>1?'외 '+(cnt-1)+'건':'';
    } else {
      previewChip.textContent='';
      if(extraCnt) extraCnt.textContent='';
    }
  }

  if(!entries.length){
    return '<div class="av2-agenda-empty">'
      +'<div style="font-size:32px;margin-bottom:8px;">🗓️</div>'
      +'<div style="font-weight:800;font-size:13px;color:#374151;margin-bottom:4px;">선택한 일정이 없습니다</div>'
      +'<div style="font-size:12px;color:#94a3b8;">날짜를 선택한 뒤<br>가능한 시간을 눌러주세요</div>'
      +'</div>';
  }

  var rows = entries.map(function(e){
    var d   = new Date(e[0]+'T00:00:00');
    var dow = KD[d.getDay()];
    var mo  = e[0].slice(5,7);
    var day = e[0].slice(8);
    var lbl = mo+'.'+day+' ('+dow+')';
    var chips = e[1].map(function(t){
      return '<span class="av2-agenda-time">'+formatTimeValue(t)+'</span>';
    }).join('');
    return '<div class="av2-agenda-item">'
      +'<div class="av2-agenda-date">'
        +'<div class="av2-agenda-dot">●</div>'
        +'<div class="av2-agenda-lbl">'+lbl+'</div>'
      +'</div>'
      +'<div class="av2-agenda-times">'+chips+'</div>'
      +'<button class="av2-agenda-del" onclick="(function(){delete window._availSlots[\''+e[0]+'\'];var el=document.getElementById(\'agendaList\');if(el)el.innerHTML=buildAgendaListHTML();var cal=document.getElementById(\'datebtn-'+e[0]+'\');if(cal){cal.className=\'av2-day avail\';cal.innerHTML=\''+parseInt(e[0].slice(8))+'\';}})()" title="삭제">✕</button>'
    +'</div>';
  }).join('');

  return rows;
}

function selectAvailDate(date){
  window._availSelDate=date;
  document.querySelectorAll('[id^="datebtn-"]').forEach(function(el){
    var d=el.id.replace('datebtn-','');
    var has=window._availSlots[d]&&window._availSlots[d].length>0;
    var sel=d===date;
    var dow=new Date(d+'T00:00:00').getDay();
    el.className='av2-day avail'+(dow===0?' av2-sun':dow===6?' av2-sat':'')
      +(sel?' selected':has?' has-slots':'');
    el.innerHTML=parseInt(d.slice(8))+(has?'<span class="av2-dot"></span>':'');
  });
  var t=document.getElementById('timeTitle');
  if(t) t.textContent='📅 '+dispDate(date);
  HOURS.forEach(function(h){
    var btn=document.getElementById('timebtn-'+h.replace(':','-'));
    if(!btn) return;
    var isOn=window._availSlots[date]&&window._availSlots[date].includes(h);
    btn.className='av2-time-btn'+(isOn?' on':'');
    btn.innerHTML=h+(isOn?'<span class="av2-check">✓</span>':'');
  });
}

function toggleAvailTime(time){
  var date=window._availSelDate; if(!date) return;
  if(!window._availSlots[date]) window._availSlots[date]=[];
  var idx=window._availSlots[date].indexOf(time);
  if(idx>-1) window._availSlots[date].splice(idx,1);
  else{window._availSlots[date].push(time);window._availSlots[date].sort();}

  var btn=document.getElementById('timebtn-'+time.replace(':','-'));
  if(btn){var isOn=window._availSlots[date].includes(time);btn.className='time-btn'+(isOn?' on':'');}

  var calBtn=document.getElementById('datebtn-'+date);
  if(calBtn){
    var has=window._availSlots[date].length>0;
    var sel=date===window._availSelDate;
    var cdow=new Date(date+'T00:00:00').getDay();
    calBtn.className='av2-day avail'+(cdow===0?' av2-sun':cdow===6?' av2-sat':'')
      +(sel?' selected':has?' has-slots':'');
    calBtn.innerHTML=parseInt(date.slice(8))+(has?'<span class="av2-dot"></span>':'');
  }
  var sumEl=document.getElementById('availSummary');
  if(sumEl) sumEl.innerHTML=buildAvailSummaryHTML();
  var agEl=document.getElementById('agendaList');
  if(agEl) agEl.innerHTML=buildAgendaListHTML();
}

function submitAvailPage(){
  var entries=Object.entries(window._availSlots||{}).filter(function(e){return e[1].length>0;});
  if(!entries.length){alert('최소 1개 이상의 시간을 선택해주세요.');return;}
  var btn=document.getElementById('submitAvailBtn');
  if(btn){btn.textContent='제출 중...';btn.disabled=true;}
  var data={matchId:window._availMatchId,역할:window._availRole,이름:window._availName,slots:entries.map(function(e){return{date:e[0],times:e[1]};})};
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'submitAvail',data:data})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.ok){
        document.getElementById('availScreen').innerHTML=
          '<div style="min-height:calc(100vh-60px);display:flex;align-items:center;justify-content:center;background:#f1f5f9;">'
          +'<div style="text-align:center;padding:48px;background:#fff;border-radius:22px;box-shadow:0 6px 28px rgba(0,0,0,.1);max-width:440px;width:90%;">'
          +'<div style="font-size:60px;margin-bottom:20px;">✅</div>'
          +'<div style="font-size:20px;font-weight:900;color:#1a3d2b;margin-bottom:10px;">가용시간이 제출되었습니다!</div>'
          +'<div style="font-size:14px;color:#64748b;line-height:1.8;">담당자가 상대방의 가용시간과 비교하여<br>최적 일정을 확정 후 안내드릴 예정입니다.</div>'
          +'<div style="margin-top:22px;padding:16px;background:#e8f5ef;border-radius:12px;">'
          +entries.map(function(e){return '<div class="avail-row"><span class="avail-date-lbl" style="font-size:13px;color:#155a38;">'+dispDate(e[0])+'</span><div class="avail-times">'+e[1].map(function(t){return '<span class="time-chip" style="background:rgba(5,150,105,.1);color:#155a38;">'+t+'</span>';}).join('')+'</div></div>';}).join('')
          +'</div>'
          +'<div style="margin-top:20px;font-size:12px;color:#94a3b8;">문의: 해외인증지원단 02-6240-4777</div>'
          +'</div></div>';
      } else {
        alert('❌ 오류: '+(res.error||'다시 시도해주세요.'));
        if(btn){btn.textContent='가용시간 제출하기 →';btn.disabled=false;}
      }
    })
    .catch(function(err){alert('❌ 네트워크 오류: '+err.message);if(btn){btn.textContent='가용시간 제출하기 →';btn.disabled=false;}});
}

// ══ 유틸 ══
function calcMatchedSlots(matchId){
  var compRows=DATA.avail.filter(function(a){return a['매칭ID']===matchId&&a['역할']==='기업';});
  var expRows =DATA.avail.filter(function(a){return a['매칭ID']===matchId&&a['역할']==='전문가';});
  if(!compRows.length||!expRows.length) return [];
  var compMap={},expMap={};
  compRows.forEach(function(r){compMap[normDate(r['날짜'])]=(r['시간목록']||'').split(',').map(normalizeTimeValue).filter(Boolean);});
  expRows.forEach(function(r){expMap[normDate(r['날짜'])]=(r['시간목록']||'').split(',').map(normalizeTimeValue).filter(Boolean);});
  var matched=[];
  Object.keys(compMap).forEach(function(date){
    if(!expMap[date]) return;
    var set={};expMap[date].forEach(function(t){set[t]=true;});
    compMap[date].forEach(function(t){if(set[t])matched.push({date:date,time:t,label:dispDate(date)+' '+t});});
  });
  return matched.sort(function(a,b){return a.date.localeCompare(b.date)||a.time.localeCompare(b.time);});
}

function getUrlParams(){
  var p={};
  window.location.search.replace(/[?&]+([^=&]+)=([^&]*)/gi,function(_,k,v){p[k]=decodeURIComponent(v);});
  return p;
}
