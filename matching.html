<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해외인증지원단 멘토링 상담예약</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:#f0f7f4;color:#1e3a2f;min-height:100vh;font-size:14px;}

/* ── 헤더 ── */
.hdr{background:#ffffff;padding:0 28px;display:flex;align-items:center;gap:14px;height:62px;border-bottom:1.5px solid #c8e6d4;position:sticky;top:0;z-index:100;}
.hdr-icon{width:36px;height:36px;background:#d4ede2;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.hdr-title{color:#1a3d2b;font-weight:900;font-size:16px;letter-spacing:-.3px;}
.hdr-sub{color:#6b9e85;font-size:11px;margin-top:1px;}
.hdr-badge{margin-left:auto;font-size:12px;font-weight:700;background:#e8f5ef;color:#2d7a55;padding:5px 14px;border-radius:7px;border:1.5px solid #c2ddd0;}

/* ── 로딩 ── */
#loadingScreen{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
.spinner{width:38px;height:38px;border:3px solid #c8e6d4;border-top-color:#3a9e6e;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 메인 ── */
#mainScreen{display:none;}
.content{padding:22px 26px;}

/* ── avail 전용 ── */
#availScreen{display:none;min-height:calc(100vh - 62px);}

/* ── KPI 바 ── */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:20px;}
.kpi-card{border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .18s;border:1.5px solid transparent;position:relative;overflow:hidden;}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08);}
.kpi-val{font-size:28px;font-weight:900;line-height:1;letter-spacing:-1.5px;}
.kpi-lbl{font-size:12px;font-weight:700;margin-top:5px;opacity:.85;}

/* ── 툴바 ── */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.toolbar input,.toolbar select{border:1.5px solid #c8e6d4;border-radius:9px;padding:9px 13px;font-size:13px;outline:none;background:#fff;font-family:inherit;transition:border-color .15s;}
.toolbar input:focus,.toolbar select:focus{border-color:#3a9e6e;}
.toolbar input{flex:1;min-width:220px;}
.cnt-badge{font-size:13px;color:#5a8a72;font-weight:700;white-space:nowrap;padding:8px 13px;background:#fff;border-radius:8px;border:1.5px solid #c8e6d4;}
.add-btn{padding:9px 20px;background:#2d7a55;color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;}
.add-btn:hover{background:#236644;transform:translateY(-1px);}
.view-tabs{display:flex;gap:3px;background:#ddeee6;border-radius:9px;padding:3px;}
.view-tab{padding:6px 13px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;background:transparent;color:#5a8a72;transition:all .15s;}
.view-tab.active{background:#fff;color:#1a3d2b;}

/* ── 보드 뷰 ── */
.board-wrap{overflow-x:auto;padding-bottom:8px;}
.board{display:flex;gap:12px;min-width:max-content;}
.board-col{width:275px;flex-shrink:0;}
.board-col-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-radius:11px 11px 0 0;margin-bottom:2px;}
.board-col-title{font-size:13px;font-weight:800;letter-spacing:-.2px;}
.board-col-cnt{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.08);}
.board-col-body{display:flex;flex-direction:column;gap:7px;padding:7px;background:#e4f0e9;border-radius:0 0 11px 11px;min-height:120px;}
.board-card{background:#fff;border-radius:10px;padding:13px 15px;cursor:pointer;transition:all .15s;border:1.5px solid #daeee3;}
.board-card:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(58,158,110,.12);border-color:#8dcaab;}
.board-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px;}
.board-card-company{font-size:14px;font-weight:900;color:#1a3d2b;letter-spacing:-.2px;line-height:1.3;}
.board-card-expert{font-size:12px;color:#6b9e85;margin-top:2px;font-weight:600;}
.board-card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 8px;border-radius:6px;font-weight:700;}
.avail-bar{display:flex;gap:4px;margin-top:7px;}
.avail-dot{flex:1;height:4px;border-radius:3px;transition:all .2s;}

/* ── 리스트 뷰 ── */
.match-list{display:flex;flex-direction:column;gap:7px;}
.match-card{background:#fff;border-radius:12px;border:1.5px solid #daeee3;padding:15px 19px;cursor:pointer;transition:all .15s;}
.match-card:hover{border-color:#3a9e6e;transform:translateY(-1px);box-shadow:0 4px 14px rgba(58,158,110,.1);}
.empty-state{text-align:center;padding:60px 24px;color:#8ab89e;background:#fff;border-radius:13px;border:1.5px dashed #c8e6d4;}

/* ── 폼 ── */
.form-wrap{background:#fff;border-radius:14px;padding:26px;border:1.5px solid #daeee3;}
.form-section-title{font-size:13px;font-weight:800;margin-bottom:13px;padding-bottom:8px;border-bottom:2px solid;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:20px;}
.form-field label{display:block;font-size:12px;font-weight:700;color:#5a8a72;margin-bottom:5px;}
.form-field input,.form-field textarea{width:100%;padding:10px 13px;border:1.5px solid #c8e6d4;border-radius:8px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;}
.form-field input:focus,.form-field textarea:focus{border-color:#3a9e6e;box-shadow:0 0 0 3px rgba(58,158,110,.12);}
.form-actions{display:flex;gap:9px;}
.btn-cancel{flex:1;padding:11px;border:1.5px solid #c8e6d4;border-radius:10px;background:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:#5a8a72;}
.btn-submit{flex:2;padding:11px;border:none;border-radius:10px;background:#2d7a55;color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;}

/* ── 상세 ── */
.back-row{display:flex;align-items:center;gap:11px;margin-bottom:18px;padding:12px 17px;background:#fff;border-radius:11px;border:1.5px solid #daeee3;}
.back-btn{background:#e8f5ef;border:none;border-radius:7px;padding:7px 13px;cursor:pointer;font-size:13px;font-family:inherit;color:#1a3d2b;font-weight:700;}
.back-btn:hover{background:#c8e6d4;color:#2d7a55;}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px;}
.detail-field{background:#f3faf6;border-radius:9px;padding:10px 13px;border:1px solid #daeee3;}
.detail-key{font-size:10px;font-weight:800;color:#8ab89e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.detail-val{font-size:14px;color:#1a3d2b;font-weight:700;}
.avail-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:14px;}
.avail-box{border-radius:13px;padding:17px 19px;border:1.5px solid;}
.avail-row{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.05);}
.avail-row:last-child{border-bottom:none;}
.avail-date-lbl{font-size:13px;font-weight:800;min-width:110px;}
.avail-times{display:flex;flex-wrap:wrap;gap:5px;}
.time-chip{background:rgba(58,158,110,.1);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;color:#2d7a55;}
.matched-box{background:#f3faf6;border-radius:13px;padding:19px 21px;border:1.5px solid #a0d4b8;margin-bottom:14px;}
.avail-input-box{background:#fff;border-radius:13px;padding:19px 21px;border:1.5px solid #daeee3;}
.slot-confirm-btn{padding:7px 11px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid #a0d4b8;background:#e8f5ef;color:#1a6640;font-family:inherit;transition:all .15s;}
.slot-confirm-btn:hover{background:#2d7a55;color:#fff;}
.badge{display:inline-block;font-size:11px;padding:4px 11px;border-radius:7px;font-weight:800;}
.info-box{background:#e8f5ef;border-radius:9px;padding:11px 15px;margin-bottom:18px;font-size:13px;color:#1a6640;line-height:1.7;border:1px solid #b8deca;}

/* ── 달력 ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day-hdr{text-align:center;font-size:11px;font-weight:700;padding:6px 0;color:#8ab89e;}
.cal-day-hdr.sun{color:#e07070;}
.cal-day-hdr.sat{color:#5a9ec4;}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;transition:all .15s;}
.cal-cell.avail{cursor:pointer;border:1.5px solid #daeee3;background:#f3faf6;color:#1a3d2b;}
.cal-cell.avail:hover{border-color:#3a9e6e;background:#d4ede2;}
.cal-cell.avail.has-slots{border-color:#3a9e6e;background:#c8e6d4;color:#1a6640;}
.cal-cell.avail.selected{border-color:#2d7a55;background:#2d7a55;color:#fff;}
.cal-cell.avail.selected .cal-dot{background:rgba(255,255,255,.7);}
.cal-cell.disabled{color:#c8e6d4;font-weight:500;}
.cal-cell.sun-col{color:#e07070;}
.cal-cell.sat-col{color:#5a9ec4;}
.cal-cell.avail.selected.sun-col,.cal-cell.avail.selected.sat-col{color:#fff;}
.cal-dot{width:5px;height:5px;border-radius:50%;background:#3a9e6e;}
.cal-month-title{font-size:14px;font-weight:800;color:#1a3d2b;text-align:center;margin-bottom:11px;padding:7px 0;border-bottom:1px solid #e4f0e9;}

/* =========================================================
   Matching System Soft Calendar Theme Override
   이미지 베이스: pastel mint / sky / clean schedule UI
   기존 CSS 맨 아래에 추가해서 사용
========================================================= */

:root {
  --bg-main: #eef8f4;
  --bg-soft: #f7fcfa;
  --card: rgba(255, 255, 255, 0.82);
  --card-solid: #ffffff;

  --mint-50: #eefaf4;
  --mint-100: #d9f2e5;
  --mint-200: #bfe7d4;
  --mint-300: #93d3b3;
  --mint-500: #3a9e6e;
  --mint-700: #1f6b48;

  --sky-50: #eef8fb;
  --sky-100: #dceff5;
  --sky-200: #bfe0ea;
  --sky-500: #74b6ca;

  --text-main: #213a33;
  --text-sub: #6a8d81;
  --line: #d6e9df;

  --radius-xl: 24px;
  --radius-lg: 18px;
  --radius-md: 12px;

  --shadow-soft: 0 14px 40px rgba(59, 117, 94, 0.12);
  --shadow-card: 0 8px 24px rgba(59, 117, 94, 0.10);
}

/* 전체 배경 */
body {
  background:
    radial-gradient(circle at 8% 12%, rgba(182, 236, 205, 0.55), transparent 28%),
    radial-gradient(circle at 90% 8%, rgba(189, 226, 238, 0.62), transparent 30%),
    linear-gradient(135deg, #edf8f3 0%, #eaf6f7 48%, #e8f1f8 100%);
  color: var(--text-main);
  letter-spacing: -0.2px;
}

/* 상단 헤더 */
.hdr {
  height: 72px;
  padding: 0 34px;
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(214, 233, 223, 0.9);
  box-shadow: 0 8px 28px rgba(66, 121, 100, 0.08);
}

.hdr-icon {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--mint-100), var(--sky-100));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.7);
}

.hdr-title {
  font-size: 18px;
  font-weight: 900;
  color: var(--text-main);
}

.hdr-sub {
  font-size: 12px;
  color: var(--text-sub);
  font-weight: 600;
}

.hdr-badge {
  border: 0;
  border-radius: 999px;
  background: linear-gradient(135deg, #dff5e9, #e7f5f8);
  color: var(--mint-700);
  padding: 8px 16px;
  box-shadow: inset 0 0 0 1px rgba(58,158,110,.16);
}

/* 메인 여백 */
.content {
  padding: 30px;
  max-width: 1500px;
  margin: 0 auto;
}

/* 페이지 타이틀 영역 */
.content > div:first-child {
  animation: fadeUp .28s ease-out;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}


/* KPI 카드 */
.kpi-grid {
  grid-template-columns: repeat(5, minmax(150px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}

.kpi-card {
  min-height: 104px;
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  background: var(--card) !important;
  border: 1px solid rgba(255,255,255,.7) !important;
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(14px);
}

.kpi-card::after {
  content: "";
  position: absolute;
  right: -28px;
  top: -28px;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: rgba(191, 224, 234, 0.45);
}

.kpi-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 36px rgba(59, 117, 94, 0.16);
}

.kpi-val {
  font-size: 34px;
  letter-spacing: -2px;
}

.kpi-lbl {
  font-size: 13px;
  margin-top: 8px;
}


/* 검색/필터 툴바 */
.toolbar {
  padding: 14px;
  border-radius: var(--radius-lg);
  background: rgba(255,255,255,.62);
  border: 1px solid rgba(255,255,255,.8);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(14px);
  margin-bottom: 18px;
}

.toolbar input,
.toolbar select {
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  padding: 0 16px;
  color: var(--text-main);
}

.toolbar input:focus,
.toolbar select:focus {
  border-color: var(--mint-500);
  box-shadow: 0 0 0 4px rgba(58,158,110,.12);
}

.cnt-badge {
  height: 42px;
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  background: var(--mint-50);
  border: 1px solid var(--line);
  color: var(--mint-700);
}

.add-btn {
  height: 42px;
  border-radius: 999px;
  padding: 0 22px;
  background: linear-gradient(135deg, var(--mint-500), var(--mint-700));
  box-shadow: 0 10px 24px rgba(58,158,110,.25);
}

.add-btn:hover {
  background: linear-gradient(135deg, #45ad7b, #1f6b48);
}


/* 보드 전체 */
.board-wrap {
  padding: 6px 2px 14px;
}

.board {
  gap: 16px;
}

.board-col {
  width: 292px;
}

.board-col-hdr {
  min-height: 50px;
  padding: 14px 16px;
  border-radius: 18px 18px 8px 8px;
  background: rgba(255,255,255,.72) !important;
  border: 1px solid rgba(255,255,255,.82);
  box-shadow: var(--shadow-card);
}

.board-col-title {
  font-size: 14px;
  color: var(--text-main) !important;
}

.board-col-cnt {
  border-radius: 999px;
  background: rgba(58,158,110,.10);
  color: var(--mint-700) !important;
}

.board-col-body {
  padding: 10px;
  gap: 10px;
  border-radius: 8px 8px 20px 20px;
  background: rgba(255,255,255,.42);
  border: 1px solid rgba(255,255,255,.65);
  min-height: 300px;
}


/* 매칭 카드 */
.board-card,
.match-card,
.form-wrap,
.avail-box,
.matched-box,
.avail-input-box {
  background: rgba(255,255,255,.86);
  border: 1px solid rgba(255,255,255,.82);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(14px);
}

.board-card {
  border-radius: 18px;
  padding: 16px;
}

.board-card:hover,
.match-card:hover {
  transform: translateY(-4px);
  border-color: rgba(58,158,110,.35);
  box-shadow: 0 16px 36px rgba(59, 117, 94, 0.16);
}

.board-card-company {
  font-size: 15px;
  font-weight: 900;
  color: var(--text-main);
}

.board-card-expert {
  color: var(--text-sub);
}

.chip {
  border-radius: 999px;
  padding: 5px 9px;
  background: var(--mint-50) !important;
  color: var(--mint-700) !important;
}

.avail-dot {
  height: 6px;
  border-radius: 999px;
}


/* 목록 카드 */
.match-card {
  border-radius: 20px;
  padding: 18px 22px;
}


/* 상세 페이지 */
.back-row {
  border-radius: 18px;
  background: rgba(255,255,255,.76);
  border: 1px solid rgba(255,255,255,.82);
  box-shadow: var(--shadow-card);
}

.back-btn {
  border-radius: 999px;
  background: var(--mint-50);
  color: var(--mint-700);
}

.detail-grid {
  gap: 12px;
}

.detail-field {
  border-radius: 16px;
  background: linear-gradient(135deg, #f7fcfa, #f1f8f6);
  border: 1px solid var(--line);
}

.detail-key {
  color: var(--text-sub);
}

.detail-val {
  color: var(--text-main);
}


/* 가용시간 박스 */
.avail-grid {
  gap: 16px;
}

.avail-box {
  border-radius: 22px;
  padding: 20px 22px;
}

.avail-row {
  padding: 9px 0;
}

.time-chip {
  border-radius: 999px;
  background: var(--mint-100);
  color: var(--mint-700);
  padding: 4px 10px;
}


/* 겹치는 슬롯 */
.matched-box {
  border-radius: 22px;
  background: linear-gradient(135deg, rgba(232,245,239,.92), rgba(238,248,251,.92));
  border: 1px solid rgba(58,158,110,.22);
}

.slot-confirm-btn {
  border-radius: 999px;
  background: #ffffff;
  color: var(--mint-700);
  border: 1px solid var(--mint-200);
}

.slot-confirm-btn:hover {
  background: var(--mint-700);
  color: #fff;
}


/* 폼 */
.form-wrap {
  border-radius: 24px;
}

.form-section-title {
  border-bottom-width: 1px;
}

.form-field input,
.form-field textarea {
  border-radius: 14px;
  background: #fbfefd;
  border-color: var(--line);
}

.form-field input:focus,
.form-field textarea:focus {
  border-color: var(--mint-500);
  box-shadow: 0 0 0 4px rgba(58,158,110,.12);
}

.btn-cancel,
.btn-submit {
  border-radius: 999px;
}

.btn-submit {
  background: linear-gradient(135deg, var(--mint-500), var(--mint-700));
}


/* 달력: 이미지 느낌 핵심 */
.cal-month-title {
  font-size: 15px;
  border-bottom: 0;
  padding: 10px 0 14px;
  color: var(--text-main);
}

.cal-grid {
  gap: 5px;
}

.cal-day-hdr {
  color: var(--text-sub);
  font-size: 11px;
}

.cal-cell {
  border-radius: 14px;
  font-size: 13px;
}

.cal-cell.avail {
  border: 1px solid rgba(255,255,255,.78);
  background: linear-gradient(135deg, #e9f8ef, #e8f3f6);
  color: var(--text-main);
}

.cal-cell.avail:hover {
  background: linear-gradient(135deg, #d7f1e3, #dbeff4);
  border-color: rgba(58,158,110,.35);
  transform: translateY(-2px);
}

.cal-cell.avail.has-slots {
  background: linear-gradient(135deg, #c8efd8, #cfeaf1);
  color: var(--mint-700);
  box-shadow: inset 0 0 0 1px rgba(58,158,110,.25);
}

.cal-cell.avail.selected {
  background: linear-gradient(135deg, var(--mint-500), var(--sky-500));
  color: #fff;
  box-shadow: 0 10px 22px rgba(58,158,110,.28);
}

.cal-dot {
  width: 6px;
  height: 6px;
  background: var(--mint-500);
}

.cal-cell.avail.selected .cal-dot {
  background: rgba(255,255,255,.75);
}

/* 기존 CSS 오타 보정 */
.cal-cell.avail.selected.sun-col,
.cal-cell.avail.selected.sat-col {
  color: #fff;
}


/* 이메일 링크용 가용시간 페이지 안쪽 카드 보정 */

/* ══════════════════════════════════════════════
   Schedule / Agenda 3단 레이아웃
══════════════════════════════════════════════ */

/* 가용시간 입력 전체 래퍼 */
.avail-page-wrap {
  min-height: calc(100vh - 62px);
  background:
    radial-gradient(circle at 8% 12%, rgba(182,236,205,.55), transparent 28%),
    radial-gradient(circle at 92% 8%, rgba(189,226,238,.62), transparent 32%),
    linear-gradient(135deg, #edf8f3 0%, #e8f1f8 100%);
}
/* ── 가용시간 입력 페이지 래퍼 ── */
.avail-page-inner {
  max-width: 1160px;
  width: 100%;
  margin: 0 auto;
  padding: 22px 24px 90px;
}

/* 안내 카드 */
.avail-info-card {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.82);
  border-radius: 20px;
  padding: 20px 26px;
  margin-bottom: 20px;
  box-shadow: 0 6px 24px rgba(59,117,94,.1);
}
.avail-info-card-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; flex-shrink: 0;
}
.avail-info-card-name { font-size: 17px; font-weight: 900; color: #1a3d2b; letter-spacing: -.3px; }
.avail-info-card-sub  { font-size: 13px; color: #64748b; margin-top: 2px; }
.avail-warn-badge {
  background: #fffbeb; border: 1.5px solid #fde68a;
  border-radius: 10px; padding: 10px 16px;
  font-size: 12px; color: #92400e; font-weight: 700; flex-shrink: 0;
}

/* ── 3단 Schedule 레이아웃: 날짜 → 시간 → 결과 ── */
.schedule-template-layout {
  display: grid;
  grid-template-columns: minmax(440px, 580px) 185px 340px;
  grid-template-areas: "cal time agenda";
  gap: 16px;
  align-items: start;
  justify-content: center;
  margin-bottom: 20px;
}

/* 공통 패널 베이스 */
.sch-panel {
  background: rgba(255,255,255,.9);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.85);
  border-radius: 20px;
  box-shadow: 0 6px 24px rgba(59,117,94,.1);
}
.sch-panel-title {
  font-size: 12px; font-weight: 900; color: #1a3d2b;
  padding-bottom: 10px; margin-bottom: 14px;
  border-bottom: 1px solid #e4f0e9;
  display: flex; align-items: center; gap: 6px;
}

/* 왼쪽: 월별 캘린더 */
.month-calendar-panel {
  grid-area: cal;
  padding: 22px 24px;
  max-height: calc(100vh - 240px);
  overflow-y: auto;
}
.month-calendar-panel::-webkit-scrollbar { width: 4px; }
.month-calendar-panel::-webkit-scrollbar-thumb { background: #c8e6d4; border-radius: 4px; }
.month-calendar-panel .cal-grid {
  grid-template-columns: repeat(7, minmax(44px, 62px));
  justify-content: center;
  gap: 6px;
}
.month-calendar-panel .cal-cell {
  border-radius: 12px;
  aspect-ratio: auto;
  height: 54px;
  min-height: 54px;
}
.cal-legend {
  display: flex; gap: 14px; font-size: 11px; color: #6a8d81;
  margin-top: 10px; flex-wrap: wrap;
  padding-top: 10px; border-top: 1px solid #e4f0e9;
}
.cal-legend-dot {
  width: 8px; height: 8px; border-radius: 50%; display: inline-block;
}

/* 가운데: 시간 선택 */
.time-ruler-panel {
  grid-area: time;
  padding: 18px 16px;
  position: sticky;
  top: 80px;
}
.time-ruler-date-lbl {
  font-size: 12px; color: #3a9e6e; font-weight: 700;
  margin-bottom: 14px; padding: 7px 12px;
  background: #e8f5ef; border-radius: 9px;
  border: 1px solid #a0d4b8; text-align: center; display: block;
}
.time-ruler-list { display: flex; flex-direction: column; gap: 6px; }
.time-btn {
  width: 100%; padding: 11px; border-radius: 10px;
  cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 800;
  transition: all .15s; text-align: center;
  border: 1.5px solid #daeee3; background: #fff; color: #374151;
}
.time-btn:hover { transform: translateY(-1px); border-color: #3a9e6e; box-shadow: 0 3px 10px rgba(58,158,110,.15); }
.time-btn.on {
  background: linear-gradient(135deg, #3a9e6e, #2d7a55);
  border-color: transparent; color: #fff;
  box-shadow: 0 5px 14px rgba(58,158,110,.28);
}

/* 오른쪽: Agenda 일정 리스트 */
.agenda-panel {
  grid-area: agenda;
  padding: 0;
  position: sticky;
  top: 80px;
  max-height: calc(100vh - 240px);
  overflow-y: auto;
  overflow-x: hidden;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
}
.agenda-panel::-webkit-scrollbar { width: 4px; }
.agenda-panel::-webkit-scrollbar-thumb { background: rgba(58,158,110,.25); border-radius: 4px; }

/* Agenda 패널 헤더 */
.agenda-panel .sch-panel-title {
  padding: 14px 18px 10px;
  margin-bottom: 0;
  background: rgba(255,255,255,.9);
  border-radius: 18px 18px 0 0;
  border-bottom: 1px solid rgba(58,158,110,.1);
  position: sticky;
  top: 0;
  z-index: 2;
  backdrop-filter: blur(10px);
}

/* 일정 리스트 래퍼 */
.agenda-list {
  display: flex;
  flex-direction: column;
}

/* 각 날짜 행 */
.agenda-row {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid rgba(255,255,255,.6);
  transition: background .15s;
  min-height: 64px;
}
.agenda-row:last-child { border-bottom: none; border-radius: 0 0 18px 18px; }
.agenda-row:first-child { border-radius: 0; }
.agenda-row:only-child { border-radius: 0 0 18px 18px; }

/* 날짜 셀 (왼쪽 민트 컬럼) */
.agenda-date-cell {
  flex-shrink: 0;
  width: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 6px;
  background: linear-gradient(180deg, #b2dfc8 0%, #9ed4c4 100%);
  color: #155a38;
  text-align: center;
}
.agenda-row:last-child .agenda-date-cell { border-radius: 0 0 0 18px; }

.agenda-dow {
  font-size: 10px;
  font-weight: 700;
  opacity: .75;
  letter-spacing: .5px;
  text-transform: uppercase;
  line-height: 1;
  margin-bottom: 2px;
}
.agenda-day {
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1px;
}

/* 일정 콘텐츠 (오른쪽 흰색/민트 영역) */
.agenda-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 12px 16px;
  background: linear-gradient(135deg, rgba(232,245,239,.85) 0%, rgba(232,242,247,.85) 100%);
  min-width: 0;
}

.agenda-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.agenda-bullet {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #3a9e6e;
  flex-shrink: 0;
}
.agenda-date-label {
  font-size: 12px;
  font-weight: 800;
  color: #1a3d2b;
  letter-spacing: -.2px;
}

.agenda-times {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-left: 13px;
}
.agenda-time-chip {
  background: rgba(255,255,255,.82);
  border: 1px solid rgba(58,158,110,.22);
  color: #1a6640;
  border-radius: 8px;
  padding: 3px 9px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -.2px;
  backdrop-filter: blur(4px);
}

/* 빈 상태 */
.agenda-empty-wrap {
  padding: 28px 18px;
  background: linear-gradient(135deg, rgba(232,245,239,.7), rgba(232,242,247,.7));
  border-radius: 0 0 18px 18px;
  text-align: center;
}
.agenda-empty-icon { font-size: 32px; margin-bottom: 10px; }
.agenda-empty-title { font-size: 13px; font-weight: 800; color: #1a3d2b; margin-bottom: 5px; }
.agenda-empty-desc  { font-size: 11px; color: #6b9e85; line-height: 1.7; }

/* 제출 버튼 fixed (PC) */
.avail-submit-fixed {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 14px 24px;
  background: rgba(237,248,243,.92);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(58,158,110,.15);
  z-index: 50;
}
.avail-submit-btn {
  display: block;
  max-width: 1160px;
  margin: 0 auto;
  width: 100%;
  padding: 15px;
  border: none; border-radius: 14px;
  background: linear-gradient(135deg, #3a9e6e, #1f6b48);
  color: #fff; font-size: 15px; font-weight: 900;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 6px 20px rgba(58,158,110,.32);
  letter-spacing: -.2px;
}

/* 관리자 직접 입력 3단: 달력 → 시간 → 요약 */
.admin-schedule-layout {
  display: grid;
  grid-template-columns: 1fr 148px 180px;
  grid-template-areas: "cal time summary";
  gap: 14px;
  align-items: start;
}
.admin-cal-panel     { grid-area: cal;     background: #f3faf6; border-radius: 16px; padding: 18px 20px; border: 1px solid #daeee3; }
.admin-time-panel    { grid-area: time;    background: #f3faf6; border-radius: 16px; padding: 16px 14px; border: 1px solid #daeee3; position: sticky; top: 80px; }
.admin-summary-panel { grid-area: summary; background: #f3faf6; border-radius: 16px; padding: 16px 14px; border: 1px solid #daeee3; position: sticky; top: 80px; }
.admin-panel-title { font-size: 12px; font-weight: 900; color: #1a3d2b; margin-bottom: 10px; }
.admin-time-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.admin-time-btn {
  padding: 10px 4px; border-radius: 9px; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 800;
  transition: all .15s; text-align: center;
  border: 1.5px solid #c8e6d4; background: #fff; color: #374151;
}
.admin-time-btn.on {
  background: linear-gradient(135deg, #3a9e6e, #2d7a55);
  border-color: transparent; color: #fff;
}

/* ── 반응형 ── */
@media (max-width: 960px) {
  .schedule-template-layout {
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "cal cal" "time agenda";
    justify-content: stretch;
  }
  .month-calendar-panel { max-height: none; overflow-y: visible; }
  .agenda-panel, .time-ruler-panel { position: static; max-height: none; overflow: visible; }
  .avail-submit-fixed { position: static; background: transparent; border-top: none; padding: 0; backdrop-filter: none; }
  .avail-submit-btn { border-radius: 16px; }
  .admin-schedule-layout {
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "cal cal" "time summary";
  }
}
@media (max-width: 600px) {
  .schedule-template-layout {
    grid-template-columns: 1fr;
    grid-template-areas: "cal" "time" "agenda";
  }
  .time-ruler-list { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .admin-schedule-layout {
    grid-template-columns: 1fr;
    grid-template-areas: "cal" "time" "summary";
  }
}
/* =========================================================
   Board Layout Fix
   관리자 보드 우측 잘림 방지
========================================================= */

/* 관리자 메인 화면은 더 넓게 사용 */
.content {
  max-width: min(1500px, calc(100vw - 80px));
  width: 100%;
  margin: 0 auto;
}

/* 보드 래퍼 */
.board-wrap {
  width: 100%;
  overflow-x: visible;
}

/* 기존 flex 고정폭 대신 5등분 grid */
.board {
  display: grid;
  grid-template-columns: repeat(5, minmax(180px, 1fr));
  gap: 14px;
  min-width: 0;
  width: 100%;
}

/* 컬럼도 고정폭 제거 */
.board-col {
  width: auto;
  min-width: 0;
  flex-shrink: 1;
}

/* 카드 안 긴 텍스트 때문에 밀리는 것 방지 */
.board-card {
  min-width: 0;
}

.board-card-company,
.board-card-expert,
.chip {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 작은 화면에서는 가로 스크롤 허용 */
@media (max-width: 1100px) {
  .board-wrap {
    overflow-x: auto;
  }

  .board {
    display: flex;
    min-width: max-content;
  }

  .board-col {
    width: 260px;
    flex-shrink: 0;
  }
}

/* ═══════════════════════════════════════════════════════
   관리자 2단 대시보드 — Admin Dashboard Layout
═══════════════════════════════════════════════════════ */
.cadmin-wrap {
  display: grid;
  grid-template-columns: 290px 1fr;
  gap: 20px;
  align-items: start;
  margin-top: 4px;
}
@media (max-width: 860px) {
  .cadmin-wrap { grid-template-columns: 1fr; }
}

/* ─── 왼쪽 사이드바 ─── */
.cadmin-sidebar {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.cadmin-sidebar-sec {
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(58,158,110,.15);
  border-radius: 16px;
  overflow: hidden;
}
.cadmin-sec-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 16px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: -.2px;
}
.cadmin-sec-cnt {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  background: rgba(255,255,255,.55);
}
.cadmin-sec-body {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 360px;
  overflow-y: auto;
  background: rgba(228,240,233,.35);
}
.cadmin-sec-body::-webkit-scrollbar { width: 3px; }
.cadmin-sec-body::-webkit-scrollbar-thumb { background: rgba(58,158,110,.2); border-radius: 3px; }
.cadmin-sec-empty {
  text-align: center;
  padding: 14px 0;
  font-size: 12px;
  color: #94a3b8;
}

/* ─── 오른쪽 Agenda 메인 영역 ─── */
.cadmin-main {
  background: #fff;
  border-radius: 22px;
  border: 1px solid rgba(58,158,110,.18);
  overflow: hidden;
}

/* Agenda 헤더 */
.cadmin-agenda-hdr {
  padding: 22px 28px 18px;
  border-bottom: 2px solid #d4ece3;
  background: linear-gradient(135deg, #f3faf6 0%, #eef8fb 100%);
}
.cadmin-agenda-hdr-brand {
  font-size: 11px;
  font-weight: 800;
  color: #3a9e6e;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.cadmin-agenda-hdr-title {
  font-size: 26px;
  font-weight: 900;
  color: #1a3d2b;
  letter-spacing: -1px;
  line-height: 1.1;
}
.cadmin-agenda-hdr-title span {
  font-weight: 400;
  color: #5a9e7e;
}
.cadmin-agenda-hdr-sub {
  font-size: 13px;
  color: #6b9e85;
  margin-top: 4px;
  font-weight: 500;
}

/* Agenda 리스트 */
.cadmin-agenda-list {
  display: flex;
  flex-direction: column;
}

/* 각 행 */
.cadmin-row {
  display: flex;
  align-items: stretch;
  border-bottom: 2px solid #fff;
  cursor: pointer;
  transition: filter .15s, transform .1s;
  min-height: 72px;
}
.cadmin-row:last-child { border-bottom: none; }
.cadmin-row:hover { filter: brightness(.96); transform: translateX(2px); }

/* 날짜 셀 (왼쪽) */
.cadmin-date {
  flex-shrink: 0;
  width: 72px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 14px 8px;
  text-align: center;
  border-right: 2px solid rgba(255,255,255,.7);
}
.cadmin-dow {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .8px;
  text-transform: uppercase;
  opacity: .75;
  line-height: 1;
  margin-bottom: 3px;
}
.cadmin-day {
  font-size: 28px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1.5px;
}
.cadmin-time-badge {
  font-size: 10px;
  font-weight: 700;
  margin-top: 5px;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255,255,255,.4);
  letter-spacing: .3px;
}

/* 날짜 셀 색상 — 상태별 */
.cadmin-date.s-matched  { background: #a8d8be; color: #1a4433; }
.cadmin-date.s-confirmed { background: #7bbfa8; color: #0f3024; }
.cadmin-date.s-pending  { background: #b8cfc9; color: #384d48; }

/* 오른쪽 콘텐츠 영역 */
.cadmin-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 14px 20px;
  min-width: 0;
}
.cadmin-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}
.cadmin-bullet {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.cadmin-title {
  font-size: 16px;
  font-weight: 900;
  color: #1a3d2b;
  letter-spacing: -.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.cadmin-title-exp {
  font-size: 14px;
  font-weight: 500;
  color: #4a7a60;
}
.cadmin-time {
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 800;
  color: #1a4433;
  white-space: nowrap;
}
.cadmin-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.cadmin-chip {

  font-weight: 700;
  padding: 3px 9px;

}
.cadmin-chip-status { background: rgba(255,255,255,.6); color: #155a38; border: 1px solid rgba(58,158,110,.25); }
.cadmin-chip-field  { background: rgba(255,255,255,.45); color: #374151; border: 1px solid rgba(0,0,0,.07); }
.cadmin-chip-slot   { background: rgba(255,255,255,.5); color: #5b21b6; border: 1px solid rgba(91,33,182,.2); }

/* 행 배경색 팔레트 (4색 순환) */

.cadmin-row-1 .cadmin-content { background: linear-gradient(135deg, #e8f5ef 0%, #f0faf5 100%); }
.cadmin-row-2 .cadmin-content { background: linear-gradient(135deg, #d4eef9 0%, #e2f4fb 100%); }
.cadmin-row-3 .cadmin-content { background: linear-gradient(135deg, #e2f4fb 0%, #eef9fd 100%); }

  <div>

  <div style="font-size:14px;color:#64748b;font-weight:600;">데이터를 불러오는 중입니다...</div>
</div>

  <div class="content">
    <div id="appRoot"></div>
  </div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzvCqJJjwrawISx2FywHHlAlavwCeimAK-w0XZgdZaDWViIEm0BJ3RIy1-iRozxTjX/exec';

let DATA = { matches: [], avail: [] };
let VIEW = { page: 'list', selectedId: null, listMode: 'board' };
let FORM = {};
let AVAIL_INPUT = { matchId: '', role: '', name: '', slots: {} };

const STATUS_CFG = {
  '대기중':  { bg:'#fef8e7', color:'#8a6200', col:'#f5c842' },
  '입력중':  { bg:'#e0f2ec', color:'#1a6640', col:'#4ab87a' },
  '매칭완료':{ bg:'#c8e6d4', color:'#155a38', col:'#3a9e6e' },
  '확정완료':{ bg:'#d4ede2', color:'#0f4027', col:'#2d7a55' },
  '취소':    { bg:'#fee2e2', color:'#991b1b', col:'#f87171' },
};
const STATUS_ORDER = ['대기중','입력중','매칭완료','확정완료','취소'];
const MEET_TYPES = ['화상미팅', '전화상담', '방문상담'];
const HOURS = ['09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00'];
const KO_DAYS = ['일','월','화','수','목','금','토'];

let _searchQ = '';
let _statusFilter = '전체';
let _selDate = '';

// ══ 날짜 유틸 ══
function toDateStr(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function normDate(raw) {
  if (!raw) return '';
  var s = String(raw).trim();
  // 이미 yyyy-MM-dd 형식
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // yyyy-MM-dd HH:mm:ss 형식 → 앞 10자리만
  if (/^\d{4}-\d{2}-\d{2} /.test(s)) return s.slice(0, 10);
  // Date 파싱 시도
  var d = new Date(s);
  return isNaN(d.getTime()) ? s.slice(0, 10) : toDateStr(d);
}
function dispDate(raw) {
  var n = normDate(raw); if (!n) return String(raw||'');
  var d = new Date(n+'T00:00:00'); if (isNaN(d.getTime())) return n;
  return n.replace(/-/g,'.')+' ('+KO_DAYS[d.getDay()]+')';
}
function dispDateShort(raw) {
  var n = normDate(raw); if (!n) return String(raw||'');
  var d = new Date(n+'T00:00:00'); if (isNaN(d.getTime())) return n;
  return n.slice(5).replace('-','.')+' ('+KO_DAYS[d.getDay()]+')';
}

// ══ 초기화 ══
window.onload = function() {
  var p = getUrlParams();
  if (p.id && p.role) {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('availScreen').style.display = 'block';
    loadAvailPage(p.id, p.role);
  } else {
    loadDashboard();
  }
};

function loadDashboard() {
  fetch(SCRIPT_URL)
    .then(function(r){return r.json();})
    .then(function(data){
      DATA.matches = data['멘토링_매칭']||[];
      DATA.avail   = data['가용시간']||[];
      document.getElementById('loadingScreen').style.display='none';
      document.getElementById('mainScreen').style.display='block';

      render();
    })
    .catch(function(err){
      document.getElementById('loadingScreen').innerHTML =
        '<div style="text-align:center;color:#dc2626;font-size:14px;">❌ 데이터 불러오기 실패<br><small style="color:#94a3b8;">'+err.message+'</small><br><br>'
        +'<button onclick="loadDashboard()" style="padding:10px 20px;background:#2d7a55;color:#fff;border:none;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;">다시 시도</button></div>';
    });
}

function render() {
  var root = document.getElementById('appRoot');
  var hb = document.getElementById('hdrBackBtn');
  if (VIEW.page==='list') {
    root.innerHTML = buildList();
    if(hb) hb.style.display='none';
  }
  if (VIEW.page==='add')    root.innerHTML = buildAdd();
  if (VIEW.page==='detail') root.innerHTML = buildDetail(VIEW.selectedId);
}

// ══ 목록 ══
function buildList() {
  var filtered = DATA.matches.filter(function(m){
    if (_statusFilter!=='전체' && m['상태']!==_statusFilter) return false;
    if (_searchQ && JSON.stringify(m).toLowerCase().indexOf(_searchQ)===-1) return false;
    return true;
  });

  var counts={};
  DATA.matches.forEach(function(m){ var s=m['상태']||'대기중'; counts[s]=(counts[s]||0)+1; });

  var kpiHtml = STATUS_ORDER.map(function(s){
    var c=STATUS_CFG[s]||{bg:'#f1f5f9',color:'#374151',col:'#94a3b8'};
    var active = _statusFilter===s;
    return '<div class="kpi-card" style="background:'+c.bg+';border-color:'+(active?c.color:'transparent')+';box-shadow:'+(active?'0 0 0 3px '+c.color+'44,0 10px 28px '+c.color+'28':'none')+';transform:'+(active?'translateY(-3px)':'none')+'" onclick="setStatusFilter(\''+s+'\')">'
      +'<div class="kpi-val" style="color:'+c.color+';font-size:'+(active?'34px':'28px')+'">'+(counts[s]||0)+'</div>'
      +'<div class="kpi-lbl" style="color:'+c.color+';font-weight:'+(active?'900':'700')+'">'+(active?'● ':'')+s+'</div>'
      +'</div>';
  }).join('');

  var isBoard = VIEW.listMode==='board';
  var bodyHtml;

  if (isBoard) {
    // ══════ 새 관리자 2단 대시보드 ══════
    var leftStats  = ['대기중', '입력중', '취소'];
    var rightStats = ['매칭완료', '확정완료'];

    bodyHtml = '<div class="cadmin-wrap">';

    // ── [왼쪽] 사이드바: 대기중 / 입력중 / 취소 ──────────────────────────────
    bodyHtml += '<div class="cadmin-sidebar">';
    leftStats.forEach(function(s) {
      var c    = STATUS_CFG[s] || {bg:'#f1f5f9', color:'#374151'};
      var cols = filtered.filter(function(m){ return (m['상태']||'대기중') === s; });
      bodyHtml += '<div class="cadmin-sidebar-sec">';
      bodyHtml += '<div class="cadmin-sec-hdr" style="background:'+c.bg+';color:'+c.color+';">';
      bodyHtml += s+'<span class="cadmin-sec-cnt">'+cols.length+'</span>';
      bodyHtml += '</div>';
      bodyHtml += '<div class="cadmin-sec-body">';
      if (cols.length === 0) {
        bodyHtml += '<div class="cadmin-sec-empty">없음</div>';
      }
      cols.forEach(function(m){ bodyHtml += buildBoardCard(m); });
      bodyHtml += '</div>'; // end cadmin-sec-body
      bodyHtml += '</div>'; // end cadmin-sidebar-sec
    });
    bodyHtml += '</div>'; // end cadmin-sidebar

    // ── [오른쪽] Agenda 완료 리스트: 매칭완료 / 확정완료 ─────────────────────
    bodyHtml += '<div class="cadmin-main">';

    // 헤더
    bodyHtml += '<div class="cadmin-agenda-hdr">';
    bodyHtml += '<div class="cadmin-agenda-hdr-brand">Matching Admin</div>';
    bodyHtml += '<div class="cadmin-agenda-hdr-title">Agenda <span>/ Schedule</span></div>';
    bodyHtml += '<div class="cadmin-agenda-hdr-sub">Completed mentoring schedule</div>';
    bodyHtml += '</div>';

    // 리스트
    var completedItems = filtered.filter(function(m){
      return rightStats.indexOf(m['상태']||'대기중') > -1;
    });

    bodyHtml += '<div class="cadmin-agenda-list">';

    if (completedItems.length === 0) {
      bodyHtml += '<div class="cadmin-empty">완료된 매칭이 없습니다.</div>';
    }

    completedItems.forEach(function(m, idx) {
      var id     = m['매칭ID'] || '';
      var status = m['상태'] || '대기중';
      var c      = STATUS_CFG[status] || {bg:'#f1f5f9', color:'#374151'};
      var db     = parseDateBox(m);

      // 겹치는 슬롯 수
      var matched  = (status === '매칭완료') ? calcMatchedSlots(id) : [];
      var slotCnt  = matched.length;

      // 행 배경 순환 클래스
      var rowCls = 'cadmin-row cadmin-row-' + (idx % 4);

      bodyHtml += '<div class="'+rowCls+'" onclick="showDetail(\''+id+'\')">'; // row open

      // 날짜 셀
      bodyHtml += '<div class="cadmin-date '+db.cls+'">';
      bodyHtml += '<div class="cadmin-dow">'+db.dow+'</div>';
      bodyHtml += '<div class="cadmin-day">'+db.day+'</div>';
      if (db.time) bodyHtml += '<div class="cadmin-time-badge">'+db.time+'</div>';
      bodyHtml += '</div>'; // end cadmin-date

      // 콘텐츠 영역
      bodyHtml += '<div class="cadmin-content">';

      // 제목 행: bullet · 기업명 × 전문가명 · 시간
      bodyHtml += '<div class="cadmin-title-row">';
      bodyHtml += '<span class="cadmin-bullet" style="background:'+c.color+';"></span>';
      bodyHtml += '<span class="cadmin-title">'
        + (m['기업명']||'-')
        + '<span class="cadmin-title-exp"> × '+(m['전문가명']||'-')+'</span>'
        + '</span>';
      if (db.time) bodyHtml += '<span class="cadmin-time">'+db.time+'</span>';
      bodyHtml += '</div>'; // end cadmin-title-row

      // 메타 행: 상태 · 전문분야 · 희망인증 · 확정슬롯 · 슬롯수
      bodyHtml += '<div class="cadmin-meta">';
      bodyHtml += '<span class="cadmin-chip cadmin-chip-status" style="background:'+c.bg+';color:'+c.color+';">'+status+'</span>';
      if (m['전문분야']) bodyHtml += '<span class="cadmin-chip cadmin-chip-field">'+m['전문분야']+'</span>';
      if (m['희망인증']) bodyHtml += '<span class="cadmin-chip cadmin-chip-field">'+m['희망인증']+'</span>';
      if (m['확정슬롯']) bodyHtml += '<span class="cadmin-chip cadmin-chip-slot">📅 '+m['확정슬롯']+'</span>';
      if (slotCnt > 0)  bodyHtml += '<span class="cadmin-chip cadmin-chip-slot">✨ 겹치는 슬롯 '+slotCnt+'개</span>';
      bodyHtml += '</div>'; // end cadmin-meta

      bodyHtml += '</div>'; // end cadmin-content
      bodyHtml += '</div>'; // end cadmin-row
    });

    bodyHtml += '</div>'; // end cadmin-agenda-list
    bodyHtml += '</div>'; // end cadmin-main
    bodyHtml += '</div>'; // end cadmin-wrap

  } else {
    bodyHtml = filtered.length===0
      ? '<div class="empty-state"><div style="font-size:40px;margin-bottom:12px;">📭</div><div style="font-weight:700;margin-bottom:6px;">매칭 내역이 없습니다</div></div>'
      : '<div class="match-list">'+filtered.map(buildMatchCard).join('')+'</div>';
  }
  return '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">'
    +'<div><div style="font-size:22px;font-weight:900;color:#1a3d2b;letter-spacing:-.5px;">멘토링 상담예약 관리</div>'
    +'<div style="font-size:13px;color:#64748b;margin-top:3px;">배정된 기업-전문가 매칭의 일정 조율 현황</div></div>'
    +'<button class="add-btn" onclick="showAdd()">+ 새 매칭 추가</button>'
    +'</div>'
    +'<div class="kpi-grid">'+kpiHtml+'</div>'
    +'<div class="toolbar">'
    +'<input type="text" placeholder="🔍  기업명, 전문가명 검색..." value="'+_searchQ+'" oninput="_searchQ=this.value;render()">'
    +'<select onchange="_statusFilter=this.value;render()" style="padding:9px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;background:#fff;">'
    +'<option value="전체"'+(_statusFilter==='전체'?' selected':'')+'>전체 상태</option>'
    +STATUS_ORDER.map(function(s){return '<option value="'+s+'"'+(_statusFilter===s?' selected':'')+'>'+s+'</option>';}).join('')
    +'</select>'
    +'<span class="cnt-badge">총 '+filtered.length+'건</span>'
    +'<div class="view-tabs">'
    +'<button class="view-tab'+(isBoard?' active':'')+'" onclick="VIEW.listMode=\'board\';render()">⬛ 보드</button>'
    +'<button class="view-tab'+(!isBoard?' active':'')+'" onclick="VIEW.listMode=\'list\';render()">≡ 목록</button>'
    +'</div>'
    +'</div>'
    + bodyHtml;
}

function buildBoardCard(m) {
  var id = m['매칭ID']||'';
  var compAvail = DATA.avail.filter(function(a){return a['매칭ID']===id&&a['역할']==='기업';}).length;
  var expAvail  = DATA.avail.filter(function(a){return a['매칭ID']===id&&a['역할']==='전문가';}).length;
  var matched   = calcMatchedSlots(id);

  return '<div class="board-card" onclick="showDetail(\''+id+'\')">'
    +'<div class="board-card-top">'
    +'<div>'
    +'<div class="board-card-company">'+(m['기업명']||'-')+'</div>'
    +'<div class="board-card-expert">👨‍💼 '+(m['전문가명']||'-')+'</div>'
    +'</div>'
    +(matched.length>0?'<span style="font-size:10px;padding:3px 7px;border-radius:6px;background:#c8e6d4;color:#155a38;font-weight:800;white-space:nowrap;">✨'+matched.length+'</span>':'')
    +'</div>'
    +'<div class="board-card-meta">'
    +(m['전문분야']?'<span class="chip" style="background:#f1f5f9;color:#475569;">🎓 '+m['전문분야']+'</span>':'')
    +(m['희망인증']?'<span class="chip" style="background:#e8f5ef;color:#1a6640;">📋 '+m['희망인증']+'</span>':'')
    +(m['확정슬롯']?'<span class="chip" style="background:#e8f5ef;color:#155a38;">📅 '+m['확정슬롯']+'</span>':'')
    +'</div>'
    +'<div class="avail-bar" style="margin-top:10px;">'
    +'<div class="avail-dot" style="background:'+(compAvail>0?'#3a9e6e':'#e2e8f0')+'" title="기업 가용시간"></div>'
    +'<div class="avail-dot" style="background:'+(expAvail>0?'#4ab87a':'#e2e8f0')+'" title="전문가 가용시간"></div>'
    +'</div>'
    +'<div style="display:flex;gap:5px;margin-top:6px;">'
    +'<span style="font-size:10px;color:'+(compAvail>0?'#155a38':'#94a3b8')+';font-weight:700;">🏢 '+(compAvail>0?'완료':'미입력')+'</span>'
    +'<span style="font-size:10px;color:#94a3b8;margin:0 2px;">·</span>'
    +'<span style="font-size:10px;color:'+(expAvail>0?'#1a6640':'#94a3b8')+';font-weight:700;">👨‍💼 '+(expAvail>0?'완료':'미입력')+'</span>'
    +'</div>'
    +'</div>';
}

function buildMatchCard(m) {
  var id=m['매칭ID']||''; var stat=m['상태']||'대기중';
  var c=STATUS_CFG[stat]||{bg:'#f1f5f9',color:'#374151'};
  var compAvail=DATA.avail.filter(function(a){return a['매칭ID']===id&&a['역할']==='기업';}).length;
  var expAvail =DATA.avail.filter(function(a){return a['매칭ID']===id&&a['역할']==='전문가';}).length;
  var matched  =calcMatchedSlots(id);

  return '<div class="match-card" onclick="showDetail(\''+id+'\')">'
    +'<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;">'
    +'<div style="flex:1;min-width:0;">'
    +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap;">'
    +'<span style="font-size:16px;font-weight:900;color:#1a3d2b;">'+(m['기업명']||'-')+'</span>'
    +'<span style="color:#cbd5e1;font-size:13px;">↔</span>'
    +'<span style="font-size:14px;font-weight:800;color:#374151;">'+(m['전문가명']||'-')+'</span>'
    +'<span class="badge" style="background:'+c.bg+';color:'+c.color+';">'+stat+'</span>'
    +(m['확정슬롯']?'<span style="font-size:12px;color:#155a38;background:#e8f5ef;padding:3px 9px;border-radius:20px;border:1px solid #8dcaab;font-weight:700;">📅 '+m['확정슬롯']+'</span>':'')
    +'</div>'
    +'<div style="font-size:12px;color:#64748b;display:flex;gap:14px;flex-wrap:wrap;align-items:center;">'
    +'<span>👤 '+(m['기업담당자']||'-')+'</span>'
    +'<span>🎓 '+(m['전문분야']||'-')+'</span>'
    +(m['희망인증']?'<span>📋 '+m['희망인증']+'</span>':'')
    +'<span style="color:#cbd5e1;font-size:11px;">'+(m['생성일시']||'')+'</span>'
    +'</div></div>'
    +'<div style="flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;">'
    +'<span style="font-size:12px;padding:4px 10px;border-radius:7px;font-weight:700;background:'+(compAvail>0?'#c8e6d4':'#fee2e2')+';color:'+(compAvail>0?'#155a38':'#991b1b')+';">🏢 기업 '+(compAvail>0?'✓ 완료':'미입력')+'</span>'
    +'<span style="font-size:12px;padding:4px 10px;border-radius:7px;font-weight:700;background:'+(expAvail>0?'#e0f2ec':'#fee2e2')+';color:'+(expAvail>0?'#1a6640':'#991b1b')+';">👨‍💼 전문가 '+(expAvail>0?'✓ 완료':'미입력')+'</span>'
    +(matched.length>0?'<span style="font-size:12px;padding:4px 10px;border-radius:7px;font-weight:800;background:#c8e6d4;color:#155a38;border:1px solid #c4b5fd;">✨ 겹치는 슬롯 '+matched.length+'개</span>':'')
    +'</div></div></div>';
}

// ══ 새 매칭 추가 ══
function buildAdd() {
  var f=FORM;
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:calc(100vh - 62px);">'

    // 왼쪽: 안내 패널
    +'<div style="background:linear-gradient(160deg,#1a3d2b 0%,#2d7a55 60%,#3a9e6e 100%);padding:52px 44px;display:flex;flex-direction:column;justify-content:center;">'
    +'<div style="font-size:13px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;">New Matching</div>'
    +'<div style="font-size:32px;font-weight:900;color:#fff;letter-spacing:-.8px;line-height:1.2;margin-bottom:12px;">새 멘토링<br>매칭 추가</div>'
    +'<div style="font-size:15px;color:rgba(255,255,255,.75);line-height:1.8;margin-bottom:36px;">기업과 전문가를 연결하면<br>자동으로 이메일이 발송되고<br>가용시간 조율이 시작됩니다.</div>'

function buildDetail(matchId) {

  var c=STATUS_CFG[stat]||{bg:'#f1f5f9',color:'#374151'};
  var compRows=DATA.avail.filter(function(a){return a['매칭ID']===matchId&&a['역할']==='기업';});

    +'</div>'

    +'<div class="detail-grid">'
    +[['기업명',m['기업명']],['전문가명',m['전문가명']],['기업담당자',m['기업담당자']],['전문분야',m['전문분야']],
      ['기업이메일',m['기업이메일']],['전문가이메일',m['전문가이메일']],['희망인증',m['희망인증']],['확정슬롯',m['확정슬롯']||'-']]
      .map(function(kv){return '<div class="detail-field"><div class="detail-key">'+kv[0]+'</div><div class="detail-val">'+(kv[1]||'-')+'</div></div>';}).join('')
    +'</div></div>'

    +'</div>';

  var color =role==='기업'?'#2d7a55':'#1a6640';
  var bg    =role==='기업'?'#e8f5ef':'#f0faf5';
  var border=role==='기업'?'#a0d4b8':'#8dcaab';
  var has   =rows.length>0;
  var body  =has
    ?rows.map(function(r){
        var times=(r['시간목록']||'').split(',').filter(Boolean);
        return '<div class="avail-row">'
          +'<span class="avail-date-lbl" style="color:'+color+';">'+dispDate(r['날짜'])+'</span>'
          +'<div class="avail-times">'+times.map(function(t){return '<span class="time-chip">'+t+'</span>';}).join('')+'</div>'
          +'</div>';
      }).join('')
    :'<div style="font-size:13px;color:#94a3b8;padding:8px 0;">아직 입력되지 않았습니다.</div>';

  return '<div class="avail-box" style="background:'+bg+';border-color:'+border+';">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">'
    +'<div style="font-size:14px;font-weight:800;color:'+color+';">'+(role==='기업'?'🏢':'👨‍💼')+' '+(name||role)+' 가용시간</div>'
    +'<span style="font-size:12px;padding:4px 11px;border-radius:20px;font-weight:700;background:'+(has?'#c8e6d4':'#fee2e2')+';color:'+(has?'#155a38':'#991b1b')+';">'+(has?'✓ 입력완료':'미입력')+'</span>'
    +'</div>'+body+'</div>';
}

      +'background:'+(isConf?'#e8f5ef':'#fff')+';border-radius:11px;border:1.5px solid '+(isConf?'#3a9e6e':'#daeee3')+';gap:10px;">'
      +'<div style="display:flex;align-items:center;gap:10px;">'
      +'<span style="font-size:15px;font-weight:900;color:#1a3d2b;">'+s.label+'</span>'
      +(isConf?'<span style="font-size:11px;color:#5b21b6;font-weight:800;background:#ede9fe;padding:2px 9px;border-radius:6px;">✓ 확정됨</span>':'')
      +'</div>';

        +MEET_TYPES.map(function(mt){

    var h='<div style="font-size:11px;font-weight:900;color:#155a38;margin-bottom:8px;">✅ 선택된 가용시간</div>';
    entries.forEach(function(e){
      h+='<div style="margin-bottom:7px;padding:8px 10px;background:linear-gradient(135deg,#f3faf6,#eef8fb);border-radius:9px;border:1px solid rgba(58,158,110,.12);">'
        +'<div style="font-size:10px;font-weight:800;color:#1a6640;margin-bottom:4px;">'+dispDate(e[0])+'</div>'
        +'<div style="display:flex;flex-wrap:wrap;gap:3px;">'+e[1].map(function(t){return '<span style="background:#3a9e6e;color:#fff;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:700;">'+t+'</span>';}).join('')+'</div>'
        +'</div>';
    });

  var bodyHtml = role

      +'<div class="admin-cal-panel">'

      +'<div class="admin-time-panel">'
      +'<div class="admin-panel-title">🕐 시간 선택</div>'

      +'<div class="admin-time-grid">'

function buildAdminCalendar(dateOptions,slots,selDate) {
  var availSet={};
  dateOptions.forEach(function(d){availSet[d]=true;});
  var months={};
  dateOptions.forEach(function(d){var ym=d.slice(0,7);if(!months[ym])months[ym]=[];months[ym].push(d);});
  var html='';
  Object.keys(months).sort().forEach(function(ym){
    var year=parseInt(ym.slice(0,4)),month=parseInt(ym.slice(5,7));
    var firstDay=new Date(year,month-1,1).getDay();
    var lastDate=new Date(year,month,0).getDate();
    html+='<div class="cal-month-title">'+year+'년 '+month+'월</div>';
    html+='<div class="cal-grid">';
    KO_DAYS.forEach(function(d,i){html+='<div class="cal-day-hdr'+(i===0?' sun':i===6?' sat':'')+'" >'+d+'</div>';});
    for(var e=0;e<firstDay;e++) html+='<div></div>';
    for(var day=1;day<=lastDate;day++){
      var dd=ym+'-'+String(day).padStart(2,'0');
      var dow=new Date(dd+'T00:00:00').getDay();
      var isAvail=!!availSet[dd];
      var isSel=dd===selDate;
      var hasSlots=slots[dd]&&slots[dd].length>0;
      var dowCls=dow===0?' sun-col':dow===6?' sat-col':'';
      if(isAvail){
        var cls='cal-cell avail'+dowCls+(isSel?' selected':hasSlots?' has-slots':'');
        html+='<div id="admcal-'+dd+'" class="'+cls+'" onclick="selectDate(\x27'+dd+'\x27)"><span>'+day+'</span>'+(hasSlots&&!isSel?'<span class="cal-dot"></span>':'')+(isSel?'<span class="cal-dot"></span>':'')+'</div>';
      } else {
        html+='<div class="cal-cell disabled'+dowCls+'">'+day+'</div>';
      }
    }
    html+='</div><div style="margin-bottom:14px;"></div>';
  });
  return html;
}

function toggleTime(date,time){
  if(!AVAIL_INPUT.slots[date]) AVAIL_INPUT.slots[date]=[];
  var idx=AVAIL_INPUT.slots[date].indexOf(time);
  if(idx>-1) AVAIL_INPUT.slots[date].splice(idx,1);
  else{AVAIL_INPUT.slots[date].push(time);AVAIL_INPUT.slots[date].sort();}
  render();
}

// ══ API ══
function submitAdd(){
  var keys=['기업명','기업담당자','기업이메일','기업연락처','전문가명','전문가이메일','전문분야','희망인증','메모'];
  var data={};
  keys.forEach(function(k){var el=document.getElementById('fi-'+k);data[k]=el?el.value.trim():'';});
  var req=['기업명','기업담당자','기업이메일','전문가명','전문가이메일'];
  for(var i=0;i<req.length;i++){if(!data[req[i]]){alert(req[i]+' 은(는) 필수 입력입니다.');return;}}
  var btn=document.getElementById('submitAddBtn');
  if(btn){btn.textContent='전송 중...';btn.disabled=true;}
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'addMatch',data:data})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.ok){data['매칭ID']=res.matchId;data['상태']='대기중';data['생성일시']=new Date().toLocaleString('ko-KR');DATA.matches.push(data);VIEW.page='list';render();alert('✅ 매칭이 추가되었습니다!\n기업 담당자와 전문가에게 이메일이 발송되었습니다.');}
      else{alert('❌ 오류: '+(res.error||'알 수 없는 오류'));if(btn){btn.textContent='매칭 추가 + 이메일 발송';btn.disabled=false;}}
    })
    .catch(function(err){alert('❌ 네트워크 오류: '+err.message);if(btn){btn.textContent='매칭 추가 + 이메일 발송';btn.disabled=false;}});
}

function submitAdminAvail(matchId){
  var input=AVAIL_INPUT;
  if(!input.role){alert('기업 또는 전문가를 선택해주세요.');return;}
  var entries=Object.entries(input.slots).filter(function(e){return e[1].length>0;});
  if(!entries.length){alert('최소 1개 이상의 시간을 선택해주세요.');return;}
  var data={matchId:matchId,역할:input.role,이름:input.name,slots:entries.map(function(e){return{date:e[0],times:e[1]};})};
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'submitAvail',data:data})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.ok){entries.forEach(function(e){DATA.avail.push({매칭ID:matchId,역할:input.role,이름:input.name,날짜:e[0],시간목록:e[1].join(','),입력일시:new Date().toLocaleString('ko-KR')});});AVAIL_INPUT.slots={};render();alert('✅ '+input.role+' 가용시간이 저장되었습니다.');}
      else{alert('❌ 오류: '+(res.error||'알 수 없는 오류'));}
    })
    .catch(function(err){alert('❌ 네트워크 오류: '+err.message);});
}

function confirmSlot(matchId,slot,meetType){
  if(!confirm('['+slot+'] '+meetType+'으로 일정을 확정하시겠습니까?')) return;
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'confirmSlot',data:{matchId:matchId,슬롯:slot,상담방식:meetType}})})
    .then(function(r){return r.json();})
    .then(function(res){

function renderAvailInput(match,role,existingAvail){
  var sc=document.getElementById('availScreen');
  var name=role==='기업'?match['기업담당자']:match['전문가명'];
  var matchId=match['매칭ID'];
  var myAvail=existingAvail.filter(function(a){return a['매칭ID']===matchId&&a['역할']===role;});
  var alreadySub=myAvail.length>0;

  var dateOptions=[];
  var today=new Date();
  for(var i=1;i<=60;i++){
    var d=new Date(today);d.setDate(today.getDate()+i);
    if(d.getDay()===0||d.getDay()===6) continue;
    dateOptions.push(toDateStr(d));
  }

  window._availSlots={};
  window._availMatchId=matchId;
  window._availRole=role;
  window._availName=name;

  if(alreadySub){
    myAvail.forEach(function(a){
      var times=(a['시간목록']||'').split(',').filter(Boolean);
      if(times.length>0) window._availSlots[normDate(a['날짜'])]=times;
    });
  }
  window._availSelDate=dateOptions[0]||'';
  sc.innerHTML=buildAvailPageHTML(match,role,name,dateOptions,alreadySub);
}

function toggleAvailTime(time){
  var date=window._availSelDate; if(!date) return;
  if(!window._availSlots[date]) window._availSlots[date]=[];

  if(idx>-1) window._availSlots[date].splice(idx,1);
  else{window._availSlots[date].push(time);window._availSlots[date].sort();}

  var btn=document.getElementById('timebtn-'+time.replace(':','-'));
  if(btn){var isOn=window._availSlots[date].includes(time);btn.className='time-btn'+(isOn?' on':'');}

    var has=window._availSlots[date].length>0;

// ── 완료 리스트 날짜 파싱 헬퍼 ──────────────────────────────────────────────
function parseDateBox(m) {
  var status = m['상태'] || '대기중';
  var id     = m['매칭ID'] || '';

  // 확정완료 + 확정슬롯 있음 → 확정슬롯 기준
  if (status === '확정완료' && m['확정슬롯']) {
    return parseSlotLabel(m['확정슬롯'], 's-confirmed');
  }
  // 매칭완료 → 겹치는 슬롯 첫 번째 기준
  if (status === '매칭완료') {
    var matched = calcMatchedSlots(id);
    if (matched.length > 0) {
      return parseSlotFromDateStr(matched[0].date, matched[0].time, 's-matched');
    }
    // 겹치는 슬롯 없음
    return { dow: '매칭', day: '대기', time: '', cls: 's-pending', slotCnt: 0 };
  }
  // 확정완료인데 슬롯 없음 (예외 케이스)
  return { dow: '일정', day: '미정', time: '', cls: 's-pending', slotCnt: 0 };
}

function parseSlotLabel(label, cls) {
  var KD = ['일','월','화','수','목','금','토'];
  // 시간 추출
  var timeMatch = label.match(/(\d{1,2}:\d{2})/);
  var time = timeMatch ? timeMatch[1] : '';
  // YYYY-MM-DD 또는 YYYY.MM.DD 형태
  var fullDate = label.match(/(\d{4})[-.](\d{1,2})[-.](\d{1,2})/);
  if (fullDate) {
    var d = new Date(fullDate[1]+'-'+fullDate[2].padStart(2,'0')+'-'+fullDate[3].padStart(2,'0')+'T00:00:00');
    if (!isNaN(d.getTime())) {
      return { dow: KD[d.getDay()], day: d.getDate(), time: time, cls: cls };
    }
  }
  // MM월 DD일 / MM.DD 형태
  var monthDay = label.match(/(\d{1,2})[월./](\d{1,2})/);
  if (monthDay) {
    return { dow: parseInt(monthDay[1])+'월', day: parseInt(monthDay[2]), time: time, cls: cls };
  }
  return { dow: '완료', day: '일정', time: time, cls: cls };
}

function parseSlotFromDateStr(dateStr, time, cls) {
  var KD = ['일','월','화','수','목','금','토'];
  var d = new Date(dateStr + 'T00:00:00');
  if (!isNaN(d.getTime())) {
    return { dow: KD[d.getDay()], day: d.getDate(), time: time, cls: cls };
  }
  return { dow: '매칭', day: '완료', time: time, cls: cls };
}

function calcMatchedSlots(matchId){
  var compRows=DATA.avail.filter(function(a){return a['매칭ID']===matchId&&a['역할']==='기업';});
  var expRows =DATA.avail.filter(function(a){return a['매칭ID']===matchId&&a['역할']==='전문가';});
  if(!compRows.length||!expRows.length) return [];
  var compMap={},expMap={};
  compRows.forEach(function(r){compMap[normDate(r['날짜'])]=(r['시간목록']||'').split(',').filter(Boolean);});
  expRows.forEach(function(r){expMap[normDate(r['날짜'])]=(r['시간목록']||'').split(',').filter(Boolean);});
  var matched=[];
  Object.keys(compMap).forEach(function(date){
    if(!expMap[date]) return;
    var set={};expMap[date].forEach(function(t){set[t]=true;});
    compMap[date].forEach(function(t){if(set[t])matched.push({date:date,time:t,label:dispDate(date)+' '+t});});
  });
  return matched.sort(function(a,b){return a.date.localeCompare(b.date)||a.time.localeCompare(b.time);});
}

function getUrlParams(){
  var p={};
  window.location.search.replace(/[?&]+([^=&]+)=([^&]*)/gi,function(_,k,v){p[k]=decodeURIComponent(v);});
  return p;
}
</script>
