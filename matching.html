<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>종합 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ── CSS 변수 ── */
:root {
  --primary:       #1a8c5a;
  --primary-dark:  #155a38;
  --primary-light: #e8f5ef;
  --mint-bg:       #f0faf5;
  --card-bg:       #ffffff;
  --border:        #e2e8f0;
  --border-light:  #f1f5f9;
  --text-main:     #1a2e22;
  --text-sub:      #374151;
  --text-muted:    #64748b;
  --danger:        #dc2626;
  --warning:       #d97706;
  --success:       #16a34a;
  --info:          #2563eb;
  --sidebar-w:     260px;
  --radius:        14px;
  --radius-sm:     8px;
  --shadow:        0 1px 4px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
  --shadow-md:     0 4px 20px rgba(0,0,0,.08);
  --transition:    .15s ease;
}

/* ── 리셋 & 기본 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: linear-gradient(135deg, #edfbf3 0%, #e8f5ef 40%, #f0f9ff 100%);
  color: var(--text-main);
  min-height: 100vh;
}

/* ── 앱 레이아웃 ── */
.app-layout { display: flex; min-height: 100vh; }

/* ── 왼쪽 고정 사이드바 ── */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 100;
  box-shadow: 2px 0 12px rgba(0,0,0,.04);
}
.sidebar-brand {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 12px;
}
.sidebar-brand-icon {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, #1a8c5a, #0d6e47);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(26,140,90,.32);
}
.sidebar-brand-text { line-height: 1.3; }
.sidebar-brand-name { font-size: 15px; font-weight: 900; color: var(--primary-dark); letter-spacing: -.3px; }
.sidebar-brand-sub  { font-size: 11px; font-weight: 500; color: var(--text-muted); margin-top: 2px; }

.sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 0 14px;
  height: 52px;
  border-radius: 14px;
  font-size: 15px; font-weight: 600;
  color: var(--text-muted);
  cursor: pointer; margin-bottom: 6px;
  transition: all var(--transition);
  user-select: none;
  text-decoration: none;
}
.nav-item:hover { background: var(--mint-bg); color: var(--primary); }
.nav-item.active {
  background: linear-gradient(90deg, #e8f5ef 0%, #f4fbf8 100%);
  color: var(--primary);
  font-weight: 800;
  box-shadow: inset 5px 0 0 var(--primary);
  border: 1px solid rgba(26,140,90,.15);
}
.nav-icon { font-size: 20px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; flex-shrink: 0; }

.sidebar-profile {
  padding: 14px 16px;
  border-top: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; transition: background var(--transition); border-radius: 0 0 0 0;
}
.sidebar-profile:hover { background: var(--mint-bg); }
.profile-avatar {
  width: 44px; height: 44px; min-width: 44px; border-radius: 50%;
  background: linear-gradient(135deg, #1a8c5a, #0d6e47);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; color: #fff;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(26,140,90,.3);
}
.profile-info { flex: 1; min-width: 0; }
.profile-name { font-size: 14px; font-weight: 800; color: var(--text-main); }
.profile-email { font-size: 11px; color: var(--text-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profile-caret { font-size: 12px; color: var(--text-muted); }

/* ── 메인 콘텐츠 ── */
.main-content {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-width: 0;
  padding: 28px 32px 40px;
}

/* ── 상단 헤더 ── */
.page-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 24px; gap: 16px;
}
.page-title {
  font-size: 26px; font-weight: 900; color: var(--text-main);
  letter-spacing: -.6px; line-height: 1.2;
}
.page-desc { font-size: 13px; color: var(--text-muted); margin-top: 5px; }

.add-btn2 {
  padding: 11px 22px;
  background: var(--primary);
  color: #fff;
  border: none; border-radius: 999px;
  font-size: 13.5px; font-weight: 800;
  cursor: pointer; white-space: nowrap;
  font-family: inherit;
  box-shadow: 0 4px 14px rgba(26,140,90,.35);
  transition: all var(--transition);
  flex-shrink: 0;
}
.add-btn2:hover { background: var(--primary-dark); box-shadow: 0 6px 18px rgba(26,140,90,.45); transform: translateY(-1px); }

/* ── KPI 카드 ── */
.kpi-grid2 {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}
.kpi-card2 {
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow);
}
.kpi-card2:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.kpi-active { transform: translateY(-3px) !important; box-shadow: var(--shadow-md) !important; }
.kpi2-icon-wrap {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.kpi2-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
.kpi2-num { font-size: 26px; font-weight: 900; line-height: 1; letter-spacing: -1px; }

/* ── 검색/필터 바 ── */
.toolbar2 {
  display: flex; align-items: center; gap: 10px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}
.search-wrap2 { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; }
.search-icon2 { font-size: 14px; color: var(--text-muted); flex-shrink: 0; }
.search-input2 {
  flex: 1; border: none; outline: none;
  font-size: 13.5px; font-family: inherit; color: var(--text-main);
  background: transparent;
}
.search-input2::placeholder { color: var(--text-muted); }
.status-select2 {
  padding: 7px 12px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px; font-family: inherit;
  outline: none; cursor: pointer; background: #fff;
  color: var(--text-sub);
}
.cnt-badge2 {
  padding: 6px 13px;
  background: var(--border-light); border-radius: 999px;
  font-size: 12px; font-weight: 700; color: var(--text-muted);
  white-space: nowrap;
}
.view-tabs2 { display: flex; gap: 4px; }
.view-tab2 {
  padding: 7px 14px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12.5px; font-weight: 700; cursor: pointer;
  font-family: inherit; color: var(--text-muted);
  background: #fff; transition: all var(--transition);
}
.view-tab2:hover { border-color: var(--primary); color: var(--primary); }
.vt-active { background: var(--primary) !important; color: #fff !important; border-color: var(--primary) !important; }

/* ── 본문 2단 그리드 ── */
.main-body-grid {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 16px;
  align-items: start;
}

/* ── 왼쪽 패널 ── */
.main-left-panel { display: flex; flex-direction: column; gap: 14px; }
.lp-section {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
}
.lp-sec-title {
  font-size: 13px; font-weight: 800; color: var(--text-main);
  margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.lp-chevron { font-size: 11px; color: var(--text-muted); }
.lp-status-row {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition);
  margin-bottom: 2px;
}
.lp-status-row:hover { background: var(--mint-bg); }
.lp-status-active { font-weight: 700; }
.lp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.lp-status-name { font-size: 13px; color: var(--text-sub); flex: 1; }
.lp-cnt {
  font-size: 11px; font-weight: 800;
  padding: 2px 8px; border-radius: 999px;
  min-width: 24px; text-align: center;
}
.lp-req-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 8px; border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition);
  margin-bottom: 2px;
}
.lp-req-row:hover { background: var(--mint-bg); }
.lp-req-icon { font-size: 18px; flex-shrink: 0; }
.lp-req-info { flex: 1; min-width: 0; }
.lp-req-co { font-size: 13px; font-weight: 700; color: var(--text-main); }
.lp-req-ex { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.lp-more-btn {
  text-align: center; padding: 8px;
  font-size: 12px; font-weight: 700; color: var(--primary);
  cursor: pointer; border-top: 1px solid var(--border-light);
  margin-top: 6px; transition: color var(--transition);
}
.lp-more-btn:hover { color: var(--primary-dark); }
.lp-empty { text-align: center; padding: 14px; font-size: 12px; color: var(--text-muted); }

/* ── Agenda 패널 ── */
.main-right-panel {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: visible;
  width: 100%;
  min-width: 0;
}
.agenda-panel-hdr {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border-light);
}
.agenda-cal-icon { font-size: 22px; }
.agenda-panel-title { font-size: 16px; font-weight: 900; color: var(--text-main); letter-spacing: -.3px; }
.agenda-panel-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.agenda-empty { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; }

/* ━━ Agenda Row — 카드형 업무 큐 ━━ */
.ag-row {
  width: 100%;
  display: grid;
  grid-template-columns: 70px minmax(0,1.2fr) minmax(0,1.1fr) minmax(0,.8fr) minmax(0,.65fr) 120px;
  align-items: center;
  gap: 20px;
  padding: 18px 22px;
  background: #fff;
  border-radius: 16px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 2px 10px rgba(15,90,56,.05);
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.ag-row:hover { border-color: #a7f3d0; box-shadow: 0 6px 18px rgba(15,90,56,.09); transform: translateY(-1px); }
.ag-row-highlight { border-color: var(--primary) !important; box-shadow: 0 0 0 2px rgba(26,140,90,.15) !important; }

/* col-1: 상태 배지 박스 (row 전체 아님 — 독립 배지) */
.ag-status-box {
  width: 58px;
  min-height: 54px;
  border-radius: 11px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  flex-shrink: 0;
  border: 1.5px solid transparent;
}
.ag-sb-label { font-size: 9px; font-weight: 700; letter-spacing: .3px; opacity: .85; line-height: 1; margin-bottom: 3px; }
.ag-sb-num   { font-size: 16px; font-weight: 900; letter-spacing: -1px; line-height: 1.1; }
.ag-sb-wait      { background: #fffbeb; color: #92400e; border-color: #fde68a; }
.ag-sb-pending   { background: #fff7ed; color: #9a3412; border-color: #fed7aa; }
.ag-sb-matched   { background: #f0fdfa; color: #134e4a; border-color: #99f6e4; }
.ag-sb-confirmed { background: #eff6ff; color: #1e3a8a; border-color: #bfdbfe; }
.ag-sb-cancel    { background: #fff1f2; color: #881337; border-color: #fecdd3; }

/* col-2: 기업·전문가 */
.ag-info { display: flex; flex-direction: column; justify-content: center; gap: 8px; min-width: 0; }
.ag-title-row { display: flex; align-items: center; gap: 7px; }
.ag-bullet { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.ag-title { font-size: 15px; font-weight: 900; color: #10251a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ag-title-x { color: #94a3b8; font-weight: 400; margin: 0 4px; }
.ag-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
.ag-chip { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
.ag-chip-field  { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
.ag-chip-cert   { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
.ag-chip-slot   { background: #faf5ff; color: #6d28d9; border-color: #ddd6fe; }
.ag-chip-none   { background: #f8fafc; color: #94a3b8; border-color: #e2e8f0; font-style: italic; }

/* col-3: 진행 단계 타임라인 */
.ag-timeline { display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0;
  border-left: 1px solid rgba(226,232,240,.6); padding-left: 20px; }
.ag-tl-label { font-size: 9px; font-weight: 700; color: #94a3b8; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 2px; }
.ag-tl-steps { display: flex; align-items: center; gap: 0; }
.ag-tl-node { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }
.ag-tl-node-done   { background: #1a8c5a; color: #fff; }
.ag-tl-node-curr   { background: #f59e0b; color: #fff; }
.ag-tl-node-next   { background: #e2e8f0; color: #94a3b8; }
.ag-tl-node-cancel { background: #fecdd3; color: #881337; }
.ag-tl-line { flex: 1; height: 2px; background: #e2e8f0; min-width: 8px; }
.ag-tl-line-done { background: #1a8c5a; }
.ag-tl-names { display: flex; align-items: center; margin-top: 2px; }
.ag-tl-name { font-size: 9px; color: #94a3b8; text-align: center; flex: 0 0 26px; line-height: 1.2; white-space: nowrap; overflow: visible; }
.ag-tl-name-gap { flex: 1; min-width: 8px; }
.ag-tl-name-done { color: #1a6640; font-weight: 700; }
.ag-tl-name-curr { color: #d97706; font-weight: 700; }

/* col-4: 다음 조치 */
.ag-next-action { display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0;
  border-left: 1px solid rgba(226,232,240,.6); padding-left: 20px; }
.ag-na-label { font-size: 9px; font-weight: 700; color: #94a3b8; letter-spacing: .6px; text-transform: uppercase; }
.ag-na-card { display: flex; align-items: flex-start; gap: 8px; padding: 9px 11px; border-radius: 10px; font-size: 12px; font-weight: 700; line-height: 1.4; min-height: 44px; }
.ag-na-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.ag-na-text { flex: 1; min-width: 0; }
.ag-na-schedule { font-size: 11px; color: #2563eb; font-weight: 700; }

/* col-5: 메일/링크 상태 */
.ag-mail-status { display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0;
  border-left: 1px solid rgba(226,232,240,.6); padding-left: 20px; }
.ag-ms-label { font-size: 9px; font-weight: 700; color: #94a3b8; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 1px; }
.ag-ms-row { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 8px; }
.ag-ms-name { font-size: 11px; color: #64748b; white-space: nowrap; }
.ag-ms-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; white-space: nowrap; text-align: center; }
.ag-ms-ok   { background: #dcfce7; color: #166534; }
.ag-ms-no   { background: #fff7ed; color: #9a3412; }
.ag-ms-used { background: #eff6ff; color: #1e40af; }
.ag-ms-none { background: #f1f5f9; color: #94a3b8; }
.ag-ms-gen  { background: #f0fdf4; color: #14532d; }

/* col-6: 액션 */
.ag-actions { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 10px; }
.ag-updated { font-size: 11px; color: #94a3b8; white-space: nowrap; }
.ag-action-btns { display: flex; align-items: center; gap: 6px; }
.ag-more-btn { background: none; border: 1.5px solid #e2e8f0; border-radius: 6px; padding: 5px 9px; font-size: 15px; color: #94a3b8; cursor: pointer; transition: all .15s; line-height: 1; font-family: inherit; }
.ag-more-btn:hover { background: #f1f5f9; color: #374151; }
.ag-detail-btn { min-width: 80px; height: 36px; background: #1a8c5a; color: #fff; border: none; border-radius: 10px; padding: 0 14px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background .15s; white-space: nowrap; font-family: inherit; }
.ag-detail-btn:hover { background: #166534; }

/* agenda-list: flex 카드 목록 */
.agenda-list { width: 100%; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-x: auto; }
.match-list { display: flex; flex-direction: column; gap: 12px; }
.match-card { background: var(--card-bg); border-radius: var(--radius); border: 1.5px solid var(--border); padding: 18px 20px; cursor: pointer; transition: all var(--transition); box-shadow: var(--shadow); }
.match-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.empty-state { text-align: center; padding: 60px; color: var(--text-muted); }

/* 반응형 ag-row */
@media (max-width: 1200px) {
  .ag-row { grid-template-columns: 80px minmax(0,1.3fr) minmax(0,1fr) minmax(0,.75fr) 0 120px; gap: 14px; }
  .ag-mail-status { display: none; }
}
@media (max-width: 960px) {
  .ag-row { grid-template-columns: 76px 1fr 0 0 0 110px; gap: 12px; padding: 14px 16px; }
  .ag-timeline, .ag-next-action, .ag-mail-status { display: none; }
}

/* 커서 정책: 텍스트 입력창 제외 전 영역 default */
* { cursor: default; }
input, textarea { cursor: text !important; }
select { cursor: pointer; }
button, [onclick],
.nav-item, .ag-row, .lp-req-row, .lp-status-row,
.kpi-card2, .match-card, .board-card, .view-tab2,
.add-btn2, .ag-more-btn, .ag-detail-btn,
.lp-more-btn, .ag-na-card, .sidebar-profile,
.profile-avatar { cursor: pointer; }


/* ── detail / add 페이지 관련 기존 스타일 ── */
.back-row { display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
.badge { padding:4px 12px; border-radius:999px; font-size:12px; font-weight:800; }
.form-wrap { background:var(--card-bg); border-radius:var(--radius); border:1px solid var(--border); padding:20px; box-shadow:var(--shadow); }
.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.detail-field { display:flex; flex-direction:column; gap:4px; }
.detail-key { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; }
.detail-val { font-size:14px; font-weight:600; color:var(--text-main); }
.avail-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; }
.avail-box { background:var(--card-bg); border-radius:var(--radius); border:1px solid var(--border); padding:14px; box-shadow:var(--shadow); }
.avail-box-hdr { font-size:13px; font-weight:800; margin-bottom:10px; }
.slot-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border-light); font-size:13px; }
.slot-row:last-child { border-bottom:none; }
.slot-date { font-weight:700; color:var(--text-main); }
.slot-times { display:flex; flex-wrap:wrap; gap:4px; }
.slot-time { background:var(--mint-bg); color:var(--primary-dark); padding:2px 8px; border-radius:999px; font-size:12px; font-weight:700; }
.add-form { display:flex; flex-direction:column; gap:14px; }
.add-form label { display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:700; color:var(--text-sub); }
.add-form input, .add-form select { padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:inherit; outline:none; transition:border-color var(--transition); }
.add-form input:focus, .add-form select:focus { border-color:var(--primary); }

/* ── buildAdd() form-field 스타일 ── */
.form-field { display:flex; flex-direction:column; gap:5px; }
.form-field label {
  font-size:11px; font-weight:800; color:var(--text-muted);
  letter-spacing:.4px; text-transform:uppercase;
}
.form-field input, .form-field textarea {
  padding:10px 14px;
  border:1.5px solid var(--border);
  border-radius:10px;
  font-size:13px; font-family:inherit;
  outline:none; color:var(--text-main);
  background:#fff;
  transition:border-color var(--transition), box-shadow var(--transition);
  width:100%;
}
.form-field input:focus, .form-field textarea:focus {
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(26,140,90,.1);
}
.form-field input[required] { border-left:3px solid var(--primary); }

.btn-submit {
  width:100%; padding:15px;
  background:linear-gradient(135deg, var(--primary), var(--primary-dark));
  color:#fff; border:none; border-radius:12px;
  font-size:14px; font-weight:800; font-family:inherit;
  cursor:pointer; letter-spacing:-.2px;
  box-shadow:0 4px 14px rgba(26,140,90,.35);
  transition:all var(--transition);
}
.btn-submit:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(26,140,90,.45); }
.btn-submit:disabled { opacity:.6; cursor:not-allowed; transform:none; }

.add-btn { background:var(--primary); color:#fff; border:none; border-radius:999px; padding:12px 28px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; transition:all var(--transition); }
.add-btn:hover { background:var(--primary-dark); }
.btn-cancel {
  width:100%; padding:12px;
  background:#f8fafc; color:var(--text-sub);
  border:1.5px solid var(--border);
  border-radius:12px;
  font-size:13px; font-weight:700; font-family:inherit;
  cursor:pointer; transition:all var(--transition);
}
.btn-cancel:hover { background:var(--border-light); border-color:#cbd5e1; }

/* ── 로딩 스피너 ── */
#loadingScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:16px; background:linear-gradient(135deg,#edfbf3,#e8f5ef); }
.spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── 일정 입력 화면 (availScreen) ── */
#availScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: #f0faf5;
  overflow-y: auto;
}

/* ── 기존 상세 내부 스타일 호환 ── */
.chip { display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; }
.matched-slot-card { background:var(--mint-bg); border:1.5px solid #a0d4b8; border-radius:var(--radius); padding:14px 18px; margin-bottom:10px; cursor:pointer; transition:all var(--transition); }
.matched-slot-card:hover { border-color:var(--primary); background:#d1fae5; }
.confirm-btn { background:var(--primary); color:#fff; border:none; border-radius:999px; padding:8px 20px; font-size:13px; font-weight:800; cursor:pointer; font-family:inherit; }
.avail-input-wrap { margin-top:16px; background:var(--card-bg); border-radius:var(--radius); border:1px solid var(--border); padding:18px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:10px; }
.cal-day-hdr { text-align:center; font-size:11px; font-weight:700; color:var(--text-muted); padding:4px 0; }
.cal-day-cell { text-align:center; padding:7px 4px; border-radius:6px; font-size:13px; cursor:pointer; border:1.5px solid transparent; transition:all var(--transition); }
.cal-day-cell:hover { background:var(--mint-bg); }
.cal-day-cell.selected { background:var(--primary); color:#fff; }
.cal-day-cell.has-slots { border-color:var(--primary); font-weight:700; }
.cal-day-cell.empty { visibility:hidden; }
.time-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.time-chip { padding:6px 14px; border-radius:999px; border:1.5px solid var(--border); font-size:13px; cursor:pointer; font-family:inherit; transition:all var(--transition); }
.time-chip.selected { background:var(--primary); color:#fff; border-color:var(--primary); }
.time-chip:hover { border-color:var(--primary); }

/* ══ 새 매칭 추가 페이지 ══ */

/* 브레드크럼 헤더 */
.add-page-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 0 18px; margin-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.add-breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.bc-icon { font-size: 14px; color: var(--text-muted); }
.bc-sep { color: var(--border); font-size: 14px; }
.bc-item { color: var(--text-muted); cursor: pointer; transition: color var(--transition); }
.bc-item:hover { color: var(--primary); }
.bc-current { color: var(--text-main); font-weight: 700; cursor: default; }
.add-header-right { display: flex; align-items: center; gap: 12px; }
.add-bell { font-size: 18px; cursor: pointer; color: var(--text-muted); }
.add-user-chip {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 14px; border: 1.5px solid var(--border);
  border-radius: 999px; font-size: 13px; font-weight: 700;
  color: var(--text-sub); cursor: pointer;
  transition: border-color var(--transition);
}
.add-user-chip:hover { border-color: var(--primary); }

/* 메인 카드 */
.add-card {
  display: grid;
  grid-template-columns: 320px 1fr;
  min-height: calc(100vh - 140px);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 28px rgba(0,0,0,.1);
  background: #fff;
}

/* 좌측 안내 패널 */
.add-panel-left {
  background: linear-gradient(160deg, #0f2d1c 0%, #1a5c38 45%, #2d7a55 80%, #3a9e6e 100%);
  position: relative; overflow: hidden;
}
.add-panel-left::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 80% 20%, rgba(255,255,255,.06) 0%, transparent 50%),
    radial-gradient(circle at 20% 80%, rgba(255,255,255,.04) 0%, transparent 40%);
}
.add-panel-left::after {
  content: '';
  position: absolute; right: -40px; top: -40px;
  width: 200px; height: 200px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.07);
  box-shadow: 0 0 0 40px rgba(255,255,255,.03), 0 0 0 80px rgba(255,255,255,.02);
}
.add-panel-inner {
  position: relative; z-index: 1;
  padding: 40px 32px; height: 100%;
  display: flex; flex-direction: column; justify-content: center;
}
.add-panel-eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 2px;
  color: rgba(255,255,255,.55); text-transform: uppercase;
  margin-bottom: 14px;
}
.add-panel-title {
  font-size: 30px; font-weight: 900; color: #fff;
  letter-spacing: -.7px; line-height: 1.2; margin-bottom: 16px;
}
.add-panel-desc {
  font-size: 13.5px; color: rgba(255,255,255,.72);
  line-height: 1.9; margin-bottom: 32px;
}
.add-panel-features { display: flex; flex-direction: column; gap: 18px; margin-bottom: 28px; }
.add-feat-item { display: flex; align-items: flex-start; gap: 13px; }
.add-feat-icon {
  width: 36px; height: 36px; flex-shrink: 0;
  background: rgba(255,255,255,.14); border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: rgba(255,255,255,.9);
  border: 1px solid rgba(255,255,255,.1);
}
.add-feat-title { font-size: 13px; font-weight: 800; color: rgba(255,255,255,.92); margin-bottom: 3px; }
.add-feat-desc { font-size: 11.5px; color: rgba(255,255,255,.6); line-height: 1.6; }
.add-panel-note {
  display: flex; align-items: flex-start; gap: 10px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
  border-radius: 10px; padding: 14px 16px;
  font-size: 12px; color: rgba(255,255,255,.8); line-height: 1.7;
}
.add-panel-note-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

/* 우측 폼 패널 */
.add-panel-right {
  display: flex; flex-direction: column;
  background: #fff; overflow-y: auto;
}
.add-form-wrap {
  flex: 1; padding: 36px 40px 24px;
  display: flex; flex-direction: column; gap: 28px;
}

/* 폼 헤더 */
.add-form-hdr { display: flex; align-items: center; gap: 14px; padding-bottom: 20px; border-bottom: 1px solid var(--border-light); }
.add-form-hdr-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--primary-light); display: flex;
  align-items: center; justify-content: center; font-size: 20px;
  flex-shrink: 0;
}
.add-form-title { font-size: 18px; font-weight: 900; color: var(--text-main); letter-spacing: -.3px; }
.add-form-sub { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

/* 섹션 */
.add-sec { display: flex; flex-direction: column; gap: 16px; }
.add-sec-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; font-weight: 800; color: var(--text-main);
  padding-bottom: 12px; border-bottom: 1.5px solid var(--border-light);
}
.add-sec-icon { font-size: 15px; }
.add-sec-note {
  font-size: 12px; color: var(--text-muted);
  padding: 8px 12px; background: var(--border-light);
  border-radius: 8px; line-height: 1.5;
}

/* 필드 그리드 */
.add-fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.add-field { display: flex; flex-direction: column; gap: 6px; }
.add-label {
  font-size: 12px; font-weight: 700; color: var(--text-sub);
  letter-spacing: .1px;
}
.add-input {
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 13.5px; font-family: inherit; color: var(--text-main);
  background: #fff; outline: none; width: 100%;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.add-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(26,140,90,.1);
}
.add-input[required]:not(:focus) { border-left: 3px solid var(--primary); }
.add-input::placeholder { color: #b0bccc; }

/* 메모 */
.add-memo-wrap { position: relative; }
.add-memo-ta {
  width: 100%; padding: 13px 16px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 13.5px; font-family: inherit; color: var(--text-main);
  resize: vertical; outline: none; min-height: 110px;
  transition: border-color var(--transition), box-shadow var(--transition);
  line-height: 1.6;
}
.add-memo-ta:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,140,90,.1); }
.add-memo-ta::placeholder { color: #b0bccc; }
.add-memo-cnt {
  text-align: right; font-size: 11.5px; color: var(--text-muted);
  margin-top: 5px; padding-right: 2px;
}

/* 액션 바 */
.add-action-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 40px;
  border-top: 1px solid var(--border-light);
  background: #fafbfc;
  gap: 16px; flex-wrap: wrap;
}
.add-action-note {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: var(--text-muted); line-height: 1.6;
}
.add-action-note span:first-child { font-size: 16px; flex-shrink: 0; }
.add-action-btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.add-btn-cancel {
  padding: 10px 20px; border: 1.5px solid var(--border);
  border-radius: 9px; background: #fff; color: var(--text-muted);
  font-size: 13px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all var(--transition);
}
.add-btn-cancel:hover { border-color: #94a3b8; color: var(--text-sub); }

.add-btn-draft {
  padding: 10px 20px; border: 1.5px solid var(--primary);
  border-radius: 9px; background: #fff; color: var(--primary);
  font-size: 13px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all var(--transition);
}
.add-btn-draft:hover { background: var(--primary-light); }

.add-btn-submit {
  padding: 11px 22px;
  background: linear-gradient(135deg, var(--primary), #0f6e42);
  border: none; border-radius: 9px; color: #fff;
  font-size: 13px; font-weight: 800; font-family: inherit;
  cursor: pointer; letter-spacing: -.1px;
  box-shadow: 0 3px 12px rgba(26,140,90,.35);
  transition: all var(--transition);
  white-space: nowrap;
}
.add-btn-submit:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(26,140,90,.45); }
.add-btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }

/* ── 반응형 ── */
@media (max-width: 1100px) {
  .kpi-grid2 { grid-template-columns: repeat(3,1fr); }
  .main-body-grid { grid-template-columns: 220px 1fr; }
}
@media (max-width: 860px) {
  :root { --sidebar-w: 64px; }
  .sidebar-brand-text, .nav-item span:not(.nav-icon), .profile-info, .profile-caret { display:none; }
  .sidebar-brand { justify-content:center; padding:16px 10px; }
  .nav-item { justify-content:center; padding:12px; }
  .sidebar-profile { justify-content:center; }
  .main-body-grid { grid-template-columns: 1fr; }
  .kpi-grid2 { grid-template-columns: repeat(2,1fr); }
  .main-content { padding: 16px; }
  .add-card { grid-template-columns: 1fr; }
  .add-panel-left { min-height: 220px; }
  .add-panel-inner { padding: 28px 24px; justify-content: flex-start; }
  .add-panel-title { font-size: 22px; }
  .add-panel-features { display: none; }
}
@media (max-width: 600px) {
  .kpi-grid2 { grid-template-columns: 1fr 1fr; }
  .detail-grid, .avail-grid { grid-template-columns: 1fr; }
  .toolbar2 { flex-direction:column; align-items:stretch; }
  .search-wrap2 { min-width: unset; }
  .add-fields-grid { grid-template-columns: 1fr; }
  .add-action-bar { flex-direction: column; align-items: stretch; }
  .add-action-btns { justify-content: flex-end; }
  .add-form-wrap { padding: 20px 18px 16px; }
  .add-action-bar { padding: 14px 18px; }
}

/* ══ AVAIL SCREEN CSS ══ */
.avail-page-wrap {
  min-height: 100vh;
  margin-left: 0 !important;
  background:
    radial-gradient(circle at 8% 12%, rgba(182,236,205,.55), transparent 28%),
    radial-gradient(circle at 92% 8%, rgba(189,226,238,.62), transparent 32%),
    linear-gradient(135deg, #edf8f3 0%, #e8f1f8 100%);
}
/* ── 희망시간 입력 페이지 래퍼 ── */
.avail-page-inner {
  max-width: 1160px;
  width: 100%;
  margin: 0 auto;
  padding: 22px 24px 90px;
}

/* 안내 카드 */
.avail-info-card {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.82);
  border-radius: 20px;
  padding: 20px 26px;
  margin-bottom: 20px;
  box-shadow: 0 6px 24px rgba(59,117,94,.1);
}
.avail-info-card-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; flex-shrink: 0;
}
.avail-info-card-name { font-size: 17px; font-weight: 900; color: #1a3d2b; letter-spacing: -.3px; }
.avail-info-card-sub  { font-size: 13px; color: #64748b; margin-top: 2px; }
.avail-warn-badge {
  background: #fffbeb; border: 1.5px solid #fde68a;
  border-radius: 10px; padding: 10px 16px;
  font-size: 12px; color: #92400e; font-weight: 700; flex-shrink: 0;
}

/* ── 3단 Schedule 레이아웃: 날짜 → 시간 → 결과 ── */
.schedule-template-layout {
  display: grid;
  grid-template-columns: minmax(440px, 580px) 185px 340px;
  grid-template-areas: "cal time agenda";
  gap: 16px;
  align-items: start;
  justify-content: center;
  margin-bottom: 20px;
}

/* 공통 패널 베이스 */
.sch-panel {
  background: rgba(255,255,255,.9);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.85);
  border-radius: 20px;
  box-shadow: 0 6px 24px rgba(59,117,94,.1);
}
.sch-panel-title {
  font-size: 12px; font-weight: 900; color: #1a3d2b;
  padding-bottom: 10px; margin-bottom: 14px;
  border-bottom: 1px solid #e4f0e9;
  display: flex; align-items: center; gap: 6px;
}

/* 왼쪽: 월별 캘린더 */
.month-calendar-panel {
  grid-area: cal;
  padding: 22px 24px;
  max-height: calc(100vh - 240px);
  overflow-y: auto;
}
.month-calendar-panel::-webkit-scrollbar { width: 4px; }
.month-calendar-panel::-webkit-scrollbar-thumb { background: #c8e6d4; border-radius: 4px; }
.month-calendar-panel .cal-grid {
  grid-template-columns: repeat(7, minmax(44px, 62px));
  justify-content: center;
  gap: 6px;
}
.month-calendar-panel .cal-cell {
  border-radius: 12px;
  aspect-ratio: auto;
  height: 54px;
  min-height: 54px;
}
.cal-legend {
  display: flex; gap: 14px; font-size: 11px; color: #6a8d81;
  margin-top: 10px; flex-wrap: wrap;
  padding-top: 10px; border-top: 1px solid #e4f0e9;
}
.cal-legend-dot {
  width: 8px; height: 8px; border-radius: 50%; display: inline-block;
}

/* 가운데: 시간 선택 */
.time-ruler-panel {
  grid-area: time;
  padding: 18px 16px;
  position: sticky;
  top: 80px;
}
.time-ruler-date-lbl {
  font-size: 12px; color: #3a9e6e; font-weight: 700;
  margin-bottom: 14px; padding: 7px 12px;
  background: #e8f5ef; border-radius: 9px;
  border: 1px solid #a0d4b8; text-align: center; display: block;
}
.time-ruler-list { display: flex; flex-direction: column; gap: 6px; }
.time-btn {
  width: 100%; padding: 11px; border-radius: 10px;
  cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 800;
  transition: all .15s; text-align: center;
  border: 1.5px solid #daeee3; background: #fff; color: #374151;
}
.time-btn:hover { transform: translateY(-1px); border-color: #3a9e6e; box-shadow: 0 3px 10px rgba(58,158,110,.15); }
.time-btn.on {
  background: linear-gradient(135deg, #3a9e6e, #2d7a55);
  border-color: transparent; color: #fff;
  box-shadow: 0 5px 14px rgba(58,158,110,.28);
}

/* 오른쪽: Agenda 일정 리스트 */
.agenda-panel {
  grid-area: agenda;
  padding: 0;
  position: sticky;
  top: 80px;
  max-height: calc(100vh - 240px);
  overflow-y: auto;
  overflow-x: hidden;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
}
.agenda-panel::-webkit-scrollbar { width: 4px; }
.agenda-panel::-webkit-scrollbar-thumb { background: rgba(58,158,110,.25); border-radius: 4px; }

/* Agenda 패널 헤더 */
.agenda-panel .sch-panel-title {
  padding: 14px 18px 10px;
  margin-bottom: 0;
  background: rgba(255,255,255,.9);
  border-radius: 18px 18px 0 0;
  border-bottom: 1px solid rgba(58,158,110,.1);
  position: sticky;
  top: 0;
  z-index: 2;
  backdrop-filter: blur(10px);
}

/* 일정 리스트 래퍼 */
.agenda-list {
  display: flex;
  flex-direction: column;
}

/* 각 날짜 행 */
.agenda-row {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid rgba(255,255,255,.6);
  transition: background .15s;
  min-height: 64px;
}
.agenda-row:last-child { border-bottom: none; border-radius: 0 0 18px 18px; }
.agenda-row:first-child { border-radius: 0; }
.agenda-row:only-child { border-radius: 0 0 18px 18px; }

/* 날짜 셀 (왼쪽 민트 컬럼) */
.agenda-date-cell {
  flex-shrink: 0;
  width: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 6px;
  background: linear-gradient(180deg, #b2dfc8 0%, #9ed4c4 100%);
  color: #155a38;
  text-align: center;
}
.agenda-row:last-child .agenda-date-cell { border-radius: 0 0 0 18px; }

.agenda-dow {
  font-size: 10px;
  font-weight: 700;
  opacity: .75;
  letter-spacing: .5px;
  text-transform: uppercase;
  line-height: 1;
  margin-bottom: 2px;
}
.agenda-day {
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1px;
}

/* 일정 콘텐츠 (오른쪽 흰색/민트 영역) */
.agenda-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 12px 16px;
  background: linear-gradient(135deg, rgba(232,245,239,.85) 0%, rgba(232,242,247,.85) 100%);
  min-width: 0;
}

.agenda-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.agenda-bullet {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #3a9e6e;
  flex-shrink: 0;
}
.agenda-date-label {
  font-size: 12px;
  font-weight: 800;
  color: #1a3d2b;
  letter-spacing: -.2px;
}

.agenda-times {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-left: 13px;
}
.agenda-time-chip {
  background: rgba(255,255,255,.82);
  border: 1px solid rgba(58,158,110,.22);
  color: #1a6640;
  border-radius: 8px;
  padding: 3px 9px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -.2px;
  backdrop-filter: blur(4px);
}

/* 빈 상태 */
.agenda-empty-wrap {
  padding: 28px 18px;
  background: linear-gradient(135deg, rgba(232,245,239,.7), rgba(232,242,247,.7));
  border-radius: 0 0 18px 18px;
  text-align: center;
}
.agenda-empty-icon { font-size: 32px; margin-bottom: 10px; }
.agenda-empty-title { font-size: 13px; font-weight: 800; color: #1a3d2b; margin-bottom: 5px; }
.agenda-empty-desc  { font-size: 11px; color: #6b9e85; line-height: 1.7; }

/* 제출 버튼 fixed (PC) */
.avail-submit-fixed {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 14px 24px;
  background: rgba(237,248,243,.92);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(58,158,110,.15);
  z-index: 50;
}
.avail-submit-btn {
  display: block;
  max-width: 1160px;
  margin: 0 auto;
  width: 100%;
  padding: 15px;
  border: none; border-radius: 14px;
  background: linear-gradient(135deg, #3a9e6e, #1f6b48);
  color: #fff; font-size: 15px; font-weight: 900;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 6px 20px rgba(58,158,110,.32);
  letter-spacing: -.2px;
}

/* 관리자 직접 입력 3단: 달력 → 시간 → 요약 */
.admin-schedule-layout {
  display: grid;
  grid-template-columns: 1fr 148px 180px;
  grid-template-areas: "cal time summary";
  gap: 14px;
  align-items: start;
}
.admin-cal-panel     { grid-area: cal;     background: #f3faf6; border-radius: 16px; padding: 18px 20px; border: 1px solid #daeee3; }
.admin-time-panel    { grid-area: time;    background: #f3faf6; border-radius: 16px; padding: 16px 14px; border: 1px solid #daeee3; position: sticky; top: 80px; }
.admin-summary-panel { grid-area: summary; background: #f3faf6; border-radius: 16px; padding: 16px 14px; border: 1px solid #daeee3; position: sticky; top: 80px; }
.admin-panel-title { font-size: 12px; font-weight: 900; color: #1a3d2b; margin-bottom: 10px; }
.admin-time-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.admin-time-btn {
  padding: 10px 4px; border-radius: 9px; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 800;
  transition: all .15s; text-align: center;
  border: 1.5px solid #c8e6d4; background: #fff; color: #374151;
}
.admin-time-btn.on {
  background: linear-gradient(135deg, #3a9e6e, #2d7a55);
  border-color: transparent; color: #fff;
}

/* ── 반응형 ── */
@media (max-width: 960px) {
  .schedule-template-layout {
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "cal cal" "time agenda";
    justify-content: stretch;
  }
  .month-calendar-panel { max-height: none; overflow-y: visible; }
  .agenda-panel, .time-ruler-panel { position: static; max-height: none; overflow: visible; }
  .avail-submit-fixed { position: static; background: transparent; border-top: none; padding: 0; backdrop-filter: none; }
  .avail-submit-btn { border-radius: 16px; }
  .admin-schedule-layout {
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "cal cal" "time summary";
  }
}
@media (max-width: 600px) {
  .schedule-template-layout {
    grid-template-columns: 1fr;
    grid-template-areas: "cal" "time" "agenda";
  }
  .time-ruler-list { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .admin-schedule-layout {
    grid-template-columns: 1fr;
    grid-template-areas: "cal" "time" "summary";
  }
}
/* =========================================================
   Board Layout Fix
   관리자 보드 우측 잘림 방지
========================================================= */

/* 관리자 메인 화면은 더 넓게 사용 */
.content {
  max-width: min(1500px, calc(100vw - 80px));
  width: 100%;
  margin: 0 auto;
}

/* 보드 래퍼 */
.board-wrap {
  width: 100%;
  overflow-x: visible;
}

/* 기존 flex 고정폭 대신 5등분 grid */
.board {
  display: grid;
  grid-template-columns: repeat(5, minmax(180px, 1fr));
  gap: 14px;
  min-width: 0;
  width: 100%;
}

/* 컬럼도 고정폭 제거 */
.board-col {
  width: auto;
  min-width: 0;
  flex-shrink: 1;
}

/* 카드 안 긴 텍스트 때문에 밀리는 것 방지 */
.board-card {
  min-width: 0;
}

.board-card-company,
.board-card-expert,
.chip {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 작은 화면에서는 가로 스크롤 허용 */
@media (max-width: 1100px) {
  .board-wrap {
    overflow-x: auto;
  }

  .board {
    display: flex;
    min-width: max-content;
  }

  .board-col {
    width: 260px;
    flex-shrink: 0;
  }
}

/* ══ AV2: 희망시간 선택 화면 ══ */
.av2-wrap {
  min-height: 100vh;
  background: linear-gradient(135deg, #edfbf3 0%, #e8f5ef 45%, #f0f9ff 100%);
  display: flex; flex-direction: column;
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
}
.av2-container {
  width: 100%;
  max-width: 100%;
  padding: 20px 28px 28px;
  box-sizing: border-box;
}

/* ── 헤더 카드 ── */
.av2-header {
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  background: rgba(255,255,255,.95);
  border: 1px solid rgba(226,232,240,.9);
  border-radius: 22px;
  padding: 22px 28px;
  margin-bottom: 20px;
  box-shadow: 0 8px 28px rgba(15,90,56,.08);
  flex-wrap: wrap;
}
.av2-header-left { display: flex; align-items: center; gap: 18px; }
.av2-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, #d1fae5, #a7f3d0);
  border: 2px solid #6ee7b7;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
}
.av2-header-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.av2-step-badge {
  background: #1a8c5a; color: #fff;
  font-size: 10px; font-weight: 900; letter-spacing: 1px;
  padding: 2px 8px; border-radius: 999px;
}
.av2-step-label { font-size: 12px; color: #64748b; font-weight: 600; }
.av2-header-name { font-size: 20px; font-weight: 900; color: #1a2e22; letter-spacing: -.4px; margin-bottom: 6px; }
.av2-header-meta { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #475569; flex-wrap: wrap; }
.av2-header-meta b { color: #1a8c5a; font-weight: 800; }
.av2-meta-sep { color: #cbd5e1; }
.av2-warn-box {
  background: #fffbeb; border: 1.5px solid #fcd34d;
  border-radius: 10px; padding: 12px 18px;
  font-size: 13px; font-weight: 700; color: #92400e;
  white-space: nowrap; flex-shrink: 0;
}

/* ── 본문 3단 ── */
.av2-body {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(0, .55fr) minmax(0, .65fr);
  gap: 16px;
  align-items: stretch;
  margin-bottom: 16px;
}

/* ── 공통 패널 ── */
.av2-panel {
  background: #fff; border-radius: 16px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 2px 8px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.av2-panel-hdr { padding: 18px 20px 12px; border-bottom: 1px solid #f1f5f9; }
.av2-agenda-hdr { display: flex; align-items: center; justify-content: space-between; }
.av2-panel-title {
  display: flex; align-items: center; gap: 9px;
  font-size: 15px; font-weight: 900; color: #1a2e22; margin-bottom: 3px;
}
.av2-panel-sub { font-size: 12px; color: #64748b; }
.av2-step-num {
  width: 24px; height: 24px; border-radius: 50%;
  background: #1a8c5a; color: #fff;
  font-size: 12px; font-weight: 900;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.av2-total-chip {
  font-size: 11.5px; font-weight: 800;
  background: #dcfce7; color: #166534;

  white-space: nowrap; flex-shrink: 0;
}

/* 전체 커서/선택 차단 */
.av2-wrap * { caret-color: transparent; }
.av2-wrap button, .av2-wrap [onclick] { outline: none; }
.av2-wrap button:focus, .av2-wrap [onclick]:focus { outline: none; }

/* ── 달력 패널 ── */
.av2-cal-panel { flex: 1; }
.av2-cal-hdr { display: flex; align-items: flex-start; justify-content: space-between; }
.av2-cal-nav { display: flex; align-items: center; gap: 6px; }
.av2-nav-btn {

.av2-nav-btn:hover:not(:disabled) { border-color: #1a8c5a; color: #1a8c5a; background: #f0fdf4; }
.av2-nav-btn:disabled { color: #cbd5e1; cursor: default; }
.av2-nav-today { font-size: 12px; }

.av2-cal-grid {

.av2-dow.av2-sat { color: #3b82f6; }

.av2-day * {

  caret-color: transparent; outline: none;

.av2-dot {

.av2-legend-dot.avail { background: #f0fdf4; border: 1.5px solid #1a8c5a; }
.av2-legend-dot.dis { background: #f1f5f9; border: 1.5px solid #e2e8f0; }

/* ── 시간 선택 패널 ── */

.av2-time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 18px 18px; }
.av2-sel-date-box {
  margin: 14px 18px 12px;

.av2-time-btn {
  min-height: 52px; padding: 10px 8px;

  background: #fff; color: #374151;

.av2-time-btn:hover { border-color: #1a8c5a; background: #f0fdf4; color: #1a8c5a; }
.av2-time-btn.on {
  background: #1a8c5a; color: #fff;
  border-color: #155a38;
  box-shadow: 0 2px 8px rgba(26,140,90,.3);
}
.av2-check { font-size: 11px; }
.av2-time-legend {
  display: flex; gap: 10px; padding: 10px 18px 16px;
  border-top: 1px solid #f1f5f9; flex-wrap: wrap;
}

/* ── 선택 요약 패널 ── */
.av2-agenda-panel { display: flex; flex-direction: column; }
.av2-agenda-scroll {
  flex: 1;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
  overflow-y: auto;

.av2-agenda-item {

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   레이아웃 오버플로 수정 — 1440px 이하 노트북 대응
   ag-row 고정 minmax 하한값 제거 + 컬럼 단계적 축소
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
@media (max-width: 1440px) {
  /* left panel 줄여서 right panel 공간 확보 */
  .main-body-grid { grid-template-columns: 230px 1fr; }
  /* 4컬럼 유지: 상태 | 제목+타임라인 | 메일상태 | 버튼 */
  .ag-row {
    grid-template-columns: 70px minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,.75fr) 0 112px;
    gap: 16px;
  }
}

@media (max-width: 1320px) {
  .main-body-grid { grid-template-columns: 210px 1fr; }
  /* 3컬럼: 상태 | 제목+타임라인 | 버튼 */
  .ag-row {
    grid-template-columns: 66px minmax(0,1.1fr) minmax(0,1fr) 0 0 108px;
    gap: 14px;
  }
  .ag-mail-status { display: none; }
}

@media (max-width: 1200px) {
  .main-body-grid { grid-template-columns: 200px 1fr; }
  /* 2컬럼: 상태 | 제목 | 버튼 */
  .ag-row {
    grid-template-columns: 62px minmax(0,1fr) 0 0 0 104px;
    gap: 12px;
    padding: 16px 18px;
  }
  .ag-mail-status,
  .ag-next-action { display: none; }
}

/* ag-row 자체에 가로스크롤 허용 (최후 안전망) */
.agenda-list-inner {
  width: 100%;
  min-width: 0;
  overflow-x: auto;
}
/* ── 섹션 라우터: 대시보드 / 플레이스홀더 ── */
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
.dash-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px 18px; box-shadow: var(--shadow); }
.dash-card-total { border-color: var(--primary); background: linear-gradient(135deg,#f0faf5,#fff); }
.dash-card-num { font-size: 30px; font-weight: 900; letter-spacing: -1px; color: var(--primary-dark); }
.dash-card-label { font-size: 13px; font-weight: 700; color: var(--text-muted); margin-top: 4px; }
.section-note { font-size: 13px; color: var(--text-muted); background: var(--mint-bg); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 14px 16px; }
.section-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 64px 24px; background: var(--card-bg); border: 1.5px dashed var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.section-empty-icon { font-size: 44px; margin-bottom: 14px; opacity: .85; }
.section-empty-title { font-size: 17px; font-weight: 800; color: var(--text-sub); }
.section-empty-sub { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
/* ── 토스트 알림 ── */
.toast-wrap { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast {
  display: flex; align-items: flex-start; gap: 10px;
  min-width: 260px; max-width: 380px;
  padding: 13px 16px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-left: 4px solid var(--text-muted);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md);
  font-size: 13.5px; font-weight: 600; line-height: 1.45; color: var(--text-sub);
  pointer-events: auto;
  animation: toastIn .22s ease;
}
.toast.toast-out { animation: toastOut .25s ease forwards; }
.toast-success { border-left-color: var(--success); }
.toast-error   { border-left-color: var(--danger); }
.toast-info    { border-left-color: var(--info); }
.toast-icon { font-size: 16px; flex-shrink: 0; line-height: 1.4; }
.toast-msg { flex: 1; white-space: pre-line; }
@keyframes toastIn  { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateX(24px); } }

/* ── 키보드 접근성: 포커스 표시 ── */
.nav-item:focus-visible,
.kpi-card2:focus-visible,
.lp-req-row:focus-visible,

.embed-frame-wrap {

}
.embed-frame { width: 100%; height: 100%; border: 0; display: block; }
@media (max-width: 860px) { .embed-frame-wrap { height: calc(100vh - 150px); } }

<html lang="ko">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh;}

/* ── 업로드 ── */
#uploadScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 60%,#7c3aed 100%);padding:40px 20px;}
.upload-card{background:#fff;border-radius:24px;padding:52px 56px;max-width:520px;width:100%;box-shadow:0 32px 80px rgba(0,0,0,.25);text-align:center;}

.upload-title{font-size:22px;font-weight:800;color:#1e3a5f;margin-bottom:6px;}
.upload-subtitle{font-size:14px;color:#6b7280;margin-bottom:36px;line-height:1.6;}
.drop-zone{border:2.5px dashed #93c5fd;border-radius:16px;padding:40px 24px;background:#eff6ff;cursor:pointer;transition:all .2s;margin-bottom:20px;}
.drop-zone:hover,.drop-zone.drag-over{border-color:#2563eb;background:#dbeafe;transform:scale(1.01);}
.drop-icon{font-size:40px;margin-bottom:12px;}
.drop-text{font-size:15px;font-weight:600;color:#1d4ed8;margin-bottom:6px;}
.drop-sub{font-size:13px;color:#6b7280;}
.upload-btn{display:block;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:14px 36px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:none;width:100%;font-family:inherit;}
.upload-btn:hover{opacity:.9;}
.upload-hint{font-size:12px;color:#9ca3af;margin-top:16px;}
#uploadError{color:#dc2626;font-size:13px;margin-top:12px;display:none;}

/* ── 헤더 ── */
#dashScreen{display:none;}
.header{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);padding:0 16px;display:flex;align-items:center;gap:0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.18);height:56px;}
.header-brand{display:flex;align-items:center;gap:10px;padding-right:16px;flex-shrink:0;}
.header-icon{width:32px;height:32px;background:rgba(255,255,255,.15);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.header-title{color:#fff;font-weight:700;font-size:14px;white-space:nowrap;}
.header-sub{color:rgba(255,255,255,.6);font-size:11px;margin-top:2px;white-space:nowrap;}
.header-tabs{display:none;}
.back-btn{width:34px;height:34px;border:none;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;border-radius:8px;margin-left:auto;flex-shrink:0;font-size:17px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.back-btn:hover{background:rgba(255,255,255,.25);}
.mask-btn{height:30px;padding:0 12px;border:none;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;border-radius:8px;margin-left:8px;flex-shrink:0;font-size:11px;font-weight:700;font-family:inherit;display:flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;}
.mask-btn:hover{background:rgba(255,255,255,.22);}
.mask-btn.active{background:#fbbf24;color:#1e293b;}
.masked{filter:blur(4px);user-select:none;cursor:default;transition:filter .2s;}
.masked:hover{filter:blur(4px);}

/* ── 2차 탭 네비게이션 ── */
#navBar{display:none;position:sticky;top:56px;z-index:99;background:#fff;border-bottom:1.5px solid #e5e7eb;box-shadow:0 2px 6px rgba(0,0,0,.06);padding:0 20px;}
.nav-tabs{display:flex;align-items:stretch;gap:0;overflow-x:auto;}
.nav-tab{padding:0 16px;height:44px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#6b7280;white-space:nowrap;border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px;transition:color .15s;}
.nav-tab:hover{color:#1e3a5f;}
.nav-tab.active{color:#2563eb;border-bottom-color:#2563eb;}
.nav-tab .nav-cnt{font-size:11px;font-weight:500;background:#f3f4f6;color:#6b7280;padding:1px 6px;border-radius:10px;}
.nav-tab.active .nav-cnt{background:#dbeafe;color:#1d4ed8;}

/* content 높이 조정 (헤더56 + 탭바44 = 100px) */
.content{padding:16px 24px;height:calc(100vh - 100px);overflow:hidden;display:flex;flex-direction:column;}
.tab-content{display:none;flex:1;flex-direction:column;min-height:0;}
.tab-content.active{display:flex;}

/* ── 시트 뷰어 HEIGHT FILL ── */
.sheet-tab-content{flex:1;flex-direction:column;min-height:0;}
.sheet-toolbar{flex-shrink:0;}
.table-wrap{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden;}
.tbl-scroll{flex:1;min-height:0;overflow-x:auto;overflow-y:auto;}

/* ── KPI 카드 ── */
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px;}
.card{border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:transform .15s;}
.card:hover{transform:translateY(-2px);}
.card-icon{font-size:20px;flex-shrink:0;}
.card-label{font-size:11px;color:#6b7280;font-weight:500;white-space:nowrap;}
.card-value{font-size:24px;font-weight:800;line-height:1;}
.card-sub{font-size:10px;color:#9ca3af;margin-top:2px;}

/* ── 박스 ── */
.box{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.box-title{font-weight:700;font-size:13px;margin-bottom:12px;color:#1e3a5f;}
.charts-row{display:grid;grid-template-columns:1.4fr 0.6fr;gap:14px;margin-bottom:14px;}
.charts-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
@media(max-width:800px){.charts-row,.charts-row2{grid-template-columns:1fr;}}
.chart-wrap{position:relative;width:100%;}
.legend-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:7px;font-size:11px;color:#6b7280;}
.legend-dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:3px;vertical-align:middle;}
/* ── 기간 필터 ── */
.date-filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border-radius:12px;padding:10px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.date-filter-bar label{font-size:12px;font-weight:700;color:#1e3a5f;white-space:nowrap;}
.date-filter-bar input[type=month]{border:1.5px solid #d1d5db;border-radius:8px;padding:5px 10px;font-size:12px;outline:none;background:#fff;font-family:inherit;cursor:pointer;}
.date-filter-bar input[type=month]:focus{border-color:#2563eb;}
.date-filter-sep{color:#9ca3af;font-size:13px;}
.df-btn{height:30px;padding:0 12px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.df-btn-apply{background:#2563eb;color:#fff;}
.df-btn-apply:hover{background:#1d4ed8;}
.df-btn-reset{background:#f3f4f6;color:#374151;}
.df-btn-reset:hover{background:#e5e7eb;}
.df-preset{height:28px;padding:0 10px;border:1.5px solid #d1d5db;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;background:#fff;color:#374151;transition:all .15s;white-space:nowrap;}
.df-preset:hover{border-color:#2563eb;color:#2563eb;}
.df-preset.active{background:#dbeafe;border-color:#2563eb;color:#1d4ed8;}
.date-filter-result{font-size:11px;color:#6b7280;white-space:nowrap;padding:4px 10px;background:#f3f4f6;border-radius:6px;}
.stat-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.stat-bar-label{width:150px;text-align:left;color:#374151;font-weight:500;flex-shrink:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-bar-track{flex:1;background:#f3f4f6;border-radius:4px;height:20px;overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px;}
.stat-bar-fill span{color:#fff;font-size:11px;font-weight:700;}

/* ── 시트 뷰어 ── */
.sheet-toolbar{background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.sheet-toolbar input,.sheet-toolbar select{border:1.5px solid #d1d5db;border-radius:8px;padding:6px 10px;font-size:12px;outline:none;background:#fff;font-family:inherit;}
.sheet-toolbar input{flex:1 1 200px;}
.cnt-badge{font-size:12px;color:#6b7280;font-weight:600;white-space:nowrap;padding:4px 10px;background:#f3f4f6;border-radius:6px;}
.rst-btn{background:#fee2e2;color:#dc2626;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl thead{position:sticky;top:0;z-index:1;}
.tbl thead tr{background:#1e3a5f;}
.tbl th{padding:9px 11px;text-align:left;font-weight:700;color:#fff;white-space:nowrap;font-size:11px;}
.tbl tbody tr{border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .1s;}
.tbl tbody tr:nth-child(even){background:#fafafa;}
.tbl tbody tr:hover{background:#eff6ff!important;}
.tbl td{padding:7px 11px;vertical-align:top;}
.cell-ellipsis{max-width:600px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── 뱃지 ── */
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;white-space:nowrap;}
.b-done{background:#d1fae5;color:#065f46;}
.b-proc{background:#fef3c7;color:#92400e;}
.b-blue{background:#dbeafe;color:#1d4ed8;}
.b-purple{background:#ede9fe;color:#5b21b6;}
.b-red{background:#fee2e2;color:#991b1b;}
.b-gray{background:#f3f4f6;color:#374151;}

/* ── 모달 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal{background:#fff;border-radius:18px;padding:24px;max-width:700px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.modal-company{font-size:17px;font-weight:800;color:#1e3a5f;}
.modal-meta{color:#6b7280;font-size:11px;margin-top:3px;}
.modal-close{background:#f3f4f6;border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:15px;flex-shrink:0;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.modal-field{background:#f8fafc;border-radius:8px;padding:8px 12px;}
.modal-key{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;margin-bottom:3px;}
.modal-val{font-size:12px;color:#1e3a5f;word-break:break-all;}
.modal-block{margin-bottom:12px;}
.modal-block-label{font-size:11px;font-weight:700;color:#6b7280;margin-bottom:5px;}
.modal-block-text{font-size:12.5px;color:#1e3a5f;line-height:1.7;background:#f8fafc;border-radius:8px;padding:10px 13px;white-space:pre-wrap;word-break:break-all;}
.modal-block-text.answer{background:#f0fdf4;border-left:3px solid #0e9f6e;}
.hidden{display:none!important;}

/* ── 비밀번호 모달 ── */
.pw-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:2000;}
.pw-card{background:#fff;border-radius:18px;padding:32px 36px;width:320px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;}
.pw-icon{font-size:40px;margin-bottom:12px;}
.pw-title{font-size:16px;font-weight:800;color:#1e3a5f;margin-bottom:6px;}
.pw-sub{font-size:13px;color:#6b7280;margin-bottom:20px;}
.pw-input{width:100%;padding:11px 14px;border:2px solid #d1d5db;border-radius:10px;font-size:15px;letter-spacing:4px;outline:none;text-align:center;font-family:inherit;transition:border .15s;}
.pw-input:focus{border-color:#2563eb;}
.pw-input.error{border-color:#ef4444;animation:shake .3s;}
.pw-btn{margin-top:14px;width:100%;padding:12px;background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.pw-btn:hover{opacity:.9;}
.pw-cancel{margin-top:10px;width:100%;padding:8px;background:none;border:none;color:#9ca3af;font-size:13px;cursor:pointer;font-family:inherit;}
.pw-cancel:hover{color:#374151;}
.pw-err{color:#ef4444;font-size:12px;margin-top:8px;height:16px;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>

<!-- ══ 연결 / 로딩 ══ -->
<div id="uploadScreen">
  <div class="upload-card">
    <div class="upload-logo">🌐</div>

  </div>
</div>

<!-- ══ 대시보드 ══ -->
<div id="dashScreen">

      <div class="header-icon">🌐</div>

        <div class="header-title">해외인증지원단 VOC 대시보드</div>

        </div>
      </div>
      <div class="charts-row2">

        </div>
        <div class="box">

// ── 기간 필터 상태 ──
let DATE_FILTER = { from: null, to: null }; // 'YYYY-MM' 또는 null

function getFilteredRows(rows, dateKey) {
  if (!DATE_FILTER.from && !DATE_FILTER.to) return rows;
  return rows.filter(r => {
    const d = (r[dateKey] || '').slice(0, 7); // 'YYYY-MM'
    if (!d) return false;
    if (DATE_FILTER.from && d < DATE_FILTER.from) return false;
    if (DATE_FILTER.to   && d > DATE_FILTER.to)   return false;
    return true;
  });
}

function applyDateFilter() {
  const from = document.getElementById('dfFrom').value;
  const to   = document.getElementById('dfTo').value;
  DATE_FILTER.from = from || null;
  DATE_FILTER.to   = to   || null;
  document.querySelectorAll('.df-preset').forEach(b => b.classList.remove('active'));
  updateFilterResult();
  buildKPI();
  renderCharts();
}

function resetDateFilter() {
  DATE_FILTER = { from: null, to: null };
  document.getElementById('dfFrom').value = '';
  document.getElementById('dfTo').value   = '';
  document.querySelectorAll('.df-preset').forEach(b => b.classList.remove('active'));
  document.getElementById('dfResult').style.display = 'none';
  buildKPI();
  renderCharts();
}

function setPreset(months) {
  const now = new Date();
  const to = toMonthStr(now);
  const from = toMonthStr(new Date(now.getFullYear(), now.getMonth() - months + 1, 1));
  document.getElementById('dfFrom').value = from;
  document.getElementById('dfTo').value   = to;
  DATE_FILTER = { from, to };
  document.querySelectorAll('.df-preset').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('preset-' + months);
  if (btn) btn.classList.add('active');
  updateFilterResult();
  buildKPI();
  renderCharts();
}

function setPresetYear() {
  const y = new Date().getFullYear();
  const from = `${y}-01`;
  const to   = `${y}-12`;
  document.getElementById('dfFrom').value = from;
  document.getElementById('dfTo').value   = to;
  DATE_FILTER = { from, to };
  document.querySelectorAll('.df-preset').forEach(b => b.classList.remove('active'));
  document.getElementById('preset-year').classList.add('active');
  updateFilterResult();
  buildKPI();
  renderCharts();
}

function toMonthStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  return `${y}-${m}`;
}

function updateFilterResult() {
  const el = document.getElementById('dfResult');
  if (!DATE_FILTER.from && !DATE_FILTER.to) { el.style.display = 'none'; return; }
  const f = DATE_FILTER.from ? DATE_FILTER.from.replace('-', '.') : '시작';
  const t = DATE_FILTER.to   ? DATE_FILTER.to.replace('-',   '.') : '현재';
  el.textContent = `🔍 ${f} ~ ${t} 필터 중`;
  el.style.display = 'inline-block';
}

// ══════════════════════════════════════════════════════════════
//  개인정보 마스킹
// ══════════════════════════════════════════════════════════════
const MASK_PHONE_KEYS = ['연락처','전화','전화번호'];
const MASK_EMAIL_KEYS = ['이메일','email','Email'];
const MASK_NAME_KEYS  = ['기업담당자','기업 담당자','담당자','담당자명','성함','이름'];

function maskPhone(v) {
  if (!v) return v;
  // 010-1234-5678 → 010-****-5678
  const m = v.match(/^(\d{2,3})[- ]?(\d{3,4})[- ]?(\d{4})$/);
  if (m) return `${m[1]}-****-${m[3]}`;
  // 그 외 형식 — 중간 절반 마스킹
  if (v.length <= 4) return '****';
  return v.slice(0, 3) + '****' + v.slice(-2);
}
function maskEmail(v) {
  if (!v || !v.includes('@')) return v;
  const [local, domain] = v.split('@');
  if (!local) return '***@' + domain;
  return local[0] + '***@' + domain;
}
function maskName(v) {
  if (!v || v.length < 2) return v;
  // "홍길동" → "홍**", "홍길동 팀장" → "홍** 팀장"
  const parts = v.split(' ');
  parts[0] = parts[0][0] + '*'.repeat(Math.min(parts[0].length - 1, 2));
  return parts.join(' ');
}
function maskVal(key, v) {
  if (!MASK_ON || !v || v === '-') return v;
  if (MASK_PHONE_KEYS.some(k => key.includes(k))) return maskPhone(v);
  if (MASK_EMAIL_KEYS.some(k => key.includes(k))) return maskEmail(v);
  if (MASK_NAME_KEYS.some(k => key === k))         return maskName(v);
  return v;
}
// ── 비밀번호 설정 (여기서 변경) ──
const PRIVATE_PW = '1234';

function toggleMask() {
  if (!MASK_ON) {
    // 현재 마스킹 해제 상태 → 다시 마스킹 ON (비번 불필요)
    MASK_ON = true;
    const btn = document.getElementById('maskBtn');
    btn.textContent = '🔓 개인정보 보기';
    btn.classList.add('active');
    const modal = document.getElementById('modal');
    if (!modal.classList.contains('hidden') && _lastModalArgs) showRowDetail(_lastModalArgs[0], _lastModalArgs[1]);
    Object.keys(sheetState).forEach(name => renderSheetList(name));
  } else {
    // 현재 마스킹 ON → 비번 확인 후 해제
    document.getElementById('pwInput').value = '';
    document.getElementById('pwErr').textContent = '';
    document.getElementById('pwInput').classList.remove('error');
    document.getElementById('pwModal').classList.remove('hidden');
    setTimeout(() => document.getElementById('pwInput').focus(), 50);
  }
}
function checkPw() {
  const val = document.getElementById('pwInput').value;
  if (val === PRIVATE_PW) {
    closePwModal();
    MASK_ON = false;
    const btn = document.getElementById('maskBtn');
    btn.textContent = '🔒 개인정보 숨김';
    btn.classList.remove('active');
    const modal = document.getElementById('modal');
    if (!modal.classList.contains('hidden') && _lastModalArgs) showRowDetail(_lastModalArgs[0], _lastModalArgs[1]);
    Object.keys(sheetState).forEach(name => renderSheetList(name));
  } else {
    const input = document.getElementById('pwInput');
    input.classList.add('error');
    document.getElementById('pwErr').textContent = '비밀번호가 올바르지 않습니다.';
    input.value = '';
    setTimeout(() => input.classList.remove('error'), 400);
  }
}
function closePwModal() {
  document.getElementById('pwModal').classList.add('hidden');
}

function sv(v) { // safe value
  if (v == null) return '';
  return String(v).replace(/\r?\n/g, ' ').trim();
}

// HTML 이스케이프: innerHTML/속성 보간 시 XSS 방지
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function dateStr(v) {
  if (!v) return '';
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  return String(v).slice(0, 10);
}

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoU3JSnzyWwFmVxPtKWA87bsUTd6i0iMvnzAIniVft5-2b_D7BrsI2CwkSLaIWQRCk/exec';

function initDashboard() {
  const err = document.getElementById('uploadError');
  err.style.display = 'none';

  // 로딩 UI 변경
  document.querySelector('.upload-title').textContent = '데이터를 불러오는 중입니다...';
  document.querySelector('.upload-subtitle').textContent = '구글 시트와 동기화하고 있습니다. 잠시만 기다려주세요.';
  document.getElementById('retryBtn').style.display = 'none';

  fetch(SCRIPT_URL)
    .then(response => response.json())
    .then(data => {
      SHEETS = {};
      Object.keys(data).forEach(name => {
        const rows = data[name];
        const cfg = SHEET_CONFIG[name];
        if (cfg && cfg.dateKey) {
          rows.forEach(r => {
            if (r[cfg.dateKey]) r[cfg.dateKey] = dateStr(r[cfg.dateKey]);
          });
        }
        SHEETS[name] = rows;
      });

      const today = new Date().toLocaleDateString('ko-KR');
      document.getElementById('headerSub').textContent = `2026 전주기/원포인트 진행상황 · ${today} 실시간 연동`;
      document.title = `VOC 대시보드 · 실시간 연동`;

      document.getElementById('uploadScreen').style.display = 'none';
      document.getElementById('dashScreen').style.display = 'block';

      buildTabs();
      buildKPI();
      renderCharts();
    })
    .catch(ex => {
      document.querySelector('.upload-title').textContent = '데이터 불러오기 실패';
      document.querySelector('.upload-subtitle').textContent = '구글 시트 연동에 실패했습니다. 잠시 후 다시 시도해주세요.';
      document.getElementById('retryBtn').style.display = 'block';
      err.style.display = 'block';
      err.textContent = '❌ ' + ex.message;
    });
}
